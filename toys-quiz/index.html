/* Layout: a notebook page — ruled paper, red margin, three stamped stages that unlock in order */
:root{
  --paper:#fbfcf7; --line:#d6e6f2; --margin:#f2a7a2;
  --ink:#1f3047; --soft:#5d6f86;
  --cyan:#1aa6c9; --cyan-bg:#e3f6fb;
  --sun:#ffc531; --good:#2f9e5b; --good-bg:#e2f5e9; --bad:#d9463c; --bad-bg:#fde6e3;
  --card:#ffffff; --lock:#c9d3de; --rule:#8fb0c9; --baseline:#e0584f; --sep:#c3d3e2; --grass1:#d4ecbf; --pink:#e05a8a; --grass2:#c2e2a6;
  --en:"EngTRESS A","Century Gothic",system-ui,sans-serif;
  --grid:"EngTRESS B","EngTRESS A","Century Gothic",system-ui,sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#18222e; --line:#24364a; --margin:#7a3b3b; --ink:#eef3f8; --soft:#9fb1c4;
  --cyan:#4fc7e6; --cyan-bg:#16384a; --sun:#ffcf4d; --good:#5dd18c; --good-bg:#143a27;
  --bad:#ff7a6e; --bad-bg:#46201d; --card:#202e3d; --lock:#3b4b5d; --rule:#5f84a3; --baseline:#ff7a6e; --sep:#3d566e; --grass1:#29452a; --pink:#ff8fb5; --grass2:#223b24; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#18222e; --line:#24364a; --margin:#7a3b3b; --ink:#eef3f8; --soft:#9fb1c4;
  --cyan:#4fc7e6; --cyan-bg:#16384a; --sun:#ffcf4d; --good:#5dd18c; --good-bg:#143a27;
  --bad:#ff7a6e; --bad-bg:#46201d; --card:#202e3d; --lock:#3b4b5d; --rule:#5f84a3; --baseline:#ff7a6e; --sep:#3d566e; --grass1:#29452a; --pink:#ff8fb5; --grass2:#223b24; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;
  background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),
  repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:22px}
header h1{font-family:var(--en);font-weight:400;font-size:clamp(2rem,7vw,2.8rem);line-height:1;margin:0;text-wrap:balance}
header h1 span{font-family:var(--zh);font-size:.55em;font-weight:900;margin-left:.3em}
header p{margin:6px 0 0;color:var(--soft)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.ttl{min-width:0;flex:1 1 300px}
.topbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.sndtip{margin:0;padding:10px 14px;border-radius:12px;background:var(--cyan-bg);color:var(--ink);font-weight:700;line-height:1.6}
.qrbtn{flex:0 0 auto;font:inherit;font-weight:700;padding:8px 14px;border-radius:12px;border:2px solid var(--cyan);background:var(--card);color:var(--cyan);cursor:pointer}
.qrwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(11,22,34,.6);background:color-mix(in srgb,#0b1622 60%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qrcard{background:var(--card);border-radius:20px;padding:22px;display:grid;justify-items:center;gap:12px;max-width:min(560px,100%);max-height:100%;overflow:auto;text-align:center}
.qrt{margin:0;font-size:1.4rem;font-weight:900}
.qrimg{background:#fff;padding:10px;border-radius:12px;width:min(70vh,440px,80vw);aspect-ratio:1;max-width:100%}
.qrimg svg{display:block;width:100%;height:100%}
.qrurl{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;color:var(--soft);word-break:break-all;user-select:all}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{white-space:nowrap;line-height:1.3;font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:999px;border:2px solid var(--lock);color:var(--soft);background:var(--card)}
.step.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-bg)}
.step.done{border-color:var(--good);color:var(--good);background:var(--good-bg)}
section{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
section.locked{opacity:.55}
section h2{margin:0;font-size:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-family:var(--en);background:var(--sun);color:#3a2a00;border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;font-weight:800}
.teacher{margin:0;padding:10px 14px;border-radius:12px;background:var(--sun);color:#3a2a00;font-weight:700}
.tag{font-size:.8rem;font-weight:700;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 10px}
.lockmsg{color:var(--soft);margin:0}
.hint{margin:0;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wcard{border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;justify-items:center;gap:2px;background:var(--paper);cursor:pointer;font:inherit;color:inherit}
.wcard:hover{border-color:var(--cyan)}
.wcard .pic{font-size:2.6rem;line-height:1.1;white-space:nowrap}
.wcard .en{font-size:2rem;width:100%;text-align:center;margin-top:4px}
.wcard .zh{color:var(--soft);font-size:.95rem}
.wcard.hide .en{color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 18px;background:var(--cyan);color:#fff;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--cyan);border:2px solid var(--cyan)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.quiz{display:grid;gap:12px;justify-items:center;text-align:center}
.quiz .pic{font-size:4.5rem;line-height:1}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choice{font-family:var(--en);font-size:1.4rem;font-weight:400;padding:6px 16px;border-radius:12px;border:2px solid var(--cyan);background:var(--cyan-bg);color:var(--ink);cursor:pointer}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right:disabled{opacity:1}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.meter{font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.spell{display:grid;gap:14px}
.sitem{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--line)}
.sitem.ok{border-color:var(--good);background:var(--good-bg)}
.sitem .pic{font-size:2.4rem;text-align:center;line-height:1;white-space:nowrap}
.sitem .zh{font-size:.9rem;color:var(--soft);text-align:center}
.ruled{--top:.3314em;--xh:.7210em;--base:1.1106em;--desc:1.5002em;font-family:var(--en);font-weight:400;line-height:1.4;padding-bottom:.4316em;white-space:pre;letter-spacing:.06em;
  background:linear-gradient(var(--rule),var(--rule)) 0 calc(var(--top) - 1px)/100% 2px no-repeat,
  linear-gradient(var(--rule),var(--rule)) 0 calc(var(--xh) - 1px)/100% 2px no-repeat,
  linear-gradient(var(--baseline),var(--baseline)) 0 calc(var(--base) - 1px)/100% 2px no-repeat,
  linear-gradient(var(--rule),var(--rule)) 0 calc(var(--desc) - 1px)/100% 2px no-repeat}
.write{display:flex;align-items:center;gap:8px;min-width:0}
.sline{display:flex;flex:0 1 auto;min-width:0;font-size:52px;height:1.8316em;padding:0 .35em;letter-spacing:0}
.cell{position:relative;width:.95em;height:100%;cursor:text}
.cell+.cell{border-left:1.5px dashed var(--sep)}
.cell .g{display:block;text-align:center;color:var(--ink);pointer-events:none}
.cell.no .g{color:var(--bad)}
.cell input{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;background:transparent;color:transparent;caret-color:var(--cyan);font:inherit;text-align:center;padding:0 0 .4316em;outline:none}
.cell:focus-within{background:var(--cyan-bg)}
.sitem.bad{border-color:var(--bad)}

/* Sound: the device's English voice (speechSynthesis). It is woken up on the first tap so iPad Safari allows it. */
let voice=null,woke=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google|Natural/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}

async function pinOK(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s)));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')===PIN_HASH}catch(e){return false}}

function sheetWords(r){

  try{const q=qrcode(0,"M");q.addData(url);q.make();$("qrimg").innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}
  catch(e){$("qrimg").textContent="這個網址太長，沒辦法做成 QR Code。"}
