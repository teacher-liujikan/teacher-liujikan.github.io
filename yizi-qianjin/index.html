<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>一字千金聖誕挑戰賽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: classroom TV stage — big slide on the left, team scoreboard rail on the right; stacks on phones.
   Single deliberate look (cream paper like the original Canva deck), not theme-switched. */
:root{
  --paper:#fffdf4; --paper-2:#f6f1de; --ink:#262340; --ink-soft:#6b6680;
  --coral:#e8735a; --pine:#2f7d5b; --pine-soft:#cfe3b0; --gold:#f5b82e; --berry:#d6333f;
  --line:#e6dfc6;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
.app{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:1fr minmax(240px,22vw);grid-template-rows:auto 1fr auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;color:var(--coral);white-space:nowrap}
.brand small{color:var(--ink);font-size:.9rem;margin-left:6px}
.rounds{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.rchip{border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:700}
.rchip.on{border-color:var(--coral);background:var(--coral);color:#fff}
.count{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.9rem}

.stage{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:18px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column}
.slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vh 3vw;text-align:center;position:relative;z-index:1;min-height:0}
canvas.snow{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.bar{grid-column:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{border:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-size:1.05rem;font-weight:700}
.nav:disabled{opacity:.3;cursor:default}
.spacer{flex:1}
.tool{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:1rem;font-weight:700}
.tool.hot{background:var(--pine);border-color:var(--pine);color:#fff}

/* timer */
.timer{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.9rem;min-width:4.2ch;text-align:center;color:var(--ink);background:var(--paper-2);border-radius:12px;padding:2px 10px}
.clock.low{color:var(--berry)}
.clock.done{background:var(--berry);color:#fff;animation:pulse .6s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.08)}}

/* slides */
.title-big{font-family:var(--f-display);font-size:clamp(3rem,13vh,9rem);color:var(--coral);letter-spacing:.25em;margin-right:-.25em;line-height:1.1}
.title-sub{font-family:var(--f-display);font-size:clamp(1.4rem,5vh,3rem);color:var(--ink);letter-spacing:.2em}
.title-note{color:var(--ink-soft);font-size:clamp(.9rem,2.2vh,1.2rem)}
.star{width:clamp(110px,26vh,240px);aspect-ratio:1;max-width:100%}
.round-name{font-family:var(--f-body);font-weight:900;font-size:clamp(2rem,8vh,5rem);letter-spacing:.06em}
.round-name em{font-style:normal;color:var(--coral)}
.round-rule{font-size:clamp(1rem,3vh,1.6rem);color:var(--pine);font-weight:700;max-width:30ch;text-wrap:balance}

.prompt{font-weight:900;font-size:clamp(1.6rem,6.5vh,4rem);line-height:1.25;text-wrap:balance}
.prompt .key{color:var(--berry);font-size:1.35em;display:inline-block;vertical-align:-.12em;margin-inline:.08em}
.rule{font-weight:900;font-size:clamp(1.1rem,4.4vh,2.8rem);color:#9cc46a;line-height:1.35}
.rule b{color:var(--pine)}

.idiom{display:flex;gap:1.5vw;justify-content:center}
.ch{position:relative;font-weight:900;font-size:clamp(3.5rem,20vh,13rem);line-height:1;padding:.08em .06em;border-radius:.12em;background:none;border:none;color:var(--ink);font-family:var(--f-body)}
.ch.marked{background:#fde3dc}
.ch.wrong{color:#c9c2b2;text-decoration:line-through;text-decoration-color:var(--berry);text-decoration-thickness:.07em}
.ch .fix{position:absolute;left:50%;top:-.05em;transform:translate(-50%,-62%);font-size:.42em;color:var(--berry);background:var(--paper);border:3px solid var(--berry);border-radius:.25em;padding:0 .12em;text-decoration:none;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,-30%) scale(.5);opacity:0}}
.full{font-family:var(--f-display);font-size:clamp(1.2rem,4vh,2.4rem);color:var(--pine)}
.hint{color:var(--ink-soft);font-size:clamp(.9rem,2.2vh,1.15rem)}

.answers{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;max-width:min(1000px,100%)}
.answers span{background:var(--paper-2);border:2px solid var(--line);border-radius:10px;padding:.15em .55em;font-weight:700;font-size:clamp(1rem,3.2vh,1.8rem)}
.answers span.two{border-color:var(--gold);background:#fff4d4}
.answers-label{font-weight:700;color:var(--ink-soft);font-size:clamp(.85rem,2vh,1.1rem);width:100%}

/* cross */
.cross-wrap{display:flex;gap:4vw;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;min-height:0}
.cross{position:relative;display:grid;grid-template-columns:repeat(3,var(--c));grid-template-rows:repeat(3,var(--c));--c:clamp(64px,19vh,150px)}
.cell{border:3px dashed var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--c)*.62);background:var(--paper)}
.cell.center{background:#fff6d8}
.cell.filled{color:var(--pine);animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.cross svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.demo-text{max-width:22ch;text-align:left;font-size:clamp(1.1rem,3.6vh,2rem);line-height:1.6;font-weight:700}
.demo-text .tag{display:inline-block;background:#8b74a8;color:#fff;border-radius:12px;padding:.1em .7em;margin-bottom:.4em}
.demo-text .purple{color:#8b74a8}
.legend{display:grid;grid-template-columns:auto auto;gap:.3em 1em;font-size:clamp(1rem,3vh,1.6rem);font-weight:700;text-align:left}
.legend i{display:inline-block;width:1.4em;height:.35em;border-radius:3px;vertical-align:middle;margin-right:.3em}

/* scoreboard */
.board{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:8px;min-height:0}
.board h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;display:flex;align-items:center;gap:8px;margin:0}
.board h2 .mini{margin-left:auto;font-family:var(--f-body);font-size:.8rem;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 8px;color:var(--ink-soft)}
.teams{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}
.team{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;background:var(--paper-2);border-radius:12px;padding:6px 8px;border:2px solid transparent}
.team.lead{border-color:var(--gold);background:#fff4d4}
.tname{font-weight:700;font-size:1rem;white-space:nowrap}
.tscore{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:2rem;text-align:right;line-height:1;min-width:2ch}
.tbtns{grid-column:1/-1;display:flex;gap:4px}
.tbtns button{flex:1;border:none;border-radius:8px;padding:5px 0;font-weight:900;font-size:.95rem;background:var(--pine);color:#fff}
.tbtns button.p2{background:var(--gold);color:var(--ink)}
.tbtns button.m{background:var(--paper);color:var(--ink-soft);border:1.5px solid var(--line)}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.board-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft)}
.board-foot button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:.85rem;color:var(--ink)}
.confirm{background:#fde3dc;border-radius:10px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.confirm button{border:none;border-radius:8px;padding:4px 10px;font-weight:700}
.confirm .yes{background:var(--berry);color:#fff}

/* ranking */
.rank{display:flex;flex-direction:column;gap:1vh;width:min(640px,100%)}
.rank div{display:grid;grid-template-columns:3ch 1fr auto;align-items:center;gap:1em;background:var(--paper-2);border-radius:14px;padding:.4em 1em;font-weight:900;font-size:clamp(1.1rem,3.6vh,2rem)}
.rank div.first{background:#fff4d4;border:3px solid var(--gold)}
.rank .pos{color:var(--coral);font-family:var(--f-display)}
.rank .pts{font-family:var(--f-display);font-variant-numeric:tabular-nums}

@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(420px,62vh) auto auto;height:auto;min-height:100%}
  .board{grid-column:1;grid-row:auto}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .bar{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* setup */
.setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:3vh 3vw;text-align:center;position:relative;z-index:1;overflow:auto}
.setup h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,9vh,5.5rem);color:var(--coral);letter-spacing:.2em;margin:0 -.2em 0 0;line-height:1.1}
.setup .sub{font-family:var(--f-display);font-size:clamp(1.1rem,3.6vh,2rem);letter-spacing:.2em}
.pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.pick .lab{font-weight:900;font-size:clamp(1rem,2.8vh,1.4rem);color:var(--ink-soft);min-width:3em}
.opt{border:3px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:.35em 1em;font-weight:900;font-size:clamp(1.1rem,3.6vh,2rem);font-family:var(--f-body)}
.opt.on{border-color:var(--pine);background:var(--pine);color:#fff}
.go{border:none;background:var(--coral);color:#fff;border-radius:999px;padding:.4em 1.6em;font-family:var(--f-display);font-size:clamp(1.3rem,4.4vh,2.4rem);letter-spacing:.1em;margin-top:1vh}
.go:disabled{opacity:.35;cursor:default}
.src{position:absolute;left:14px;top:10px;z-index:2;background:var(--paper-2);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.bookchip{border:2px solid var(--pine);color:var(--pine);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:700}
.answers span.mine{border-color:var(--pine);background:#e4f0d2}
.answers span small{font-size:.55em;color:var(--ink-soft);margin-left:.3em;font-weight:500}
@media (min-width:821px){.cross-wrap{flex-wrap:nowrap;gap:3vw}.cross-wrap>div:last-child{min-width:0;flex:0 1 440px}.cross{--c:clamp(64px,17vh,140px);flex:none}
 .cross-wrap .answers span{font-size:clamp(.95rem,2.6vh,1.5rem)}}
.lessons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(760px,100%)}
.opt.les{min-width:2.4em;padding:.25em .4em;font-size:clamp(1rem,3.2vh,1.7rem);border-radius:12px;font-variant-numeric:tabular-nums}
.pick.quick{gap:8px}
.mini2{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(.9rem,2.2vh,1.1rem)}
.setup{gap:1.8vh}

/* room overlay */
.ovl{position:fixed;inset:0;background:rgba(38,35,64,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ovl-card{background:var(--paper);border-radius:22px;padding:22px 26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(880px,100%);max-height:100%;overflow:auto}
.qr{background:#fff;padding:12px;border-radius:14px;border:2px solid var(--line);width:min(300px,70vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.qr img,.qr canvas{width:100%!important;height:auto!important}
.ovl-info{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 280px}
.ovl-info h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;color:var(--coral)}
.code{font-family:var(--f-display);font-size:3rem;letter-spacing:.2em;color:var(--ink)}
.url{font-size:.85rem;color:var(--ink-soft);word-break:break-all;user-select:all}
.on-teams{display:flex;gap:6px;flex-wrap:wrap}
.on-teams span{border-radius:999px;padding:3px 12px;font-weight:700;border:2px solid var(--line);color:var(--ink-soft)}
.on-teams span.in{background:var(--pine);border-color:var(--pine);color:#fff}
.ovl-status{font-weight:700;color:var(--pine)}.ovl-status.bad{color:var(--berry)}
.ovl-btns{display:flex;gap:8px;flex-wrap:wrap}
/* answer wall */
.w-head{font-weight:900;font-size:clamp(1.2rem,4vh,2.2rem);display:flex;gap:1em;align-items:baseline;flex-wrap:wrap;justify-content:center}
.wall{display:flex;flex-direction:column;gap:.8vh;width:100%;max-width:1000px;overflow:auto;min-height:0}
.w-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper-2);border-radius:12px;padding:6px 12px;border:2px solid transparent;text-align:left}
.w-row.top{border-color:var(--gold);background:#fff4d4}
.w-row b{font-size:clamp(.95rem,2.6vh,1.3rem);white-space:nowrap}
.w-items{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.w-it{border:2px solid var(--pine);background:#e4f0d2;color:var(--ink);border-radius:8px;padding:0 .4em;font-weight:700;font-size:clamp(1rem,3vh,1.6rem);font-family:var(--f-body)}
.w-it.two{border-color:var(--gold);background:#fff4d4}
.w-it.off{border-color:var(--line);background:var(--paper);color:#b9b3a3;text-decoration:line-through}
.w-none{color:var(--ink-soft);font-style:normal}
.w-pts{font-family:var(--f-display);font-size:clamp(1rem,3vh,1.6rem);white-space:nowrap;font-variant-numeric:tabular-nums}
.w-apply{font-size:clamp(1rem,3vh,1.5rem);margin:0}
/* student tablet */
.stu{height:100%;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center}
.s-top{display:flex;gap:10px;align-items:center;width:100%;max-width:760px;flex-wrap:wrap}
.s-team{border:none;background:var(--pine);color:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:1.1rem}
.s-score{font-weight:700;color:var(--ink-soft)}
.s-clock{margin-left:auto;font-family:var(--f-display);font-size:1.8rem;background:var(--paper-2);border-radius:12px;padding:0 12px;font-variant-numeric:tabular-nums}
.s-clock.low{color:var(--berry)}
.s-main{flex:1;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;width:100%;max-width:760px;text-align:center}
.s-big{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.6rem);color:var(--coral)}
.s-msg{font-size:1.2rem;font-weight:700;color:var(--ink-soft)}
.s-q{font-weight:900;font-size:clamp(1.3rem,5vw,2rem)}
.s-q .key{color:var(--berry);font-size:1.4em}
.s-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;width:100%}
.s-teams button{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:18px 0;font-size:1.5rem;font-weight:900;color:var(--ink);font-family:var(--f-body)}
.s-form{display:flex;gap:8px;width:100%}
.s-form input{flex:1;min-width:0;font-size:1.6rem;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;font-family:var(--f-body);background:#fff;color:var(--ink)}
.s-form button{border:none;background:var(--coral);color:#fff;border-radius:14px;padding:0 22px;font-size:1.3rem;font-weight:900}
.s-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.s-list button{border:2px solid var(--pine);background:#e4f0d2;border-radius:10px;padding:4px 12px;font-size:1.5rem;font-weight:700;color:var(--ink);font-family:var(--f-body)}
.s-list button::after{content:" ×";color:var(--ink-soft);font-size:.7em}
.s-list.lock button::after{content:""}
.s-count{font-weight:700;color:var(--pine)}
.s-fix{display:flex;gap:10px;justify-content:center;width:100%}
.s-fix .col{display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;max-width:150px}
.s-fix .c{width:100%;aspect-ratio:1;border:3px solid var(--line);background:var(--paper);border-radius:16px;font-size:clamp(2.2rem,13vw,5rem);font-weight:900;color:var(--ink);font-family:var(--f-body);padding:0}
.s-fix .c.sel{border-color:var(--berry);background:#fde3dc;color:#b9a79f;text-decoration:line-through}
.s-fix input,.s-cross input{width:100%;box-sizing:border-box;text-align:center;font-size:1.8rem;border:3px solid var(--berry);border-radius:12px;padding:6px 0;font-family:var(--f-body);background:#fff;color:var(--ink)}
.s-fix .right{font-size:1.6rem;font-weight:900;color:var(--pine)}
.s-cross{display:grid;grid-template-columns:repeat(3,min(26vw,130px));grid-template-rows:repeat(3,min(26vw,130px));gap:6px}
.s-cross .mid{display:flex;align-items:center;justify-content:center;font-size:min(16vw,80px);font-weight:900;background:#fff6d8;border:3px dashed var(--ink);border-radius:10px}
.s-cross input{height:100%;font-size:min(14vw,70px);border-style:dashed;border-color:var(--ink);font-weight:900;padding:0}
.s-cross .hintc{font-size:.8rem;color:var(--ink-soft);align-self:center;font-weight:700}
input:disabled{opacity:.6}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand">一字千金<small>聖誕挑戰賽</small></div>
    <button class="bookchip" id="bookchip" hidden></button>
    <button class="bookchip" id="roomBtn">平板連線</button>
    <nav class="rounds" id="rounds"></nav>
    <div class="count" id="count"></div>
  </header>

  <main class="stage" id="stage">
    <canvas class="snow" id="snow"></canvas>
    <div class="src" id="src" hidden></div>
    <section class="setup" id="setup" hidden></section>
    <section class="slide" id="slide"></section>
  </main>

  <div class="bar">
    <button class="nav" id="prev">← 上一頁</button>
    <button class="nav" id="next">下一頁 →</button>
    <div class="spacer"></div>
    <div id="extra" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <div class="timer" id="timerBox" hidden>
      <div class="clock" id="clock">2:00</div>
      <button class="tool" id="tStart">開始</button>
      <button class="tool" id="tReset">重來</button>
      <button class="tool" id="tPlus30">+30 秒</button>
    </div>
  </div>

  <aside class="board">
    <h2>計分板 <button class="mini" id="fs">全螢幕</button></h2>
    <div class="teams" id="teams"></div>
    <div class="board-foot">
      組數
      <button id="tMinus">−</button><b id="tn">6</b><button id="tPlus">＋</button>
      <span class="spacer"></span>
      <button id="resetBtn">分數歸零</button>
    </div>
    <div class="confirm" id="confirm" hidden>確定把所有分數歸零？
      <button class="yes" id="cYes">歸零</button><button id="cNo">取消</button></div>
  </aside>

function buildSlides(){

  for(const o of shuffle(P.p2)){ if(q2.length<4&&!seen.has(o.n)){seen.add(o.n);q2.push(o)} }
  take([...q2,...shuffle(P.p2)],P.A2,4).forEach(o=>out.push(mk('fix',o)));
  out.push({t:'round',r:2});
  const w3=take(shuffle(P.p3),P.A3,3); w3.forEach(o=>out.push(mk('word',o)));
  out.push({t:'round',r:3},{t:'demo',r:3});
  const used=new Set(w3.map(o=>o.g));

  } else if(s.t==='round'){
    const R=ROUNDS[s.r];
    h=`${star(R.n)}<div class="round-name">第${'一二三四'[s.r]}關 ${R.name}</div><div class="round-rule">${R.rule.replace("{T}",tText(room?LONG[R.k]:R.s))}</div>`;
  } else if(s.t==='char'){
    h=`<div class="prompt">請寫出有<span class="key">${s.g}</span>這個部件的字</div>
       <div class="rule">小組合作，計時<b>${tText(tSec(s))}</b><br>字數最多的組別獲勝。</div>`;
    if(reveal) h+=`<div class="answers"><div class="answers-label">參考答案（綠框是這一冊學過的字，還有很多喔）</div>${s.mine.map(([c,n])=>`<span class="mine">${c}<small>第${n}課</small></span>`).join('')}${s.more.map(w=>`<span>${w}</span>`).join('')}</div>`;
    extra=swap+`<button class="tool ${reveal?'hot':''}" data-act="rev">${reveal?'收起答案':'參考答案'}</button>`;
  } else if(s.t==='fix'){
    src=`第 ${s.n} 課的成語`;
    const chars=[...s.q].map((c,i)=>{const w=reveal&&s.f[i];
      return `<button class="ch ${w?'wrong':''} ${!reveal&&marked[i]?'marked':''}" data-i="${i}">${c}${w?`<span class="fix">${s.f[i]}</span>`:''}</button>`}).join('');
    h=`<div class="prompt" style="font-size:clamp(1.4rem,5.5vh,3.4rem)">找出躲起來的錯字並改正</div>
       <div class="hint">小組派代表，計時 ${tText(tSec(s))}・錯字可能不只一個・點一下字可以先圈起來</div>
       <div class="idiom" style="margin-top:6vh">${chars}</div>
       ${reveal?`<div class="full">正確：${s.full}　（共 ${Object.keys(s.f).length} 個錯字）</div>`:''}`;
    extra=swap+`<button class="tool ${reveal?'hot':''}" data-act="rev">${reveal?'隱藏答案':'公布答案'}</button>`;
  } else if(s.t==='word'){
    src=`第 ${s.n} 課的生字`;
    h=`<div class="prompt">請寫出有<span class="key">${s.g}</span>的語詞</div>
       <div class="rule">小組合作，計時<b>${tText(tSec(s))}</b><br>語詞 <b>+1</b> 分　成語或四字語詞 <b>+2</b> 分</div>`;
    if(reveal) h+=`<div class="answers"><div class="answers-label">參考答案（黃框 +2 分）</div>${s.ref.map(w=>`<span>${w}</span>`).join('')}${s.ref2.map(w=>`<span class="two">${w}</span>`).join('')}</div>`;
    extra=swap+`<button class="tool ${reveal?'hot':''}" data-act="rev">${reveal?'收起答案':'參考答案'}</button>`;
  } else if(s.t==='demo'){
    h=`<div class="cross-wrap"><div class="demo-text"><span class="tag">示範</span><br>照著箭頭的方向，接出四個通順的語詞，一個一分。<br>
       <span class="purple">【小組派代表，計時${tText(room?LONG.cross:60)}】</span><br><br>上學・同學・學校・學生</div>${crossHTML('學',['上','同','校','生'],true)}</div>`;
  } else if(s.t==='cross'){
    src=`第 ${s.n} 課的生字`;
    h=`<div class="cross-wrap">${crossHTML(s.g,s.fill,reveal)}<div style="display:flex;flex-direction:column;gap:2vh;align-items:flex-start">${LEGEND}
       ${reveal?`<div class="answers" style="justify-content:flex-start;max-width:min(480px,90vw)"><div class="answers-label" style="text-align:left">□${s.g}</div>${s.before.map(w=>`<span>${w}</span>`).join('')}
       <div class="answers-label" style="text-align:left;margin-top:.4em">${s.g}□</div>${s.after.map(w=>`<span>${w}</span>`).join('')}</div>`:`<div class="hint" style="text-align:left">四個語詞要不一樣喔</div>`}</div></div>`;
    extra=swap+`<button class="tool ${reveal?'hot':''}" data-act="rev">${reveal?'隱藏答案':'參考答案'}</button>`;
  } else if(s.t==='end'){
    const list=scores.slice(0,nTeams).map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v);
    const top=list[0]?.v; let pos=0,last=null;
    h=`<div class="title-big" style="font-size:clamp(2.2rem,9vh,6rem);letter-spacing:.1em;margin:0">聖誕快樂！</div>
       <div class="rank">${list.map((t,k)=>{if(t.v!==last){pos=k+1;last=t.v}
         return `<div class="${t.v===top&&top>0?'first':''}"><span class="pos">${pos}</span><span>第 ${t.i+1} 組</span><span class="pts">${t.v} 分</span></div>`}).join('')}</div>`;
    extra='<button class="tool" data-act="again">同一冊再抽一次題目</button>';
  }
  if(room&&s.time){extra=`<button class="tool ${wall?'hot':''}" data-act="wall">各組答案 ${Object.keys(answers[s.id]||{}).length}/${nTeams}</button>`+extra; if(wall) h=wallHTML(s)}
  el.innerHTML=h; $('extra').innerHTML=extra;
  $('src').hidden=!src; $('src').textContent=src;
  $('prev').disabled=idx===0; $('next').disabled=idx===S.length-1;
  $('count').textContent=`${idx+1} / ${S.length}`;
  $('rounds').innerHTML=ROUNDS.map((R,i)=>`<button class="rchip ${s.r===i?'on':''}" data-r="${i}">${R.n} ${R.plain}</button>`).join('')
    +`<button class="rchip ${s.t==='end'?'on':''}" data-end>結算</button>`;
  if(s.time){$('timerBox').hidden=false; if(timerFor!==idx) setTimer(tSec(s))} else {$('timerBox').hidden=true; stopTimer()}
  store.set('idx',idx);
  if(!noPush) pushState();
}
function go(i){ if(mode!=='game'||i<0||i>=S.length) return; idx=i; reveal=false; wall=false; marked={}; stopTimer(); timerFor=-1; render(); }
$('prev').onclick=()=>go(idx-1);
$('next').onclick=()=>go(idx+1);
$('rounds').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.end!==undefined) return go(S.length-1);
  go(S.findIndex(x=>x.t==='round'&&x.r===+b.dataset.r));};
$('extra').onclick=e=>{const a=e.target.dataset.act;
  if(a==='rev'){reveal=!reveal;wall=false;render()}
  else if(a==='wall'){wall=!wall;render(true)}
  else if(a==='swap') swapQuestion();
  else if(a==='back'){mode='game';render()}
  else if(a==='again'){S=buildSlides();store.set('slides',S);go(1)}};
$('slide').onclick=e=>{
  if(e.target.closest('[data-act="apply"]')) return applyScores();
  const w=e.target.closest('.w-it'); if(w){const s=S[idx],t=w.dataset.team,k=w.dataset.k; const a=(inv[s.id]=inv[s.id]||{}), m=(a[t]=a[t]||{}); m[k]=!m[k]; store.set('inv',inv); return render(true)}
  const b=e.target.closest('.ch');if(!b||reveal)return;const i=b.dataset.i;marked[i]=!marked[i];render()};
document.addEventListener('keydown',e=>{
  if(mode!=='game'||JOIN||!$('ovl').hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(idx+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(idx-1);e.preventDefault()}
  else if(e.key===' '&&!$('timerBox').hidden){toggleTimer();e.preventDefault()}
  else if(e.key==='a'||e.key==='A'){if(S[idx].time){reveal=!reveal;render()}}
});
/* ---------- timer ---------- */
let left=0,total=0,tick=null,timerFor=-1,actx=null;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function drawClock(){const c=$('clock');c.textContent=fmt(left);c.classList.toggle('low',left<=10&&left>0);c.classList.toggle('done',left===0&&total>0&&!tick&&doneFlag)}
let doneFlag=false;
function setTimer(sec){stopTimer();total=sec;left=sec;timerFor=idx;doneFlag=false;drawClock();$('tStart').textContent='開始'}
function stopTimer(){clearInterval(tick);tick=null;$('tStart').textContent=left>0&&left<total?'繼續':'開始'}
function toggleTimer(){
  if(tick){stopTimer();pushState();return}
  if(left===0) setTimer(total);
  ensureAudio();
  $('tStart').textContent='暫停';
  tick=setInterval(()=>{left--; if(left<=5&&left>0) beep(660,.12); if(left<=0){left=0;clearInterval(tick);tick=null;doneFlag=true;beep(880,.6);$('tStart').textContent='開始'} drawClock(); if(left%5===0) pushState()},1000);
  pushState();
}
$('tPlus30').onclick=()=>{left+=30;total=Math.max(total,left);doneFlag=false;drawClock();pushState()};
$('tStart').onclick=toggleTimer;
$('tReset').onclick=()=>setTimer(total);
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(f,d){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';
  g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* ---------- scoreboard ---------- */
function renderTeams(bumpI){
  const max=Math.max(...scores.slice(0,nTeams));
  $('teams').innerHTML=scores.slice(0,nTeams).map((v,i)=>`<div class="team ${v===max&&max>0?'lead':''}">
    <span class="tname">第 ${i+1} 組</span><span></span><span class="tscore ${bumpI===i?'bump':''}">${v}</span>
    <div class="tbtns"><button data-t="${i}" data-d="1">+1</button><button class="p2" data-t="${i}" data-d="2">+2</button><button class="m" data-t="${i}" data-d="-1">−1</button></div></div>`).join('');
  $('tn').textContent=nTeams;
  store.set('scores',scores);store.set('n',nTeams);pushState();drawOvl();
  if(mode==='game'&&S[idx].t==='end') render();
}
$('teams').onclick=e=>{const b=e.target.closest('button[data-t]');if(!b)return;const i=+b.dataset.t;scores[i]=Math.max(0,scores[i]+ +b.dataset.d);renderTeams(i)};
$('tMinus').onclick=()=>{nTeams=Math.max(2,nTeams-1);renderTeams()};
$('tPlus').onclick=()=>{nTeams=Math.min(8,nTeams+1);renderTeams()};
$('resetBtn').onclick=()=>{$('confirm').hidden=false};
$('cNo').onclick=()=>{$('confirm').hidden=true};
$('cYes').onclick=()=>{scores=Array(8).fill(0);$('confirm').hidden=true;renderTeams()};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

/* ---------- snow ---------- */
let snowOn=true;
(function(){
  const cv=$('snow'),ctx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,flakes=[];
  const cols=['#cfe3b0','#f7c9bd','#fbe0a0','#b9cdee'];
  function size(){const r=cv.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height;
    flakes=Array.from({length:38},()=>({x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*6,s:.3+Math.random()*.7,c:cols[Math.random()*4|0],w:Math.random()*6}))}
  size();addEventListener('resize',size);
  function frame(){ctx.clearRect(0,0,W,H);
    if(snowOn){for(const f of flakes){if(!reduce){f.y+=f.s;f.w+=.02;f.x+=Math.sin(f.w)*.4;if(f.y>H+10){f.y=-10;f.x=Math.random()*W}}
      ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}}
    requestAnimationFrame(frame)}
  frame();
})();

if(JOIN){studentApp()}else{
  if(S)S.forEach(x=>{if(x.time&&!x.id)x.id=newId()});
  render();renderTeams();drawOvl();if(room)hostConnect();
}
</script>
