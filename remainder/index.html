<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>餘數比除數小</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* VOICE: 溫暖、像老師在旁邊陪著，句子短，給三年級小朋友
   IDEA: 一張分糖果的餐桌——糖果堆、盤子、剩下的糖果
   PICTURE: 糖果一輪一輪跳進盤子，剩下的糖果發亮
   COLOUR and TYPE: 蜂蜜黃底、薄荷綠盤子、草莓粉糖果；Noto Sans TC 粗體 + Baloo 2 數字
   LAYOUT: 橫放平板一個畫面：左邊動手區、右邊算式與紀錄 */
:root{color-scheme:light dark;
--bg:light-dark(#fff3c9,#1c1730);--ink:light-dark(#2b2340,#f6f0ff);--card:light-dark(#fffdf6,#2a2346);
--line:light-dark(#ecdca4,#40376a);--mint:light-dark(#178f81,#3cc4b3);--mintBg:light-dark(#dff5f1,#1e3b44);
--pink:#ff5a7a;--sun:light-dark(#ffc23c,#e8aa22);--soft:light-dark(#6b6280,#b9b0d4);--ok:light-dark(#178f4f,#4fd18a);--bad:light-dark(#d23b4f,#ff7d8e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh}
.num,em,.eq,.pad button,.field{font-family:"Baloo 2","Noto Sans TC",sans-serif}
header{background:var(--mint);color:#fff;display:flex;align-items:center;gap:14px;padding:10px max(3vw,14px);flex-wrap:wrap}
header h1{font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.1;font-weight:900;flex:1 1 auto}
header h1 small{display:block;font-size:14px;font-weight:500;opacity:.9}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{font:700 17px "Noto Sans TC";border:0;border-radius:999px;min-height:48px;padding:0 20px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
nav button.on{background:#fff;color:var(--mint)}
button:focus-visible,.field:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding:14px max(3vw,14px);min-height:0}
.view{display:none;height:100%;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.view.on{display:grid}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-weight:700;font-size:15px;color:var(--soft);margin-right:4px}
.chip{font:700 18px "Baloo 2","Noto Sans TC";min-width:52px;min-height:46px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--sun);border-color:var(--sun);color:#2b2340}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip.right{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.pile{flex:0 0 auto;min-height:96px;border:2px dashed var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;position:relative}
.pile::before{content:"糖果堆";position:absolute;top:-11px;left:14px;background:var(--card);padding:0 6px;font-size:13px;font-weight:700;color:var(--soft)}
.empty{color:var(--soft);font-size:15px;align-self:center}
.c{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 14%,#ff8fa5 15% 40%,var(--pink) 41%);box-shadow:0 2px 0 rgba(120,20,50,.25);display:inline-block;flex:none}
.c.new{animation:pop .45s ease-out}
.c.rest{outline:3px solid var(--sun);outline-offset:2px;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes pop{0%{transform:translateY(-40px) scale(.4);opacity:0}70%{transform:translateY(4px) scale(1.1);opacity:1}100%{transform:none}}
@keyframes glow{to{outline-color:transparent}}
.plates{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-content:center}
.plate{background:var(--mintBg);border-radius:50%/42%;aspect-ratio:1.25;border:3px solid var(--mint);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;position:relative;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06)}
.plate b{position:absolute;top:4px;font-size:13px;color:var(--mint)}
.plate div{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:90px}
.plate .c{width:22px;height:22px}
.eq{font-size:clamp(34px,4.2vw,50px);font-weight:800;line-height:1.05;text-align:center;letter-spacing:.02em}
.eq em{font-style:normal;color:var(--mint)}.eq em.rm{color:var(--pink)}
.msg{background:var(--mintBg);border-radius:14px;padding:10px 14px;font-weight:500;min-height:3.2em}
.btn{font:700 18px "Noto Sans TC";min-height:52px;padding:0 18px;border-radius:16px;border:0;background:var(--mint);color:#fff;cursor:pointer;flex:1 1 auto}
.btn.alt{background:var(--card);color:var(--mint);border:2px solid var(--mint)}
.btn.hot{background:var(--pink)}
.btn:disabled{opacity:.4;cursor:default}
.rec{display:grid;gap:6px;overflow:auto}
.rec button{display:flex;justify-content:space-between;align-items:center;font:700 20px "Baloo 2","Noto Sans TC";min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.rec button.cur{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 18%,transparent)}
.rec .rm{color:var(--pink)}.rec .q{color:var(--mint)}
.box{display:inline-block;width:1.4em;height:1.1em;border:2px solid var(--line);border-radius:6px;vertical-align:-3px}
h2{margin:0;font-size:22px;line-height:1.2}
.tbl{display:grid;gap:6px}
.tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;font:700 22px "Baloo 2","Noto Sans TC";padding:4px 10px;border-radius:12px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.tr .rm{color:var(--pink)}
.slots{display:flex;gap:5px}
.slots span{width:24px;height:24px;border-radius:50%;border:2px dashed var(--soft);opacity:.55}
.slots span.f{border:0;opacity:1;background:radial-gradient(circle at 35% 30%,#fff 0 14%,#ff8fa5 15% 40%,var(--pink) 41%)}
.note{font-size:14px;color:var(--soft)}
.big{background:var(--sun);color:#2b2340;border-radius:18px;padding:14px 16px;font-weight:700;font-size:19px}
.big strong{font-size:24px;display:block;font-weight:900}
.hide{display:none!important}
.fb{border-radius:14px;padding:10px 14px;font-weight:500}
.fb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent)}.fb.no{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fb b{display:block;font-size:19px}
.qtext{font-size:clamp(22px,2.6vw,28px);font-weight:700;line-height:1.4}
.qtext .eqi{font:800 1.25em "Baloo 2","Noto Sans TC"}
.tag{display:inline-block;background:var(--pink);color:#fff;font-size:14px;border-radius:999px;padding:2px 10px;margin-right:6px;vertical-align:4px}
.field{display:inline-flex;align-items:center;justify-content:center;width:72px;height:60px;border:3px solid var(--line);border-radius:14px;font-size:34px;font-weight:800;background:var(--card);color:var(--ink);cursor:pointer;vertical-align:middle}
.field.act{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}
.ansline{font:800 34px "Baloo 2","Noto Sans TC";display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-content:center}
.pad button{font-size:32px;font-weight:800;min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pad button:disabled{opacity:.35}
.prog{display:flex;gap:5px}.prog i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.prog i.y{background:var(--ok)}.prog i.n{background:var(--bad)}.prog i.now{background:var(--sun)}
footer{font-size:13px;color:var(--soft);text-align:right;padding:0 max(3vw,14px) 8px}
@media(max-width:820px){.view.on{grid-template-columns:1fr;height:auto}}
@media(prefers-reduced-motion:reduce){.c.new,.c.rest{animation:none}}
</style>
</head>
<body>
<header>
  <h1>餘數有哪些？<small>先算算看，再比一比餘數和除數的大小</small></h1>
  <nav>
    <button data-v="v1" class="on">① 動手分糖果</button>
    <button data-v="v2">② 找規律</button>
    <button data-v="v3">③ 類題挑戰</button>
  </nav>
</header>
<main>
  <!-- 站 1 -->
  <section class="view on" id="v1">
    <div class="card">
      <div class="row"><span class="lab">盤子（除數）</span><span id="dChips" class="row"></span></div>
      <div class="row"><span class="lab">糖果（被除數）</span><span id="nChips" class="row"></span></div>
      <div class="pile" id="pile"></div>
      <div class="plates" id="plates"></div>
    </div>
    <div class="card">
      <div class="eq" id="eq"></div>
      <div class="msg" id="msg"></div>
      <div class="row">
        <button class="btn" id="b1">分一輪</button>
        <button class="btn alt" id="b2">一次分完</button>
        <button class="btn alt" id="b3">重來</button>
      </div>
      <div class="note">我的紀錄（點一題換過去分）</div>
      <div class="rec" id="rec"></div>
      <button class="btn hot hide" id="go2">都分完了！去找規律 →</button>
    </div>
  </section>

  <!-- 站 2 -->
  <section class="view" id="v2">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 id="t2"></h2>
        <span id="dChips2" class="row"></span>
      </div>
      <div class="tbl" id="tbl"></div>
      <div class="row"><button class="btn alt" id="showAll">全部算出來</button></div>
      <div class="note">粉紅色圓圈是剩下的糖果（餘數）；虛線圈是還差幾顆才能再分一輪。</div>
    </div>
    <div class="card">
      <div id="q1box">
        <h2 id="q1t"></h2>
        <div class="row" id="q1c" style="margin:10px 0"></div>
        <button class="btn" id="q1go">對答案</button>
        <div class="fb hide" id="q1fb" style="margin-top:10px"></div>
      </div>
      <div id="q2box" class="hide">
        <h2 id="q2t"></h2>
        <div class="row" id="q2c" style="margin:10px 0"></div>
        <div class="fb hide" id="q2fb"></div>
      </div>
      <div class="big hide" id="sum"></div>
    </div>
  </section>

  <!-- 站 3 -->
  <section class="view" id="v3">
    <div class="card" id="qcard">
      <div class="prog" id="prog"></div>
      <div class="note" id="qno"></div>
      <div class="qtext" id="qtext"></div>
      <div id="qans"></div>
      <div class="row"><button class="btn" id="chk">對答案</button><button class="btn hot hide" id="nxt">下一題 →</button></div>
      <div class="fb hide" id="qfb"></div>
    </div>
    <div class="card">
      <div class="note" id="padHint">點上面的框框，再按數字</div>
      <div class="pad" id="pad"></div>
    </div>
  </section>
</main>
<footer>© 老師媽咪／范范老師</footer>

<script>
{
const $=q=>document.querySelector(q);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const DS=[3,4,5,6];
const rowsOf=d=>Array.from({length:6},(_,i)=>d*4+i);
let d=4,n=16,r=0,fresh=false;
const rec={};

/* 分頁 */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==v));
  if(v=='v2')render2();
}

/* 站 1：動手分 */
function render1(){
  const left=n-r*d,done=left<d;
  $('#dChips').innerHTML=DS.map(x=>`<button class="chip${x==d?' on':''}" data-d="${x}">${x}</button>`).join('');
  $('#nChips').innerHTML=rowsOf(d).map(x=>`<button class="chip${x==n?' on':''}${rec[x+'/'+d]?' done':''}" data-n="${x}">${x}</button>`).join('');
  $('#pile').innerHTML=left?Array.from({length:left},()=>`<i class="c${done?' rest':''}"></i>`).join(''):'<span class="empty">一顆都沒剩</span>';
  $('#plates').innerHTML=Array.from({length:d},(_,p)=>`<div class="plate"><b>第${p+1}盤</b><div>${Array.from({length:r},(_,k)=>`<i class="c${fresh&&k==r-1?' new':''}"></i>`).join('')}</div></div>`).join('');
  fresh=false;
  $('#eq').innerHTML=`${n} ÷ ${d} = <em>${done?r:'?'}</em> … <em class="rm">${done?left:'?'}</em>`;
  $('#msg').textContent=r==0?`把 ${n} 顆糖果平分到 ${d} 個盤子。按「分一輪」，每個盤子放 1 顆。`
    :!done?`分了 ${r} 輪，每盤 ${r} 顆，還剩 ${left} 顆。剩下的夠不夠每盤再放 1 顆？`
    :left==0?`剛好分完！每盤 ${r} 顆，沒有剩下，餘數是 0。`
    :`剩下 ${left} 顆，不夠 ${d} 個盤子每盤再放 1 顆了！每盤 ${r} 顆，剩下 ${left} 顆就是餘數。`;
  $('#b1').disabled=$('#b2').disabled=done;
  if(done)rec[n+'/'+d]=[r,left];
  $('#rec').innerHTML=rowsOf(d).map(x=>{const v=rec[x+'/'+d];
    return `<button class="${x==n?'cur':''}" data-n="${x}"><span>${x} ÷ ${d} =</span><span>${v?`<span class="q">${v[0]}</span> … <span class="rm">${v[1]}</span>`:'<i class="box"></i> … <i class="box"></i>'}</span></button>`}).join('');
  $('#go2').classList.toggle('hide',!rowsOf(d).every(x=>rec[x+'/'+d]));
}
function pick(e){
  const t=e.target.closest('[data-d],[data-n]');if(!t)return;
  if(t.dataset.d){d=+t.dataset.d;n=d*4}else n=+t.dataset.n;
  r=0;render1();
}
$('#dChips').onclick=pick;$('#nChips').onclick=pick;$('#rec').onclick=pick;
$('#b1').onclick=()=>{if(n-r*d>=d){r++;fresh=true;render1()}};
$('#b2').onclick=()=>{r=Math.floor(n/d);fresh=true;render1()};
$('#b3').onclick=()=>{r=0;render1()};
$('#go2').onclick=()=>show('v2');

/* 站 2：找規律 */
let d2=4,showAll=false,q1ok=false,q1sel=new Set();
function render2(){
  $('#dChips2').innerHTML='<span class="lab">換除數</span>'+DS.map(x=>`<button class="chip${x==d2?' on':''}" data-d="${x}">${x}</button>`).join('');
  $('#t2').textContent=`除數是 ${d2} 的時候`;
  $('#tbl').innerHTML=rowsOf(d2).map(x=>{
    const v=rec[x+'/'+d2]||(showAll?[Math.floor(x/d2),x%d2]:null);
    return `<div class="tr"><span>${x} ÷ ${d2} = ${v?`${v[0]} … <span class="rm">${v[1]}</span>`:'<i class="box"></i> … <i class="box"></i>'}</span>
      <span class="slots">${v?Array.from({length:d2},(_,k)=>`<span class="${k<v[1]?'f':''}"></span>`).join(''):''}</span></div>`}).join('');
  $('#q1t').textContent=`除數是 ${d2} 時，餘數有哪些？（可以選很多個）`;
  $('#q1c').innerHTML=Array.from({length:d2+2},(_,k)=>`<button class="chip${q1sel.has(k)?' on':''}" data-k="${k}">${k}</button>`).join('');
  $('#q2t').textContent=`最大的餘數是多少？`;
  $('#q2c').innerHTML=Array.from({length:d2+2},(_,k)=>`<button class="chip" data-k="${k}">${k}</button>`).join('');
  $('#q2box').classList.toggle('hide',!q1ok);
}
$('#dChips2').onclick=e=>{const t=e.target.closest('[data-d]');if(!t)return;d2=+t.dataset.d;showAll=false;reset2();render2()};
$('#showAll').onclick=()=>{showAll=true;render2()};
function reset2(){q1ok=false;q1sel=new Set();['#q1fb','#q2fb','#sum'].forEach(s=>$(s).classList.add('hide'));$('#q1go').disabled=false}
$('#q1c').onclick=e=>{const t=e.target.closest('[data-k]');if(!t||q1ok)return;const k=+t.dataset.k;q1sel.has(k)?q1sel.delete(k):q1sel.add(k);t.classList.toggle('on')};
$('#q1go').onclick=()=>{
  const want=Array.from({length:d2},(_,k)=>k),ok=want.length==q1sel.size&&want.every(k=>q1sel.has(k));
  const fb=$('#q1fb');fb.classList.remove('hide');
  if(ok){q1ok=true;$('#q1go').disabled=true;fb.className='fb ok';fb.innerHTML=`<b>答對了！</b>餘數有 ${want.join('、')}，一直重複出現。`;render2()}
  else{fb.className='fb no';fb.innerHTML=`<b>再看看左邊的表</b>${q1sel.has(d2)||q1sel.has(d2+1)?`餘數會是 ${d2} 以上嗎？剩 ${d2} 顆的話，還可以每盤再分 1 顆喔！`:'有沒有漏掉的？0 也是餘數喔（剛好分完）。'}`}
};
$('#q2c').onclick=e=>{
  const t=e.target.closest('[data-k]');if(!t)return;const k=+t.dataset.k,fb=$('#q2fb');fb.classList.remove('hide');
  $('#q2c').querySelectorAll('.chip').forEach(c=>c.classList.remove('right','wrong'));
  if(k==d2-1){t.classList.add('right');fb.className='fb ok';fb.innerHTML=`<b>沒錯，是 ${d2-1}！</b>`;
    const s=$('#sum');s.classList.remove('hide');
    s.innerHTML=`<strong>餘數一定比除數小！</strong>除數是 ${d2}，餘數只會是 ${Array.from({length:d2},(_,k)=>k).join('、')}，最大是 ${d2-1}。<br>如果剩下 ${d2} 顆以上，就還能每盤再分 1 顆，所以還沒分完。<br><span style="font-size:16px">換其他除數試試看，是不是也一樣？</span>`}
  else{t.classList.add('wrong');fb.className='fb no';fb.innerHTML=`<b>再想想</b>${k>=d2?`剩下 ${k} 顆，${d2} 個盤子還能每盤再放 1 顆喔。`:`比 ${k} 更大的餘數也有出現喔，看看表格。`}`}
};

/* 站 3：類題 */
const mk={
  calc(){const b=ri(3,9),q=ri(2,9),rr=ri(0,b-1),a=b*q+rr;
    return{type:'calc',html:`算算看：<span class="eqi">${a} ÷ ${b}</span>`,ans:[q,rr],
      exp:`${b} × ${q} = ${b*q}，${a} − ${b*q} = ${rr}。${rr} 比 ${b} 小，所以 ${a} ÷ ${b} = ${q} … ${rr}。`}},
  max(){const b=ri(3,9);return{type:'num',html:`一個數除以 <span class="eqi">${b}</span>，餘數<b>最大</b>可能是多少？`,ans:b-1,
      exp:`餘數一定比除數 ${b} 小，所以最大是 ${b-1}。`}},
  multi(){const b=ri(3,6);return{type:'multi',html:`除數是 <span class="eqi">${b}</span> 時，餘數可能是哪些？<span class="note">（可以選很多個）</span>`,
      opts:Array.from({length:b+2},(_,k)=>k),ans:Array.from({length:b},(_,k)=>k),
      exp:`餘數要比 ${b} 小，所以是 ${Array.from({length:b},(_,k)=>k).join('、')}。`}},
  judge(){const b=ri(3,7),q=ri(2,7),rr=ri(0,b-1),a=b*q+rr,bad=Math.random()<.6;
    return{type:'one',html:`小明算：<span class="eqi">${a} ÷ ${b} = ${bad?q-1:q} … ${bad?rr+b:rr}</span><br>他算對了嗎？`,opts:['算對了','算錯了'],ans:bad?'算錯了':'算對了',
      exp:bad?`餘數 ${rr+b} 沒有比除數 ${b} 小，還可以再分一輪。正確是 ${a} ÷ ${b} = ${q} … ${rr}。`:`${b} × ${q} = ${b*q}，剩下 ${rr}，${rr} 比 ${b} 小，算對了！`}},
  cannot(){const b=ri(3,9),ok=shuf(Array.from({length:b},(_,k)=>k)).slice(0,3),no=ri(b,b+3);
    return{type:'one',html:`除以 <span class="eqi">${b}</span> 的時候，哪一個<b>不可能</b>是餘數？`,opts:shuf([...ok,no]),ans:no,
      exp:`餘數要比 ${b} 小，${no} 沒有比 ${b} 小，所以不可能。`}},
  hard(){const b=ri(3,6),q=ri(2,6);
    return{type:'num',html:`<span class="tag">挑戰</span><span class="eqi">□ ÷ ${b} = ${q} … △</span><br>△ 最大的時候，□ 是多少？`,ans:b*q+b-1,
      exp:`△ 最大是 ${b-1}。□ = ${b} × ${q} + ${b-1} = ${b*q+b-1}。驗算：${b*q+b-1} ÷ ${b} = ${q} … ${b-1}。`}}
};
let Q=[],qi=0,res=[],cur=null,fields=[],act=0,sel=new Set(),locked=false;
function newRound(){
  Q=shuf(['calc','calc','calc','max','max','multi','judge','judge','cannot']).map(t=>mk[t]());Q.push(mk.hard());
  qi=0;res=[];loadQ();
}
function loadQ(){
  cur=Q[qi];locked=false;sel=new Set();fields=['',''];act=0;
  $('#qfb').classList.add('hide');$('#nxt').classList.add('hide');$('#chk').classList.remove('hide');$('#chk').disabled=false;
  $('#qno').textContent=`第 ${qi+1} / ${Q.length} 題　答對 ${res.filter(Boolean).length} 題`;
  $('#qtext').innerHTML=cur.html;
  drawAns();drawProg();drawPad();
}
function drawProg(){$('#prog').innerHTML=Q.map((_,i)=>`<i class="${i<res.length?(res[i]?'y':'n'):i==qi?'now':''}"></i>`).join('')}
function drawAns(){
  const f=i=>`<button class="field${act==i&&!locked?' act':''}" data-f="${i}">${fields[i]}</button>`;
  if(cur.type=='calc')$('#qans').innerHTML=`<div class="ansline">= ${f(0)} … ${f(1)}</div><div class="note">左邊填商，右邊填餘數</div>`;
  else if(cur.type=='num')$('#qans').innerHTML=`<div class="ansline">答：${f(0)}</div>`;
  else $('#qans').innerHTML=`<div class="row">${cur.opts.map(o=>`<button class="chip${sel.has(o)?' on':''}" data-o="${o}" style="min-height:56px;font-size:22px">${o}</button>`).join('')}</div>`;
}
function drawPad(){
  const num=cur.type=='calc'||cur.type=='num';
  $('#padHint').textContent=num?'點上面的框框，再按數字':'這題用點選的，不用數字鍵';
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'清除',0,'⌫'].map(k=>`<button data-k="${k}"${num&&!locked?'':' disabled'} style="${typeof k=='string'?'font-size:20px':''}">${k}</button>`).join('');
}
$('#qans').onclick=e=>{
  if(locked)return;
  const f=e.target.closest('[data-f]');if(f){act=+f.dataset.f;drawAns();return}
  const o=e.target.closest('[data-o]');if(!o)return;
  const v=isNaN(o.dataset.o)?o.dataset.o:+o.dataset.o;
  if(cur.type=='multi')sel.has(v)?sel.delete(v):sel.add(v);else sel=new Set([v]);
  drawAns();
};
$('#pad').onclick=e=>{
  const b=e.target.closest('[data-k]');if(!b||locked)return;const k=b.dataset.k;
  if(k=='清除')fields[act]='';else if(k=='⌫')fields[act]=fields[act].slice(0,-1);
  else if(fields[act].length<2)fields[act]+=k;
  drawAns();
};
$('#chk').onclick=()=>{
  let ok,given=true;
  if(cur.type=='calc'){given=fields[0]!==''&&fields[1]!=='';ok=+fields[0]==cur.ans[0]&&+fields[1]==cur.ans[1]}
  else if(cur.type=='num'){given=fields[0]!=='';ok=+fields[0]==cur.ans}
  else if(cur.type=='multi'){given=sel.size>0;ok=sel.size==cur.ans.length&&cur.ans.every(a=>sel.has(a))}
  else{given=sel.size>0;ok=sel.has(cur.ans)}
  const fb=$('#qfb');fb.classList.remove('hide');
  if(!given){fb.className='fb no';fb.innerHTML='<b>還沒作答喔</b>先填好答案再對答案。';return}
  locked=true;res.push(ok);
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'答對了！':'差一點！'}</b>${cur.exp}`;
  if(cur.opts)$('#qans').querySelectorAll('[data-o]').forEach(c=>{const v=isNaN(c.dataset.o)?c.dataset.o:+c.dataset.o;
    const right=cur.type=='multi'?cur.ans.includes(v):v==cur.ans;
    if(right)c.classList.add('right');else if(sel.has(v))c.classList.add('wrong')});
  else drawAns();
  $('#chk').classList.add('hide');$('#nxt').classList.remove('hide');
  $('#nxt').textContent=qi==Q.length-1?'看成績 →':'下一題 →';
  drawProg();drawPad();
};
$('#nxt').onclick=()=>{
  if(qi<Q.length-1){qi++;loadQ();return}
  const s=res.filter(Boolean).length;
  $('#qno').textContent='挑戰完成！';
  $('#qtext').innerHTML=`你答對了 <span class="eqi" style="color:var(--mint)">${s}</span> / ${Q.length} 題<br><span style="font-size:20px">${s>=9?'太厲害了！餘數的祕密你都懂了！':s>=6?'很棒！再玩一次會更熟喔！':'回到「找規律」再看一次，再來挑戰！'}</span>`;
  $('#qans').innerHTML='';$('#qfb').classList.add('hide');
  $('#nxt').textContent='再玩一次';$('#nxt').onclick=()=>{$('#nxt').onclick=nextHandler;newRound()};
};
const nextHandler=$('#nxt').onclick;

render1();render2();newRound();
}
</script>
</body>
