<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="老師媽咪自製的國語、數學、英文與有趣課程學習網頁，免費提供老師與家長使用。">
<title>老師媽咪的求生指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄、置中、留白。頁首 → 國語（選版本年級 → 遊戲清單）→ 其他科目清單 → 頁尾。只有一個強調色。 */
:root{
  --bg:#F7F7F5; --card:#FFFFFF; --ink:#1A1D24; --ink2:#5F6570; --line:#E6E6E2; --soft:#EFEFEB;
  --accent:#E8483F;
  --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --card:#1B1D22; --ink:#F1F2F4; --ink2:#A0A5AE; --line:#2B2E35; --soft:#24272D;
  --accent:#FF6A61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --card:#1B1D22; --ink:#F1F2F4; --ink2:#A0A5AE; --line:#2B2E35; --soft:#24272D;
  --accent:#FF6A61; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:56px 48px;display:flex;flex-direction:column;gap:48px}

header{display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(30px,6vw,40px);font-weight:700;letter-spacing:.01em;line-height:1.25}
.lead{color:var(--ink2);font-size:17px;line-height:1.7}
.threads{align-self:flex-start;font-size:15px;font-weight:500;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:1px}
.threads:hover{color:var(--accent);border-color:var(--accent)}

section{display:flex;flex-direction:column;gap:14px}
h2{font-size:22px;font-weight:700}

.pickers{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border-radius:8px;padding:8px 4px;font-size:15px;font-weight:500;color:var(--ink2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:16px;padding:16px 18px;transition:background .15s}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--soft)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .d{font-size:14px;color:var(--ink2);line-height:1.5}
.tag{font-size:12px;font-weight:500;color:var(--ink2);background:var(--soft);border-radius:5px;padding:1px 7px}
.arrow{flex:none;color:var(--ink2);font-size:18px;transition:transform .15s,color .15s}
.item:hover .arrow{color:var(--accent);transform:translateX(3px)}

footer{border-top:1px solid var(--line);padding-top:20px;font-size:13px;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>老師媽咪的求生指南</h1>
    <p class="lead">生活亂成一鍋粥，我趁熱拿起來喝。<br>製作 AI 工具成癮的老師媽咪。</p>
    <a class="threads" href="https://www.threads.com/@teacher_liujikan" target="_blank" rel="noopener">Threads @teacher_liujikan ↗</a>
  </header>

  <section aria-labelledby="zh-h">
    <h2 id="zh-h">國語</h2>
    <div class="pickers">
      <div class="seg" id="verSeg" role="group" aria-label="版本"></div>
      <div class="seg" id="gradeSeg" role="group" aria-label="年級"></div>
    </div>
    <div class="list" id="zhList"></div>
  </section>

  <div id="others" style="display:contents"></div>

  <footer>老師媽咪自製的免費學習資源，提供老師與家長教學使用。國語課別範圍對應各版本課本，例句與練習題皆為原創，不是出版社官方產品。</footer>
</div>

<script>
const A="https://claude.ai/artifact/", G="https://teacher-liujikan.github.io/";
const link=u=>/^https?:/.test(u)?u:A+u;
const VERS=["翰林","康軒","南一"], GRADES=["三","四","五","六"];
/* 國語：每一冊有哪些遊戲。新增作品就在對應冊別加一個 key 和網址；SLOTS 決定顯示順序與說明。沒有網址的不會顯示。 */
const SLOTS=[
 {k:"char",n:"生字注音",d:"生字、注音和筆順"},
 {k:"shape",n:"形近字",d:"長得很像的字比一比"},
 {k:"poly",n:"多音字",d:"看語詞判斷要唸哪一個音"},
 {k:"word",n:"語詞填空",d:"選出最適合的語詞填進句子"},
 {k:"idiom",n:"成語練功房",d:"選成語、填空、看漫畫、排字、翻牌配對"},
 {k:"rhet",n:"修辭小偵探",d:"修辭教室、總整理、闖關收集公仔"},
 {k:"sent",n:"句型與標點",d:"照樣造句、句子重組、標點符號"},
 {k:"read",n:"閱讀理解",d:"讀短文，找重點、回答問題"},
 {k:"final",n:"總複習",d:"每一關的題目混在一起，從頭挑戰一次"}
];
const BOOKS={
 "翰林三":{rhet:G+"rhetoric-detective-hanlin3/",idiom:G+"idiom-hanlin-3a/"},
 "翰林四":{rhet:G+"rhetoric-detective-hanlin4/",idiom:G+"idiom-hanlin-4a/"},
 "翰林五":{rhet:G+"rhetoric-detective-hanlin5/",idiom:G+"idiom-hanlin-5a/"},
 "翰林六":{rhet:G+"rhetoric-detective-hanlin6/",idiom:G+"idiom-hanlin-6a/"},
 "康軒三":{rhet:G+"rhetoric-detective-kanghsuan3/",idiom:G+"idiom-kangxuan-3a/"},
 "康軒四":{idiom:G+"idiom-kangxuan-4a/"},
 "康軒五":{idiom:G+"idiom-kangxuan-5a/"},
 "康軒六":{idiom:G+"idiom-kangxuan-6a/"},
 "南一三":{rhet:G+"rhetoric-detective/",idiom:G+"idiompractice/#g3"},
 "南一四":{rhet:G+"rhetoric-detective-nani4/",idiom:G+"idiompractice/#g4"},
 "南一五":{rhet:G+"rhetoric-detective-nani5/",idiom:G+"idiompractice/#g5"},
 "南一六":{rhet:G+"rhetoric-detective-nani6/",idiom:G+"idiompractice/#g6"}
};
const NOTE={"南一":{idiom:"期中考複習"}};
const OTHERS=[
 {n:"學力檢測",items:[
  {t:"學力檢測 自己來訂正",tag:"新",u:G+"literacy-review/",d:"三年級數學 111～114 年：紙本檢討或平板線上測驗、一步一步看詳解、收集徽章；國語製作中"}]},
 {n:"數學",items:[
  {t:"九九乘法大冒險",u:G+"9-9-Adventure/",d:"一關一關過，通關解鎖打怪和快答"},
  {t:"直式乘法小教室",tag:"三年級",u:G+"vertical-multiplication/",d:"看示範、自己算、錯題本、打怪挑戰"},
  {t:"公分毫米大挑戰",u:G+"cm-mm/",d:"1 公分 ＝ 10 毫米，四關加大混合"},
  {t:"大約是幾百？",u:G+"number-line-rounding/",d:"在數線上估到整十、整百、整千"}]},
 {n:"英文",items:[
  {t:"Feelings 單字闖關",u:G+"Vocabulary-Practice/",d:"聽、背、描寫、排字母，過關再玩遊戲"},
  {t:"英文拼字遊戲",u:G+"spellgame/",d:"點單字會唸，拼錯的最後再練一次"}]},
 {n:"班級小工具",items:[
  {t:"段考儀表板",tag:"考試當天",u:G+"exam-dashboard/",d:"投影在教室：現在時間、今日考程倒數、出席人數、老師留言，最後五分鐘會提醒"}]},
 {n:"有趣的課程",items:[
  {t:"畫圖接力猜猜看",tag:"同樂會",u:G+"draw-pass-guess/",d:"畫圖、傳下去、猜答案，最後全班大公開"}]}
];

const $=id=>document.getElementById(id);
const item=o=>`<a class="item" href="${link(o.u)}" target="_blank" rel="noopener"><span class="txt"><span class="t">${o.t}${o.tag?`<span class="tag">${o.tag}</span>`:""}</span><span class="d">${o.d}</span></span><span class="arrow" aria-hidden="true">→</span></a>`;

let pick={v:"翰林",g:"三"};
try{const s=JSON.parse(localStorage.getItem("tm-pick")||"{}");if(VERS.includes(s.v))pick.v=s.v;if(GRADES.includes(s.g))pick.g=s.g}catch(e){}
function save(){try{localStorage.setItem("tm-pick",JSON.stringify(pick))}catch(e){}}

function renderZh(){
  $("verSeg").innerHTML=VERS.map(v=>`<button aria-pressed="${pick.v===v}" data-v="${v}">${v}</button>`).join("");
  $("gradeSeg").innerHTML=GRADES.map(g=>`<button aria-pressed="${pick.g===g}" data-g="${g}">${g}上</button>`).join("");
  const b=BOOKS[pick.v+pick.g]||{}, note=NOTE[pick.v]||{};
  $("zhList").innerHTML=SLOTS.filter(s=>b[s.k]).map(s=>item({t:s.n,d:s.d,u:b[s.k],tag:note[s.k]})).join("");
}
document.querySelector(".pickers").addEventListener("click",e=>{
  const x=e.target.closest("button"); if(!x)return;
  if(x.dataset.v)pick.v=x.dataset.v; if(x.dataset.g)pick.g=x.dataset.g; save(); renderZh();
});

$("others").innerHTML=OTHERS.map(s=>`<section><h2>${s.n}</h2><div class="list">${s.items.map(item).join("")}</div></section>`).join("");
renderZh();
</script>

</body>
</html>
