<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山海知識闖關地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: rank card on top, then a winding trail of round level buttons grouped into six stations (two topic levels + one review each) and a final summit level; figurines, badges and the wrong-answer book sit beside the trail on wide screens and below it on narrow ones. Quiz = one question at a time with instant feedback. */
:root{
  --bg:#e8f0ed; --card:#ffffff; --ink:#15302b; --muted:#536d66; --line:#c6d5cf;
  --accent:#0f6b5c; --accent-soft:#d5ebe4; --gold:#9c6500; --gold-soft:#fbebc8;
  --ok:#17805a; --ok-soft:#dbf3e6; --bad:#c2402e; --bad-soft:#fbe5e0; --lock:#b4c3bd;
  --u1:#2b7fba; --u2:#3a9a5e; --u3:#b87a08; --u4:#c4553a; --u5:#5a62c6; --u6:#9a4fa0; --u7:#2a3b46;
  --f-display:"Huninn","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1816; --card:#15231f; --ink:#e2ece8; --muted:#94aaa3; --line:#2a3d37;
  --accent:#6fc7b2; --accent-soft:#17322c; --gold:#e6b455; --gold-soft:#33291a;
  --ok:#5ccb92; --ok-soft:#153224; --bad:#ff7d6b; --bad-soft:#3a1d19; --lock:#3a4a45; --u7:#51687a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1816; --card:#15231f; --ink:#e2ece8; --muted:#94aaa3; --line:#2a3d37;
  --accent:#6fc7b2; --accent-soft:#17322c; --gold:#e6b455; --gold-soft:#33291a;
  --ok:#5ccb92; --ok-soft:#153224; --bad:#ff7d6b; --bad-soft:#3a1d19; --lock:#3a4a45; --u7:#51687a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img,svg{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap.narrow{max-width:780px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 18px;font-size:15px;line-height:1.6;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.big{font-size:18px;padding:10px 30px}
.btn:focus-visible,.opt:focus-visible,.node:focus-visible,.pal:focus-visible,.figcell:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}

header.top{position:relative;display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
header.top.hasqr{padding-right:100px}
.school{font-size:14px;color:var(--muted);letter-spacing:.04em}
h1{font-size:clamp(28px,5.2vw,40px)}
.qrthumb{position:absolute;top:2px;right:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 2px;cursor:zoom-in}
.qrthumb small{font-size:12px;color:#15302b;line-height:1.4}
.qrthumb img,.qrthumb canvas{display:block;width:70px!important;height:70px!important}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.72);display:grid;place-items:center;padding:16px}
.mcard{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(100%,420px);text-align:center}
.mcard h2{font-size:26px}
.mcard p{margin:0}
.qrcard{background:#fff;color:#15302b;max-width:100%}
#qrBig img,#qrBig canvas{display:block;width:min(70vw,60vh,420px)!important;height:auto!important}
.qrurl{font-size:14px;color:#536d66;word-break:break-all;user-select:all}

/* rank card */
.rank{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.lv{grid-row:span 2;width:62px;height:62px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;text-align:center;line-height:1.1;background:var(--gold-soft)}
.lv small{display:block;font-size:11px;color:var(--gold);letter-spacing:.08em}
.lv b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--gold)}
.rank-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-width:0}
.rank-t h2{font-size:24px}
.rank-t span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.xpbar{height:10px;border-radius:10px;background:var(--accent-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:10px;transition:width .6s}

.home{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:20px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}}
.side{display:flex;flex-direction:column;gap:24px;min-width:0}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.block-h h2{font-size:22px}
.block-h small{color:var(--muted);font-size:14px}

/* trail map */
.map{position:relative;border-radius:22px;border:1.5px solid var(--line);background:
  repeating-radial-gradient(circle at 12% 4%,transparent 0 46px,var(--line) 46px 47.5px),
  repeating-radial-gradient(circle at 92% 58%,transparent 0 58px,var(--line) 58px 59.5px),var(--card);
  padding:14px 12px 40px;overflow:hidden;min-width:0}
.map::before{content:"";position:absolute;inset:0;background:var(--card);opacity:.62;pointer-events:none}
.map>*{position:relative}
.unit{--c:var(--u1);background:var(--c);color:#fff;border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 8px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 68%,#000)}
.unit:first-child{margin-top:0}
.unit small{display:block;font-size:13px;letter-spacing:.12em;opacity:.9;line-height:1.4}
.unit h2{font-size:22px}
.unit p{margin:0;font-size:14px;opacity:.92;line-height:1.5}
.unit .prog{flex:none;font-family:var(--f-display);font-size:18px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.row{position:relative;display:flex;justify-content:center;min-height:168px;padding-top:34px}
.spot{position:relative;transform:translateX(var(--x,0px));display:flex;flex-direction:column;align-items:center;gap:2px;width:150px;text-align:center}
.node{--c:var(--u1);position:relative;width:82px;height:74px;border-radius:50%;border:0;background:var(--c);color:#fff;font-family:var(--f-display);font-size:32px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 66%,#000);margin-bottom:10px;transition:transform .08s,box-shadow .08s}
.node:not(:disabled):active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 66%,#000)}
.node.review{border-radius:24px;width:78px}
.node.final{width:96px;height:86px;font-size:38px}
.node:disabled{background:var(--lock);box-shadow:0 8px 0 color-mix(in srgb,var(--lock) 66%,#000);cursor:not-allowed;color:var(--card)}
.node svg{width:30px;height:30px}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:inherit;border:4px solid var(--c);opacity:.45;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.15}}
.bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--c,var(--accent));border:2px solid currentColor;border-radius:12px;padding:0 12px;font-family:var(--f-display);font-size:17px;white-space:nowrap;line-height:1.6;animation:bob 1.6s ease-in-out infinite;z-index:2;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.stars{color:var(--gold);letter-spacing:2px;font-size:17px;line-height:1.1}
.stars .off{color:var(--lock)}
.nl b{display:block;font-size:15px;line-height:1.35}
.nl small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.pal{position:absolute;top:26px;width:84px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:0}
.pal.l{left:calc(50% - 168px)} .pal.r{left:calc(50% + 84px)}
.pal svg{width:78px;height:86px;display:block}
.pal small{font-size:12px;color:var(--muted);line-height:1.3}
.pal.locked svg,.figcell.locked svg{filter:brightness(0);opacity:.2}
:root[data-theme="dark"] .pal.locked svg,:root[data-theme="dark"] .figcell.locked svg{filter:brightness(0) invert(1);opacity:.22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pal.locked svg,:root:not([data-theme="light"]) .figcell.locked svg{filter:brightness(0) invert(1);opacity:.22}}
.medal{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.pal .medal{width:58px;height:58px;font-size:26px;border-width:3px;margin:12px 0 4px}
.pal.locked .medal{background:transparent;border-color:var(--lock);color:var(--lock)}

.rules{margin:0;padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px;font-size:15px;color:var(--muted);background:var(--card)}
.rules b{color:var(--ink)}
.rules ul{margin:4px 0 0;padding-left:1.2em}

/* figurines */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.figcell{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;min-width:0}
.figcell svg{width:60px;height:66px;display:block}
.figcell small{font-size:12px;line-height:1.4;color:var(--muted)}
.figcell:not(.locked) small{color:var(--ink)}
.bigfig svg{width:170px;height:187px;display:block}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card);display:flex;gap:10px;align-items:center;min-width:0;text-align:left}
.badge b{display:block;font-size:15px;line-height:1.4}
.badge small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.badge.locked{opacity:.5}
.badge.locked .medal{background:transparent;border-color:var(--lock);color:var(--lock)}

/* wrong book */
.wb{display:flex;flex-direction:column;gap:6px}
.wb details{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px}
.wb summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;min-height:32px}
.wb summary::-webkit-details-marker{display:none}
.wb summary .n{font-weight:700;color:var(--bad);flex:none;font-variant-numeric:tabular-nums}
.wb summary .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.wb summary .c{flex:none;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px;margin:0}

/* quiz */
.qhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qrow .ttl{flex:1;min-width:0}
.qrow .ttl b{font-family:var(--f-display);font-weight:400;font-size:22px}
.qrow .ttl small{display:block;font-size:13px;color:var(--muted)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;font-size:15px;border:1.5px solid var(--gold);border-radius:999px;padding:2px 12px;background:var(--gold-soft)}
.combo[data-n="0"]{opacity:.35}
.dots{display:flex;gap:3px}
.dots i{flex:1;height:8px;border-radius:6px;background:var(--line);min-width:0}
.dots i.cur{background:var(--accent)}
.dots i.r{background:var(--ok)}
.dots i.w{background:var(--bad)}
.phase{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:0 8px;margin-right:6px;background:var(--accent-soft);color:var(--accent)}
.phase.re{background:var(--bad-soft);color:var(--bad)}
.q{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:6px}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.qn{font-weight:700;color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.stem{margin:0 0 8px;font-size:19px;line-height:1.7}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0;min-height:52px;font-size:18px;line-height:1.5;transition:border-color .15s,background .15s}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;font-weight:700;width:38px;height:30px;border-radius:15px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:14px}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--f-display);font-weight:400;font-size:22px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}
.fb .gain{font-weight:700;color:var(--gold);margin-left:8px;font-variant-numeric:tabular-nums}
.fb p{margin:2px 0;font-size:15px}
.explain{margin-top:10px;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:16px}
.explain h4{margin:0 0 2px;font-size:15px;color:var(--accent);letter-spacing:.05em}
.explain p{margin:4px 0;overflow-wrap:anywhere}
.explain a{color:var(--accent)}
details.explain summary{cursor:pointer;color:var(--accent);font-size:15px;min-height:32px}
.nextrow{display:flex;justify-content:flex-end;margin-top:14px}
.float{position:absolute;right:18px;top:10px;font-weight:700;color:var(--gold);font-size:22px;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}

.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:26px 20px;margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.panel h2{font-size:30px}
.panel p{margin:0}
.panel .big{font-family:var(--f-display);font-size:clamp(22px,5vw,28px)}
.panel .bigstars{font-size:44px;letter-spacing:6px;color:var(--gold);line-height:1}
.panel .bigstars .off{color:var(--lock)}
.panel .rowb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipq{font-size:14px;border:1.5px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums}
.earn{display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:min(100%,280px)}
.earn div{display:flex;justify-content:space-between;gap:20px;border-bottom:1px dashed var(--line);padding:2px 0;font-variant-numeric:tabular-nums}
.earn div b{color:var(--gold)}
.newbadge{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.gotfig{display:flex;flex-direction:column;align-items:center;border:2px solid var(--gold);background:var(--gold-soft);border-radius:18px;padding:10px 22px 12px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.gotfig small{color:var(--gold);font-weight:700;font-size:14px}
.gotfig b{font-family:var(--f-display);font-weight:400;font-size:24px}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--card);border-radius:12px;padding:8px 16px;font-size:15px;animation:tin .3s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast b{color:var(--gold-soft)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* who am I + login */
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:15px}
.who b{font-family:var(--f-display);font-weight:400;font-size:19px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 14px}
.sync{font-size:13px;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)} .sync[data-s="err"]{color:var(--bad)}
.login{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.login h2{font-size:26px}
.login p{margin:0}
.field{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--muted);max-width:280px}
.field input{font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:48px;width:100%}
.field input:focus-visible,.seat:focus-visible,.link-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.seat{font-family:var(--f-display);font-size:26px;min-height:60px;border-radius:16px;border:0;background:var(--u1);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--u1) 66%,#000)}
.seat:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--u1) 66%,#000)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px}
.link-btn{border:0;background:none;padding:6px 0;color:var(--accent);text-decoration:underline;font-size:15px;min-height:36px}
.err{color:var(--bad);font-size:15px}
.rowf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:45;background:var(--gold-soft);color:var(--ink);border-bottom:2px solid var(--gold);padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
/* teacher */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.tile small{display:block;color:var(--muted);font-size:13px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl thead th{position:sticky;top:0;background:var(--accent-soft);color:var(--ink);font-weight:700}
.tbl th.u{color:#fff}
.tbl td.l,.tbl th.l{text-align:left}

<script>
(function(){
const $=s=>document.querySelector(s);
const LK='yz330';
/* 後台：和國語第八課學習站同一個 Cloudflare 後台，用班級代碼＋這個網頁的代號分開存 */
const API_URL='https://guoyu-class.tina12345920.workers.dev/api';
const TAG='-YZ330';
const DEFAULT_CLASS='三甲'; // 後台用的班級代碼（和國語學習站相同），畫面上不顯示
const PLAYERS=[{seat:1,cls:'四年甲班',name:'李同學'},{seat:2,cls:'五年乙班',name:'王同學'},{seat:3,cls:'六年甲班',name:'胡同學'}];
const pOf=s=>PLAYERS.find(p=>String(p.seat)===String(s));
const pName=s=>{const p=pOf(s);return p?p.name:s+' 號'};
const pFull=s=>{const p=pOf(s);return p?p.cls+'　'+p.name:s+' 號'};
/* 老師密碼（預覽全部關卡、示範模式的後台）：網頁裡只放 SHA-256 雜湊，不放密碼本身 */
const PIN_HASH='f1e0be5a4902c004c18be85f94107c6717c41ff00bb5c716458c52a3a15fb9d6';
async function pinOK(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s)));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')===PIN_HASH}catch(e){return false}}
const ONLINE=/(^|\.)github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Remote={
  async get(params){const r=await fetch(API_URL+'?'+new URLSearchParams(params).toString(),{method:'GET'});const j=await r.json();if(!j.ok)throw new Error(j.err||'error');return j},
  async post(body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.err||'error');return j},
  mine:(c,s)=>Remote.get({a:'mine',c:c+TAG,s}),
  all:(c,k)=>Remote.get({a:'all',c:c+TAG,k}),
  save:(c,s,stage,rec)=>Remote.post({a:'save',c:c+TAG,s,stage,rec}),
  check:(c,k)=>Remote.get({a:'check',c:c+TAG,k})
};
const Local={
  db(){return LS.get(LK+'-demo-db',{recs:{}})},put(d){LS.set(LK+'-demo-db',d)},
  async mine(c,s){const d=Local.db();return {ok:1,recs:Object.values(d.recs[c]||{}).filter(r=>String(r.seat)===String(s))}},
  async all(c,k){if(!await pinOK(k))throw new Error('key');const d=Local.db();return {ok:1,recs:Object.values(d.recs[c]||{})}},
  async save(c,s,stage,rec){const d=Local.db();d.recs[c]=d.recs[c]||{};d.recs[c][s+'|'+stage]=rec;Local.put(d);return {ok:1}},
  async check(c,k){if(!await pinOK(k))throw new Error('key');return {ok:1}}
};
/* Claude 上的後台：這個網頁自己的資料庫。只有登入老師（擁有者）帳號的裝置能讀寫 */
let db=null;
const withT=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable'}),ms||8000))]);
const Cloud={
  async mine(c,s){const d=await withT(db.doc('players/s'+s).get());return {ok:1,recs:d.exists?[d.data()]:[]}},
  async all(c,k){if(!await pinOK(k))throw new Error('key');const q=await withT(db.collection('players').get());return {ok:1,recs:q.docs.map(d=>d.data())}},
  async save(c,s,stage,rec){await withT(db.doc('players/s'+s).set(JSON.parse(JSON.stringify(rec))));return {ok:1}},
  async check(c,k){if(!await pinOK(k))throw new Error('key');return {ok:1}}
};
let API=ONLINE?Remote:Local, DEMO=!ONLINE, MODE=ONLINE?'remote':'demo';
const dbP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){return null}})();
async function ready(){
  if(db||ONLINE)return;
  const d=await Promise.race([dbP,new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(d){db=d;API=Cloud;DEMO=false;MODE='cloud'}
}
const DEV=(()=>{let d=LS.get('guoyu-dev',null);if(!d){d=Math.random().toString(36).slice(2,10);LS.set('guoyu-dev',d)}return d})();
const me={role:null,cls:DEFAULT_CLASS,seat:null,key:null,preview:false};
const SKEY=()=>`${LK}-me-${me.cls}-${me.seat}`, PKEY=()=>`${LK}-pending-${me.cls}-${me.seat}`;
/* 登入狀態：同一個分頁重新整理直接沿用；重新打開網頁時，學生只沿用「今天」選的座號 */
const LOGIN={
  get(){try{const v=sessionStorage.getItem(LK+'-login');if(v)return JSON.parse(v)}catch(e){}
    const s=LS.get(LK+'-login',null);if(s&&s.role==='student'&&s.day!==new Date().toDateString())return null;return s},
  set(v){if(v)v.day=new Date().toDateString();LS.set(LK+'-login',v);try{v?sessionStorage.setItem(LK+'-login',JSON.stringify(v)):sessionStorage.removeItem(LK+'-login')}catch(e){}}
};
const L='ABCD';
const Q=[{"n":1,"c":"S","s":"請問哪一族的原鄉主要是屏東縣和高雄市，而且命名制度是使用家屋連名的方式？","o":["阿美族","布農族","魯凱族","卑南族"],"a":2,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉排灣族、魯凱族與卑南族共 3族，皆屬於這類型名制。這三個民族是在個人名後附加家屋名，因此其完整之人名呈現出「個人名 + 家屋名」之形式。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":2,"c":"S","s":"魯凱族的文化中能獵到山豬的獵人會被賜予在頭飾上配戴什麼物品的資格？","o":["帝雉的羽毛","百合花","山豬的牙齒","穿山甲的鱗片"],"a":1,"e":"參考資料：原住民族委員會網站在魯凱族，狩獵是屬於男子的工作，男子要狩獵捕獲野生動物才能算是成年人，當男子陸續獵獲六頭（有些部落獵獲五頭）長出獠牙的公山豬（walisane）後，才可享有象徵獵人勇士榮譽的百合花配戴資格。小米在魯凱族人的生活中佔有重要地位，歲時祭儀都以小米為中心，在喜慶宴會中會製作小米糕 abai，象徵分享和慶賀。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/409F703B4E592A82D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":3,"c":"F","s":"每年春夏交替之際，花蓮新社部落噶瑪蘭族人會聚集舉辦海祭來祭祀祖靈，請問該祭典的參與對象是？","o":["男性","女性","老年人","巫師"],"a":0,"e":"參考資料：國家文化記憶庫噶瑪蘭族奇立板社海祭與豐年祭，在壯圍鄉新南國小舉辦豐年祭，由祭司面向日出的東方向祖靈及神明祈禱，祖靈應允後才能進行，上午包括迎賓舞、大會舞等，下午則由奇立板社勇士代表走上瞭望台大聲呼喊豐年祭的開始，青年勇士們戒護著頭目與長老群進到大會面向日出東方的位置，向祖靈報告進行豐年祭的慶祝活動，之後才進行大會舞及一系列的表演節目與晚會慶祝活動。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Event&id=514087"},{"n":4,"c":"F","s":"小美計畫暑假到屏東三地門地磨兒部落旅遊，請問她有可能剛好會遇上部落舉行什麼祭典？","o":["阿美族豐年祭","布農族開墾祭","泰雅族祖靈祭","排灣族收穫祭"],"a":3,"e":"參考資料：看見太陽-原住民族產業平台三地門鄉位於 24號省道旁，是屏東縣八個原鄉中面積最大的鄉，地處於中央山脈南端之大武山西側，依山傍河，地形複雜。「三地門」也稱作「地磨兒」，排灣族語 Timur的名稱原來是傳統領域的地名，指的是三地村現居地所在的位置，其意思指的是大地磨練的兒女，亦經過大自然和土地淬鍊與再造後，形塑出一個優質的太陽之子的意思。","u":"https://explorethesun.tw/travel_detail.php?id=74"},{"n":5,"c":"S","s":"Drepelrange Kusadha 為魯凱族人，請問依魯凱族的命名制度，此族人的名字是以那些要素組成？","o":["本人名＋母親名","本人名＋家屋名","父親名＋本人","氏族名＋本人名"],"a":1,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉排灣族、魯凱族與卑南族共 3族，皆屬於這類型名制。這三個民族是在個人名後附加家屋名，因此其完整之人名呈現出「個人名 + 家屋名」之形式。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":6,"c":"G1","s":"有學者研究認為臺灣是南島語族遷徙的起源，請問以下何者是可能的研究依據？","o":["語言學","考古學","古生物學","以上皆是"],"a":3,"e":"參考資料：中央研究院-研之有物〈千年文化寶藏就在你身邊！從語言證據找出南島語族發源地〉","u":"https://research.sinica.edu.tw/formosan-languages/"},{"n":7,"c":"S","s":"泰雅族人 Yobu Pasang，請問依據泰雅族的命名習慣，可以合理推斷此人父親的名字為？","o":["Yukan Pasa","Yawi Yobu","Yobu Kagi","Pasang Asaw"],"a":3,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉泰雅族、賽德克族、太魯閣族、阿美族、噶瑪蘭族與撒奇萊雅族， 共 6 族皆屬於這類型名制 。在這類型的名制中，人名的全名是由「個人名 + 親名」所構成。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":8,"c":"R","s":"民國 50 年代起，阿美族人因都市就業機會增加而遷居，在各都會區形成新部落，以下何者不是阿美族人主要遷居的城市？","o":["高雄市","新北市","臺中市","南投縣"],"a":3,"e":"參考資料：臺灣原住民族事典","u":"https://aborgpedia.alcd.center/detail?id=11880&search=&cat=0&race=0&writer="},{"n":9,"c":"H1","s":"撒奇萊雅族，在哪一場戰役中與清人交戰，戰後族人四散隱姓埋名，直到2007 年才正名？","o":["達固部灣戰役","七腳川事件","牡丹社事件","太魯閣戰役"],"a":0,"e":"參考資料：原住民族傳統智慧創作保護資訊網1878 年在奇萊平原上發生的戰役事件，迫使撒奇萊雅族隱身 埋名於阿美族部落，直到 2007 年元月 17 日在族人努力之下，經 行政院通過正名為臺灣原住民族第十三族。撒奇萊雅族第一套族 服係由磯崎部落族人吳秀梅於 2006 年 6 月 6 日設計製作完成。 撒奇萊雅族服的原創構想來自四大色系：暗紅色-族人躲避 戰禍殺戮時凝乾的鮮血、土金色－代表族群與土地的關係、藏青色的裙片－象徵逃難時的涉水、深咖啡色的綁腿－代表逃難過程沾 染的乾枯樹葉和泥土的混合。","u":"https://www.titic.cip.gov.tw/app/caseDetail?num=1081204000014"},{"n":10,"c":"P","s":"因 88 風災幾乎淹沒了的小林部落屬於以下哪個族群？","o":["馬卡道族","西拉雅族","噶哈巫族","大武攏族"],"a":3,"e":"參考資料：看見太陽-原住民族產業平台原本居住在高雄甲仙村的居民，因 2009 年的八八風災，一夜之間整個村被大雨和土石流吞噬，最親愛的親人也不幸離開，從此之後，留下來的居民開始重建之路，大家遷移至現在的杉林區建造新的家園，而他們的心也開始重建，一點一滴盡可能修補失去親人的傷痛，並努力復興原本屬於自己的文化 - 大武壠族 (自稱大滿族，為平埔族 )，也成立了大滿舞團，讓大家可以聚在一起為自己的文化盡一份心力！","u":"https://explorethesun.tw/story_detail.php?id=34"},{"n":11,"c":"C","s":"老七佳部落是現存最完整的石板屋聚落，被列為世界文化遺產潛力點，它原屬哪一個原住民族群？","o":["魯凱族","布農族","排灣族","阿美族"],"a":2,"e":"參考資料：原住民族委員會文獻電子期刊《活著的老七佳石板屋聚落：談老七佳石板屋聚落與部落人共同經歷的變遷與重建之路》排灣族傳統的石板家屋，是族人與自己家族記憶最深刻的連結，而一個傳統的石板屋舊聚落，更是蘊含著部落人集體的空間記憶。老七佳石板屋聚落距今到現在有超過將近 500年以上的歷史，在這過程當中歷經了部落自主時代、荷蘭時代、清代、日治時代、以及光復後一直到現在的國民政府執政時期。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/301"},{"n":12,"c":"C","s":"泰雅族以織布文化聞名，試問泰雅族人特別擅長利用下列哪種植物做應用？","o":["稻草","苧麻","香蕉絲","棕梠葉"],"a":1,"e":"參考資料：國家文化記憶庫〈泰雅族染織用植物〉苗栗縣泰雅族手工藝精湛，織布染布用料皆取自山林，自給自足，特別是苧麻，是泰雅傳統織布的主要材料。編織則用以製作生活用具，如背籃、簍等，使用的植物有藤、竹。纖維較為強韌的植物可作為繩索或綁縛線材，如：梧桐、構樹、山棕、山麻黃和山芙蓉等。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Invisible&id=322842"},{"n":13,"c":"A","s":"布農族著名的複音音樂Pasibutbut，試問他們是為了以下何種原因吟唱？","o":["傳達愛慕之情","戰爭前的頌歌","戰後凱旋之歌","祈禱小米豐收"],"a":3,"e":"參考資料：臺北市原住民族教育資源中心網站傳統上 Pasibutbut（祈禱小米豐收歌）是僅流傳於布農族 Isbukun（郡）群內的一首祭儀歌謠。1930年代以後在日本治台時期的集團移住政策下，絕大多數的布農族部落被移住，在新移住村落開始大量出現不同部族群（尤其郡群與巒群間）混居的現象。在這樣的歷史背景與其族群分佈下，Pasibutbut歌謠開始流傳至 Isbukun群以外的Takbanuaz（巒）群。","u":"https://tpiercenter.tp.edu.tw/pasibutbutliterature"},{"n":14,"c":"C","s":"雅美族人發展出特有的建築形態抵禦颱風及東北季風，請問此種建築是下列哪一個選項？","o":["杆欄式建築","合掌屋","地下屋","石板屋"],"a":2,"e":"參考資料：臺灣原住民族文化知識網雅美（達悟）族家（asa ka vahay）包含主屋（vahay）、工作房（makarang）與涼臺（tagakal）三種建築，建築材料為木、石、竹、茅等。主屋（vahay）建於地穴中，依山坡高低挖成階梯式的地面，挖出的土壤置於四周，只露出屋頂於地表，成為半地下式的屋體形式。主屋最早為一個出入口的棲身小屋，由單身男子或年輕夫婦在懷孕時離開家庭建立，並隨著經濟能力改善後另外尋地建造三門、四門主屋。工作房（makarang）又稱為高屋，分為上、下兩層；上層為白天工作之用，下層空間多作為儲藏之用，可放置柴薪、漁具。涼臺（tagakal）是高於地表的干欄建築，是以茅草蓋頂的長方形單屋，族人不但在此休息乘涼、製作漁網、編織籐籃，夏季也可在此過夜。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=E2774B2FD4A88AD0&sms=D8939B9274D1E899&s=8EEB8FD24FCFCCD4"},{"n":15,"c":"G1","s":"宜蘭寒溪部落過去因多族群交會發展出混合語—克里奧語，請問它可能是由哪些語言混合而成？","o":["賽德克語、日語","排灣語、西班牙語","泰雅語、日語","太魯閣語、荷蘭語"],"a":2,"e":"參考資料：TITV原視新聞網部落族人共識 「台灣宜蘭克里奧語」申請認定","u":"https://news.ipcf.org.tw/176035"},{"n":16,"c":"G1","s":"在臺灣原住民族中分布區域最廣的族群是哪一族？","o":["泰雅族","阿美族","魯凱族","布農族"],"a":0,"e":"參考資料：臺灣原住民族文化知識網泰雅族分布在臺灣中北部山區，包含新北市、桃園市、新竹縣、苗栗縣、臺中市、南投縣、宜蘭縣等七縣市的山區各鄉鎮，是臺灣原住民族中分布領域最廣的民族。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=55BE1C83A051D6B4&sms=9424A464D3C37244&s=E3F221FC3446316E"},{"n":17,"c":"S","s":"假設有機會回到日治時期前的臺灣，在現今的屏東縣三地門鄉、瑪家鄉，有可能會看見什麼景象？","o":["成年男女有紋面","男子吟唱pasibutbut","居民舉辦矮靈祭","部落領袖頭飾佩戴熊鷹羽毛"],"a":3,"e":"參考資料：屏東縣瑪家鄉公所網站瑪家鄉是一個美麗而富有特色的鄉鎮，本鄉蘊含著豐富的自然人文及生態景觀，其中有著名的排灣族發源地遺址--舊排灣及Padain 八大源部落石板聚落建群、撒拉灣瀑布族及北大武山、白賓山、笠頂山為轄區非常著名的景點","u":"https://www.pthg.gov.tw/townmjt/cp.aspx?n=E1F721B2CF3E6F84"},{"n":18,"c":"M","s":"下列哪一族認為其祖先是遠古時代由大石頭分裂爆開後而來的？","o":["鄒族","泰雅族","阿美族","布農族"],"a":1,"e":"參考資料：臺灣原住民族文化知識網泰雅族人起源傳說是在遠古時代，由大石頭分裂爆開後走出男、女性的祖先，之後遷徙到各地建立部落。大石頭爆裂的起源地，泰雅族兩個亞群有不同看法，賽考列克群認為在南投仁愛鄉發祥村的瑞岩，又稱為賓斯布干（Piasebukan）；澤敖列群則認為起源地在新竹五峰的大壩尖山（Papakwaqa）。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=55BE1C83A051D6B4&sms=9424A464D3C37244&s=E3F221FC3446316E"},{"n":19,"c":"R","s":"因對經濟與教育資源的追求，促使族人口移居都市，請問目前都市原住民族人口最多分布在是哪一縣市？","o":["彰化縣","雲林縣","桃園市","嘉義縣"],"a":2,"e":"參考資料：臺灣原住民族事典","u":"https://aborgpedia.alcd.center/detail?id=11880&search=&cat=0&race=0&writer="},{"n":20,"c":"G1","s":"因 88 風災，屏東好茶、大社及瑪家部落遷村至禮納里永久屋聚落，這三個部落分別屬於哪個族群？","o":["布農族、布農族、排灣族","排灣族、魯凱族、魯凱族","魯凱族、排灣族、排灣族","排灣族、排灣族、排灣族"],"a":2,"e":"參考資料：茂林國家風景區網站2009 年莫拉克風災重創屏北三鄉，政府協助居民重建家園，選定瑪家農場作為永久屋基地，因此將三地門鄉大社村、瑪家鄉瑪家村及霧臺鄉好茶村三村的居民遷移來此，並由世界展望會援建永久屋，命名為「禮納里」部落，象徵重生希望的美麗家園。","u":"https://www.maolin-nsa.gov.tw/zh-tw/attraction/119/"},{"n":21,"c":"R","s":"行政院明訂每年 8 月 1 日為「原住民族日」，為的是紀念什麼事？","o":["原住民族的豐年祭都在八月","憲法增修條文正式正名為「原住民」的日期","原住民族族語認證日","以上皆非"],"a":1,"e":"參考資料：行政院網站原民會強調，以原住民入憲之日作為原住民族日，有三個重要意涵：首先，「原住民族」是自我決定的名稱，是族群主體意識的建構，也象徵自尊的重建及社會正當地位的追求；其次，正名運動的歷程，原住民族所爭取的，不僅是「名稱」的自我決定權，也包括自治及土地等核心的固有權利。最後，原住民族日提醒我們，臺灣有其綿長久遠的歷史，至少六千年前，原住民族就已經在臺灣，並發展出多元而獨特的文化，期盼國人都能尊重並分享優美的原住民族文化。","u":"https://www.ey.gov.tw/Page/9277F759E41CCD91/7df9f14c-a512-4253-86ed-2dc602bf3232"},{"n":22,"c":"R","s":"請問哪種權利的實踐，可以被視為原住民族集體權的實現？","o":["文化權","自決權","認同權","以上皆是"],"a":3,"e":"參考資料：原住民族文化事業基金會網站依據聯合國大會在 2007年通過的「原住民權利宣言」（United NationsDeclaration on the Rights of Indigenous Peoples, UNDRIP），把原住民族的權利概分為生存權及平等權兩大類：生存權／生命權關切的是如何保障原住民的基本生存，而平等權則要積極地推動原住民的基本權利。我們又可以將平等權區分為公民權以及集體權：前者關心的是如何確保原住民個人不被歧視，後者則以原住民集體為關照的單位，包括認同權、自決權、文化權、財產權／土地權，以及補償權。文╱施正鋒（國立東華大學民族事務及發展學系教授）","u":"https://insight.ipcf.org.tw/article/410"},{"n":23,"c":"E","s":"各個原住民族各自發展出對肉品或海鮮的保存方式，請問以下哪個是可能會有的保存方式？","o":["煙燻","醃漬","風乾","以上皆是"],"a":3,"e":"參考資料：專欄文章〈傳統部落美味的採集與保存-保存蛋白質食物有祕方〉文字/林瑞珠(原住民族事務委員會)","u":"https://alive.businessweekly.com.tw/single/Index/ARTL003014570"},{"n":24,"c":"C","s":"石板屋為排灣族與魯凱族具特色的建築形式，會把門口屋簷做得很低，請問這是為了什麼原因？","o":["遮陽","有利抵禦外敵","防雨","防風"],"a":1,"e":"參考資料：國家文化資產網站〈排灣族傳統石板屋建造技術〉排灣族石板屋傳承了先人對建築生活起居等的智慧，呈現出其群體互助、建築工法、對禦寒取暖防震的需求、階級劃分、防禦觀念、對長者的尊重與懷念、長幼有序、生活起居配置等象徵，都顯現了建築之外的人文概念，而使得石板屋不僅僅是建築物而已，還是排灣族文化的展現。","u":"https://nchdb.boch.gov.tw/assets/advanceSearch/ptp/20250618000001?preserverId=23486"},{"n":25,"c":"P","s":"荷蘭人離開後「新港文書」仍是台南一帶平埔族群與漢人往來常書寫的文字，通常做為什麼用途？","o":["田野調查","語言教學","訂定契約","以上皆非"],"a":2,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從新港文書看 16-19世紀的平埔族〉荷蘭人來到臺灣後，將文字系統輸入鄰近荷蘭人的原住民部落，特別是最靠近大員（今臺南安平區）熱蘭遮城行政中心的西拉雅族新港社（今臺南新市區），最早設立教會學校（1636年），最先接觸文字教育，持續性也最久。因此，一些部落年輕人學會使用羅馬字來書寫自己的母語－新港語（SinkanLanguage），也曾被派到其他部落教導羅馬字。這新款的文字語言後來主要應用在契約文書上，被稱為「新港文書」（Sinkan Manuscripts），俗稱「番仔契」、「番仔字」","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/46"},{"n":26,"c":"S","s":"某族使用親從子名，名字會從自己出生、生了孩子到有了孫兒而改變，請問這個族群是以下何者？","o":["阿美族","西拉雅族","賽德克族","雅美族"],"a":3,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉世居蘭嶼的雅美族，傳統名制為「親從子名制」，即家中長子、女出生後，直系血親要冠上相對於長嗣的稱謂。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":27,"c":"F","s":"各族各有信仰、時節及規範的禁忌，阿美族「ilisin」俗稱豐年祭，但「ilisin」其實是什麼意思？","o":["慶祝豐收","在禁忌中","風調雨順","在夏季"],"a":0,"e":"參考資料：花蓮縣文化局(文化資產)網站〈阿美族Fakong 部落 ilisin〉豐年祭為阿美族最具代表性的民俗文化資產，Makotaay(港口)部落阿美族豐年祭（Ilisin，音：儀利信）是該部落最重要的年度祭祀活動，也是海岸阿美族系統各部落代表性祭儀之一。","u":"https://www.hccc.gov.tw/zh-tw/CulturalHeritage/Detail/153"},{"n":28,"c":"R","s":"推倒吳鳳銅像事件平反對鄒族出草文化的醜化，吳鳳鄉也因此改名，請問台灣當時的吳鳳鄉，就是現在的哪一個鄉？","o":["南投信義鄉","嘉義阿里山鄉","新竹五峰鄉","苗栗泰安鄉"],"a":1,"e":"參考資料：專欄文章〈【臺灣通史】吳鳳神話的破滅：被統治者捏造的成神之路，背後隱藏的殘忍真相〉","u":"https://storystudio.tw/article/gushi/wu-feng"},{"n":29,"c":"G1","s":"高雄那瑪夏區有兩族群經政府認定為第 15、16 族，包含了拉阿魯哇族以及以下哪個族群？","o":["邵族","撒奇萊雅族","噶瑪蘭族","卡那卡那富族"],"a":3,"e":"參考資料：原住民族委員會網站卡那卡那富族、拉阿魯哇族與嘉義縣的阿里山鄉、南投縣信義鄉久美社區的鄒族人，有很長的一段時間被統稱為「鄒族」，之後因語言差異甚大，完全無法以族語溝通，且三個族群各自有自己的歷史想像、起源傳說、祭典儀式及傳統的社會結構，經卡、拉兩族的申請「正名」，政府於 103 年6 月 26 日以正式的儀式宣布，認定各為獨立的族群。拉阿魯哇族為第 15 族，卡那卡那富族為第 16 族。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/91A2A514F76BAEACD0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":30,"c":"G2","s":"請問新北市行政範圍內，哪個行政區為原住民地區？","o":["永和區","烏來區","金山區","淡水區"],"a":1,"e":"參考資料：原住民族委員會網站-55 個原住民族地區簡介-新北市","u":"https://www.cip.gov.tw/zh-tw/village/info.html?VID=762332B1D5BAC5CA&cumid=D0636733C6861689"},{"n":31,"c":"P","s":"下列哪一族是居住在臺北地區的平埔族群，總統府前的大道就是以它命名的？","o":["西拉雅族","噶瑪蘭族","凱達格蘭族","拉阿魯哇族"],"a":2,"e":"參考資料：臺灣原住民族文化知識網〈凱達格蘭族簡介〉1996年3月21 日，當時的臺北市長陳水扁根據學者專家的意見，將總統府前的介壽路改名為凱達格蘭大道，旁邊的廣場也一併更名，作為對臺灣原住民族歷史與文化的紀念與尊重。自此之後，臺灣的社會大眾才知道大臺北地區也有一支名叫凱達格蘭的原住民族。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=22D6C3ED637DD0E0&sms=EA52ACA1EE5C7771&s=A51986959D39F01E"},{"n":32,"c":"M","s":"傳說中邵族祖先因追逐白鹿而找到一處新天地，並在該地安居至今，請問此處是哪個地方？","o":["烏來瀑布","海神宮","日月潭","涼山瀑布"],"a":2,"e":"參考資料：臺灣原住民族文化知識網〈邵族歷史遷移〉相傳，邵族祖先原居於嘉南平原一帶，因狩獵過程中進入中央山脈，獵人無意間發現罕見的白鹿，經過數天的追逐而到達現今的 Puzi（土亭仔），白鹿即躍入日月潭，邵族祖先因此停留，發現了此地魚類豐富，土地肥沃，是個適合耕作和獵漁的新天地，所以帶來族人在這裡定居下來。日月潭地區的邵族人，以 Lalu（舊稱光華島、珠仔嶼）為最高祖靈地，清領時代日月潭周邊地區都稱為「水沙連」，有頭社、水社、猫蘭社、審鹿社、埔社、眉社等社群，合稱為「水沙連六社」。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=55BE1C83A051D6B4&sms=9424A464D3C37244&s=C01D612D86DDA6F0"},{"n":33,"c":"F","s":"下列有關各原住民族的族群文化與特色，何者的敘述有誤？","o":["賽夏族的紋面","卡那卡那富族的米貢祭","排灣族的火神祭","達悟族的拼板舟"],"a":2,"e":"參考資料：臺灣原住民族文化知識網撒奇萊雅族簡介，火神祭典（palamalan a lisin）火神祭以光緒4 年（1878）加禮宛事件為祭典核心概念，屬於跨部落的全族紀念性活動。加禮宛事件發生時，達固部灣部落（Takubuan）是當時最大的部落，部落外圍種有刺竹防禦。清兵因刺竹隔離而無法接近部落，最後引火射箭攻擊，造成部落茅草屋燒毀、族人傷亡。之後，族人因分散各地而無法祭祀事件中傷亡先祖。撒奇萊雅族因遭歷史事件的祝融吞噬，而致民族文化發展受挫。歷經一世紀後，族人以火神祭典弔唁祭祀傳統領袖夫婦以及在加禮宛事件中犧牲的族人。火神祭典除了紀念歷史事件外，更具有凝聚民族認同的意義。火神祭典的儀式有：一、迎神，二、祈福，三、繞境，四、祭神，五、送神。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/588FAD20D4E16D65D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":34,"c":"R","s":"1970 年代政府在蘭嶼存放某有害物質，成為達物族人口中的惡靈，請問他們所指的惡靈是什麼？","o":["垃圾掩埋場","焚化爐","靈骨塔","核廢料"],"a":3,"e":"參考資料：公視網站-我們的島紀錄片第 644集《黃色罐頭與我》","u":"https://ourisland.pts.org.tw/content/307"},{"n":35,"c":"P","s":"南投埔里四庄：牛眠山、守城份、大湳、蜈蚣崙，此四庄皆屬於哪個原住民族的部落？","o":["西拉雅族","馬卡道族","噶哈巫族","布農族"],"a":2,"e":"參考資料：國家文化記憶庫網站〈噶哈巫「四庄」的由來〉根據噶哈巫語研究者翁勤雯採集自噶哈巫族耆老潘德興，噶哈巫語稱「四庄」為 「supat eten」。陳萬育提到，由於守城和牛眠是屬於同一個里，因此以前在說四庄的時候並不會提到牛眠，當時提到四庄通常是在說守城份（今南投縣埔里鎮牛眠里的牛眠和守城部落）、 大湳（今南投縣埔里鎮大湳里大湳部落）、蜈蚣崙（今南投縣埔里鎮蜈蚣里蜈蚣崙部落）、烏牛欄（今南投縣埔里鎮愛蘭台地一帶）","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Place&id=721525"},{"n":36,"c":"S","s":"婚禮女方如來自部落領袖或貴族，家屋前可架鞦韆，象徵女子純潔與高貴，請問這是何族的婚禮？","o":["布農族","阿美族","排灣族","賽夏族"],"a":2,"e":"參考資料：屏東縣國家文化記憶庫：南國憶閾在排灣、魯凱兩族，均有結婚儀式與休閒型式的盪鞦韆。只有女子才能使用，如果男性使用，相傳以後就獵不到山豬，因此通常是女子盪男子搖，作為男女短暫接觸卻能相互聯誼的活動。","u":"https://southland.culture.tw/pingtung/zh-tw/YMevent?offset=0&limit=10&query=%7B%7D&sort=startDate&order=desc"},{"n":37,"c":"E","s":"屏東瑪家鄉的 cinavu 是用月桃葉將小米跟豬肉包在一起的小米粽，試問cinavu 是下列哪個族群的食物？","o":["鄒族","達悟族","排灣族","阿美族"],"a":2,"e":"參考資料：農傳媒網站【鄉間食堂】忠於原味：排灣部落的年味──Qavay 與Cinavu屏東原住民族部落，如排灣族，遇到喜慶過節時常可見兩種重要食物，Qavay（阿粨）與 Cinavu（吉拿富）。原料取材自上天餽贈部落的禮物──小米，搗成糊狀類似麻糬口感，即成阿粨；或保留原粒包入油脂飽滿的豬肉，類似粽子，便成口感截然不同的吉拿富。","u":"https://www.agriharvest.tw/archives/123275/"},{"n":38,"c":"H2","s":"李棟山事件是新竹原住民族過去抵抗日軍所發生的事件，請問當地原住民族應為哪一個族群？","o":["阿美族","泰雅族","西拉雅族","賽德克族"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈帝國侵略的前線：馬武督社在日治初期的抵抗與爭戰〉新竹縣的關西地區，長期以來是泰雅族馬武督群的傳統生活領域，直至 18世紀才漸漸由客家、閩南人群與竹塹社熟番共同拓墾。在漢人及熟番移墾關西地區前，靠近中央山地的區域長期以來是屬於泰雅族 M&#x27;utu（馬武督群）社群的活動領域（徐榮春 2010：244）。1馬武督泰雅人原來係 Mrkwang（馬里光群）的一支，昔日馬里光群從大漢溪上游地區翻越李棟山，向尖石鄉北得拉曼山林間遷徙，散居於當代的錦屏村那羅、嘉樂村與新樂村等地，成為尖石鄉前山人數最多的社群。其中一支族人更早向北遷徙，居住在關西鎮馬武督地區，成為日治時期稱之的「馬武督蕃」（鹿野忠雄 1941：1）。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/617"},{"n":39,"c":"S","s":"下列有關泰雅族的文化，何者不正確？","o":["有紋面習俗","是母系社會","是父系社會","善於織布"],"a":1,"e":"參考資料：1.原住民族委員會網站-泰雅族簡介2.看見太陽-原住民族產業平台〈充滿魅力的泰雅族部落！一起挖掘來自遠古時代的泰雅族文化〉","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/8C87B4AF56B788EED0636733C6861689/info.html?cumid=8F19BF08AE220D65https://explorethesun.tw/story_detail.php?id=60"},{"n":40,"c":"G1","s":"泰雅族語 Lmuhuw 字義為穿越、流動，也指遷徙的古調吟唱及其內容，可推測他們有何遷移的習慣？","o":["沿著河川遷移","依照星象遷移","隨獵物遷移","以上皆非"],"a":0,"e":"參考資料：臺灣原住民族事典《Lmuhuw語典—泰雅族口述傳統重要語彙匯編》兩冊（2017、2021）語典相繼出版，收錄之詞條內容與性質概分為三類。一為深具文化意涵之單字、習俗用語；二為與修辭相關的複合形容語彙詞組；三為與遷徙歷史相關的各河川流域周邊社群、部落地名、祖先人名、入山口之平地鄉鎮古地名、外族稱名。","u":"https://aborgpedia.alcd.center/detail?id=9973&search=&cat=0&race=0&writer="},{"n":41,"c":"F","s":"布農族木刻畫曆中的時節分配、祭儀期間，應該是以什麼為標準劃定？","o":["小米農耕","太陽運行","水稻的生長","家畜的生長"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈傳說與月亮的約定——布農族祭事曆 Islulusan〉布農族之年與祭：在布農族的傳統觀念裡，Tastuhamisan（一年）分為二個季節，分別是 Hamisan（冬季）與 Talabal（夏季），兩個季節的轉換期是在秋季中旬及春天中旬。秋季中旬後是 Hamisan（冷天氣）的開始，是開墾荒地及播種小米的開始，對布農族人來說也是一個「年」的開始，因此布農族人對於年的使用也稱呼 Hamisan。而春天中旬之後到秋季中旬之間即是 Talabal（夏季）。布農族一個 Hamisan（年）在平年（katasa&#x27;）時，分有 12個月，若為閏年（kadusa&#x27;），就得在12個月之後加上 1個月，此一添加出來的月份叫做 Buanaluan（休息之月）。意即，如果是閏年，就會多出第 13個月，所以其第 12個月大可慢慢繼續前月之拓荒或挖墾現耕地。所謂的Tastubuan（一個月），是指能夠看到月亮的期間，而那些暗月的日子是空檔，不把它算在月份內。（馬淵東一：1936）。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/161"},{"n":42,"c":"H2","s":"泰雅族的紋面習俗是在哪個時期被禁止的？","o":["荷西時期","清領時期","明鄭時期","日治時期"],"a":3,"e":"參考資料：1.雪霸國家公園管理處保育研究報告〈泰雅族紋面耆老口述歷史及影像紀錄成果報告〉泰雅族獵頭習俗與紋面息息相關，日本在 1895年殖民台灣後，鑑於台灣原住民居住的山地地區林產資源豐富，但因原住民族持續反抗而無法利用，日本殖民者在二十世紀初期，決定進行全面的理蕃計畫，透過武力征討屈服原住民。1913年，日本殖民政府明文禁止泰雅族人紋面，正式滅絕了這項歷史悠久的原住民紋面文化(戚嘉林：1920)。2.專欄文章〈消失中的黥面文化……〉文‧陳淑美/圖‧邱瑞金","u":"https://ws.moi.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvT2xkRmlsZV9TUE5QL1Jlc3VsdFJlcG9ydC85ODIw5rOw6ZuF5peP57SL6Z2i6ICG6ICB5Y%2Bj6L%2Bw5q235Y%2By5Y%2BK5b2x5YOP57SA6YyEX00ucGRm&n=OTgyMOazsOmbheaXj%2Be0i%2BmdouiAhuiAgeWPo%2Bi%2FsOatt%2BWPsuWPiuW9seWDj%2Be0gOmMhF9NLnBkZg%3D%3D&icon=.pdfhttps://www.taiwan-panorama.com/Articles/Details?Guid=34e1de9f-cb1b-44ec-9f6c-21fd5821a9eb&CatId=11&postname=%E6%B6%88%E5%A4%B1%E4%B8%AD%E7%9A%84%E9%BB%A5%E9%9D%A2%E6%96%87%E5%8C%96%E2%80%A6%E2%80%A6&srsltid=AfmBOorxiUGe9H5J6pKpLndHd5GXrudtprQspFmiWjm9OBK0-OVAG7g1"},{"n":43,"c":"G1","s":"某族群的遷移足跡幾乎遍佈中央山脈，橫跨南投、高雄、花蓮到臺東，請問該族群會是哪一族？","o":["泰雅族","排灣族","布農族","達悟族"],"a":2,"e":"參考資料：開放博物館網站-《卓溪鄉布農族人遷移足跡》策展人/國立臺東大學南島文化中心布農族廣泛地分佈在台灣中部、南部山區推測是在 17世紀開始，部分族人從在南投濁水溪上游山區往東越過中央山脈在新天地落地生根。","u":"https://openmuseum.tw/muse/exhibition/84766cbee4c4b3268912383ea53fab85#front"},{"n":44,"c":"P","s":"臺南吉貝耍部落為哪個平埔族群原住民族的部落，且他們有什麼祭儀？","o":["西拉雅族，夜祭","賽夏族，矮靈祭","泰雅族，開墾祭","噶哈巫，牽田"],"a":0,"e":"參考資料：交通部觀光署西拉雅國家風景區管理處網站吉貝耍阿立母夜祭位於臺南市東山區的吉貝耍部落(Kabua sua)，全村居民幾乎都是「阿立母」的忠實信徒，72%的住家的神龕頂桌上或壁腳，供奉著「阿立矸仔」（祖靈瓶），此種祖靈信仰密集現象，為臺灣第一。「吉貝耍」為東山區東河里的古地名稱，在西拉雅族語為木棉花部落的意思。","u":"https://www.siraya-nsa.gov.tw/zh-tw/about-siraya/jibeishua-night-sacrifice"},{"n":45,"c":"R","s":"國家為保障原住民族基本權利，2015年通過與原住民族權益有重大關係之法案，請問是以下何者？","o":["原住民族基本法","原住民族身分法","原住民族教育法","原住民族傳統智慧創作保護條例"],"a":0,"e":"參考資料：全國法規資料庫法規名稱：原住民族基本法 EN修正日期：民國 107 年 06 月 20 日法規類別：行政 ＞ 原住民族委員會 ＞ 綜合規劃目","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0130003"},{"n":46,"c":"E","s":"原住民族文化皆有永續概念，如泰雅族嚴禁在動物繁衍季節狩獵，請問這個季節最有可能是何時？","o":["春","夏","秋","冬"],"a":0,"e":"參考資料：族語E樂園課本-四季泰雅語pucing ppqaluq 最後的獵人(類別：散文與小說)泰雅族有許多的禁忌，在狩獵方面，每年有一定的時期是狩獵季節，並非天天打獵；在狩獵前更有嚴謹的狩獵儀式，如果在祈福或占卜（鳥占；ssiliq）中預知不祥的徵兆，絕不能貿然上山狩獵；另外在動物繁殖期嚴禁狩獵（通常為 4月至 6月或延伸至10月），或是獵捕到懷孕、幼小的動物一定要放生；捕獵所獲數量足夠部落族人所需，就不能繼續大肆濫捕。","u":"https://web.klokah.tw/extension/rd_practice/index.php?d=10&l=25&view=culture"},{"n":47,"c":"E","s":"阿美族 Palakaw 捕魚蝦的方式是讓魚蝦自由出入陷阱，想吃才網撈，由此能看出他們有什麼觀念？","o":["生態永續","發展養殖漁業","補越多魚越好","以上皆非"],"a":0,"e":"參考資料：水利署電子報網站〈馬太鞍的巴拉告 恢復河川生命力〉花蓮溪上游河段的光復地區，住著世居在馬太鞍濕地的阿美族人，傳承與自然共存的傳統智慧，在不竭澤而漁的原則下，設計出一套捕魚蝦的陷阱網，在阿美族語中稱為「巴拉告」（Palakaw），意思是「讓魚棲息的池塘」。","u":"https://www.wra.gov.tw/epaper/Article_Detail.aspx?n=30173&sms=9942&s=8949"},{"n":48,"c":"H1","s":"1874 年日本以琉球人 1871 年八瑤灣事件被殺害為藉口，派兵攻打該部落。請問，該事件史稱什麼事件？","o":["大分事件","牡丹社事件","七腳川事件","太魯閣事件"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈牡丹社事件的地圖史料與空間探索（上）〉1871 年11月，琉球宮古島的船隻途遇暴風，漂流到臺灣恆春半島東海岸的八瑤灣（日本記此地有高士佛港，今滿州鄉港子、九棚一帶），54名船員被當地排灣族高士佛社原住民殺害。由於琉球也向薩摩進貢，為中、日雙屬的藩屬國，後來日本入侵臺灣，就以此事為由。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/99"},{"n":49,"c":"H1","s":"羅妹號事件後，美國駐廈門領事李仙得與十八社頭目 Tokitok 會談達成共識，此過程史稱什麼？","o":["南岬之盟","牡丹社事件","瑯嶠之盟","西來庵事件"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從羅妹號事件到南岬之盟：誰的衝突？誰的和解？〉羅妹號事件發生在 1867年3月，導因於美國商船羅妹號由廣東汕頭駛向牛莊的途中，因遭遇暴風而漂流至臺灣南部海域的七星岩觸礁，生還者在墾丁一帶上陸時遭到龜仔律社原住民襲擊，最後有一名廣東籍水手逃脫、報官，才使得整起事件受到美方的高度重視。當時駐廈門領事李仙得，因為同時兼理美國在臺灣的外交事務，1867年 4月獲報後便至臺灣與兵備道吳大廷等人進行會談。然而臺灣官員以原住民之地非屬清國版圖為由，拒絕出兵懲兇並規避責任，李仙得無功而返。同年 6月，美國政府下令巡洋艦隊討伐原住民，因不諳地理且屢遭伏擊而大敗。李仙得和美國公使蒲安臣（Anson Burlingame）一起向清政府提出嚴正抗議，清國在外交壓力下，責令閩浙總督吳棠與道臺吳大廷調查該事件及征伐原住民，並由臺灣鎮總兵劉明燈親率兵勇 500人深入南臺灣協助美方。9月，李仙得親赴前線，在沒有必勝的把握下，決計採取外交手段，透過必麒麟（Wiliam A. Pickering）擔任通譯居中斡旋，取得與十八社頭目卓杞篤（Tauketok）晤談的機會。這場稱之為「南岬之盟」所達成的共識為：卓杞篤所轄十八社承諾，保護往後漂流到海岸的所有歐美人的生命財產安全。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/487"},{"n":50,"c":"H2","s":"進入日本統治時期，臺灣出現多起武力抗日行動，其中余清芳等人領導的噍吧哖事件的別稱為何？","o":["南岬之盟","瑯嶠之盟","牡丹社事件","西來庵事件"],"a":3,"e":"參考資料：台灣歷史文化地圖網站【西來庵事件研究】發生於公元一九一五年夏天的噍吧哖事件，可以說是日本統治臺灣期間所發生規模最大的一件武裝抗爭事件。噍吧哖是地名，即今日的台南縣的玉井鄉，此一武裝抗爭事件主要的戰役都發生在此地，所以稱做「噍吧哖事件」。又由於此事件是因余清芳（1879-1915）、羅俊（1854-1915）和江定（1866-1916）等人不滿日本殖民政府，意圖發動武裝抗爭，建立自己的領導政權，因此也稱為「余清芳事件」。","u":"https://thcts.sinica.edu.tw/themes/rd101-0.php"},{"n":51,"c":"C","s":"請問分布在臺東、高雄地區之布農族傳統服飾樣式，受到其他哪些周遭族群的影響比較多？","o":["魯凱族、排灣族","排灣族、阿美族","阿美族、卑南族","卑南族、達悟族"],"a":0,"e":"參考資料：原住民族委員會網站-原住民族分布區域","u":"https://www.cip.gov.tw/zh-tw/menu/data-list/6726E5B80C8822F9-info.html?cumid=6726E5B80C8822F9"},{"n":52,"c":"F","s":"某物是布農之寶，日治時期被稱為「繪曆」，祭司會用來記錄祭典時間，請問某物為何？","o":["日曆","木刻畫歷","石板曆","月曆"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈傳說與月亮的約定——布農族祭事曆 Islulusan〉布農族之年與祭：在布農族的傳統觀念裡，Tastuhamisan（一年）分為二個季節，分別是 Hamisan（冬季）與 Talabal（夏季），兩個季節的轉換期是在秋季中旬及春天中旬。秋季中旬後是 Hamisan（冷天氣）的開始，是開墾荒地及播種小米的開始，對布農族人來說也是一個「年」的開始，因此布農族人對於年的使用也稱呼 Hamisan。而春天中旬之後到秋季中旬之間即是 Talabal（夏季）。布農族一個 Hamisan（年）在平年（katasa&#x27;）時，分有 12個月，若為閏年（kadusa&#x27;），就得在12個月之後加上 1個月，此一添加出來的月份叫做 Buanaluan（休息之月）。意即，如果是閏年，就會多出第 13個月，所以其第 12個月大可慢慢繼續前月之拓荒或挖墾現耕地。所謂的Tastubuan（一個月），是指能夠看到月亮的期間，而那些暗月的日子是空檔，不把它算在月份內。（馬淵東一：1936）。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/161"},{"n":53,"c":"F","s":"木刻畫曆等於是布農族人的行事曆，意象簡明易懂，請問中，畫曆上的刻痕代表的是什麼？","o":["一天","一個月","一季","一年"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈傳說與月亮的約定——布農族祭事曆 Islulusan〉布農族之年與祭：在布農族的傳統觀念裡，Tastuhamisan（一年）分為二個季節，分別是 Hamisan（冬季）與 Talabal（夏季），兩個季節的轉換期是在秋季中旬及春天中旬。秋季中旬後是 Hamisan（冷天氣）的開始，是開墾荒地及播種小米的開始，對布農族人來說也是一個「年」的開始，因此布農族人對於年的使用也稱呼 Hamisan。而春天中旬之後到秋季中旬之間即是 Talabal（夏季）。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/161"},{"n":54,"c":"F","s":"哪一個原住民族會舉行米貢祭來感謝賜予族人小米種子的小矮人?","o":["噶瑪蘭族","拉阿魯哇族","撒奇拉雅族","卡那卡那富族"],"a":3,"e":"參考資料：原住民族電視台-新聞報導〈米貢祭由來有二說 感謝小矮人贈種子.紀念Usu〉所謂米貢祭，就是要把今年所收成的小米，要擺放出來，所以叫做米貢。傳說有一個很大的坑洞，裡面住了很矮小的人，我們把它稱為Tapucarake，據說小米種子是他們給的，所以當我們要舉行米貢祭的時候，會邀請他們來參加，因為我們的農作食物是他們給的，從那時開始到今天有此祭儀，另外還有一位女生叫 Usu，名叫Usu的這位女生跟著男士們去燒山打獵，當時是以燒山的方式來狩獵的，傳說她是一位孤兒，心想要跟著男士們去學習打獵，因為未來她也會獨自的過活，希望盡早獲得長輩的智慧，因為這是她第一次參加燒山打獵，還不了解這種狩獵的方式，想要去看看到底要怎樣放火，當時她爬到一棵大樹上，他望向四周一看，當時 Usu不知道那棵樹的底下也都燃燒起來了，之後樹的四周全都被火包圍住了，她被火燒到了，最後跟著煙灰升上天了，所以卡那卡那富族，從那時候開始當舉行米貢祭的時候，就會吟唱 cina cuma Usu 請慢走，因為當時 Usu的精神的確令人敬佩，所以當我們舉行米貢祭，是來自這個兩個原因，一個是小矮人給我們農作吃的，第二個是這位受人尊敬的 Usu，他要跟著男士們學習打獵，而犧牲了自己，所以我們在祭典的時候都要提到她，因為這兩個原因，我們舉行米貢祭。","u":"https://www.ipcf.org.tw/-/News/Detail?newsId=23012911210634717"},{"n":55,"c":"A","s":"1943 年，布農族的祈禱小米豐收歌(PAISBUTBUT)是被哪一位日本學者採錄後公布全世界？","o":["黑澤隆朝","森丑之助","佐久間左馬太","馬東淵一"],"a":0,"e":"參考資料：臺北市原住民族教育資源中心網站布農族的 Pasibutbut（祈禱小米豐收歌）文獻參考整理日本學者黑澤隆朝曾於 1943年3月 25日在台東縣鳳山郡里.山社（今台東縣海端鄉崁頂村）採錄到此曲─Pasibutbut（），深受震撼，並於1952 年將此曲的錄音寄至聯合國教科文組織（ UNESCO）所屬之國際民俗音樂協會（IFMC），引起當時知名民族音樂學者如 AndreSchaeffner、Curt Sachs 以及Jaap Kunst 的注目（吳榮順 1988：9~10）。而開啟它聞名於世界音樂界，在翻譯上，名之「初收小米之歌」或「祈禱小米豐收歌」，後來又俗名之為「八部和音」。","u":"https://tpiercenter.tp.edu.tw/pasibutbutliterature"},{"n":56,"c":"G2","s":"桃源區在日治時期劃歸高雄州，戰後陸續設為高雄縣雅爾鄉、雅你鄉，後於西元 1956 年改名為何？","o":["信義鄉","延平鄉","海端鄉","桃源鄉"],"a":3,"e":"參考資料：高雄市桃源區公所網站高雄市桃源區於日據時期隸屬高雄州旗山郡六龜分室，當時桃源地區有雅你部落，布農族人稱之為 Gani，日人遂稱 Gani 社，當時部落的分布主要以雅爾駐在所為中心，散居於荖濃溪沿岸、大竹溪山東支稜，海拔高度約七百至一千七之間山坡上。光復後，鄉內的人口漸漸增加，國民政府於民國三十五年(西元一九四六年)廢區改隸，因本區當時以雅你社(Gani)之部落人丁較旺，遂將本區稱為「雅你鄉」（Gani）。民國四十五年(西元一九五六年)十月政府思其「雅你」二字不雅，認為本鄉山明水秀猶如世外桃源，遂又將本鄉改名為「桃源鄉」。又自民國 99年12 月25日因應高雄縣市合併，本鄉更名為『桃源區』，各村亦更名為『里』。","u":"https://tauyuan.kcg.gov.tw/"},{"n":57,"c":"H2","s":"對日治時期的日本政府來說，「撫番策略」的要旨最接近下列何者？","o":["以國語教育從文化觀改變原住民族傳統價值觀","設番學堂教導番人文化，並提供槍枝","教授番人農耕技術，並適時給予獎勵","提供生活物質的補助，如免費的醫療等"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈界線與徑路：臺灣早期峽谷攝影中的地形、視覺阻隔與原住民潛像〉1871年，漢籍攝影師賴阿芳從淡水港上岸，此時距離 1858年的開港通商已經有十餘年。隨著西方列強對於臺灣山林自然資源的覬覦，以及樟腦在國際經濟市場的需求大增。很多來到臺灣的外商，也私自進入「番界」向附近的漢人高價收購樟腦。而樟腦的利益，也驅使不少漢人暗地裡往山區盜採，加劇了長久以來的原漢族群衝突。另一方面，清帝國面臨西方列強日益積極的態度，亦決定採取「開山撫番」的策略，向外界宣稱帝國版圖的統治合法性。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/599"},{"n":58,"c":"M","s":"賽夏族人認為其祖先傳說來自於何處？","o":["岩石","竹子","洪水","海洋"],"a":2,"e":"參考資料：原住民族委員會網站賽夏族的創生傳說中，認為先人在洪水時期時，倖存的兄妹成婚生下小孩，而後將小孩肉、骨、胃、腸分解後投入海中，各別成為各部落與民族的祖先。賽夏族分布在臺灣西北部，以鵝公髻山為界分屬於新竹縣與苗栗縣兩個行政區。新竹縣境內的賽夏族人，居住在五峰鄉上坪溪流域，部落在五峰鄉大隘村與花園村內。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/8DF9561F4FCC6AF4D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":59,"c":"F","s":"聖貝祭（miatungusu）是農耕祭儀中祭祀貝神而衍生出的祭典，請問貝神是哪一族主要的圖騰象徵?","o":["撒奇萊雅族","噶瑪蘭族","卡那卡那富族","拉阿魯阿族"],"a":3,"e":"參考資料：原住民族委員會網站相傳族人原居地在東方 Hlasʉnga，曾與矮人共同生活；矮人視「聖貝（takiarʉ）」為太祖（貝神）居住之所，每年舉行大祭以求境內平安、農獵豐收、族人興盛。族人離開原居地時，矮人贈以一甕聖貝，族人亦如矮人般舉行「聖貝祭（miatungusu）」。祭儀最重要的部分是「聖貝薦酒」儀式：將聖貝浸在酒裡，察其顏色變化，如果變成紅色則表示太祖酩酊之狀，意味祭典圓滿成功。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DE7E75BDD1F53F90D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":60,"c":"H2","s":"1914 年 5 月 17 日至 8 月 28 日曾發生一起臺灣日治時期的原住民族抗日事件，請問所指為何？","o":["大分事件","太魯閣事件","牡丹社事件","霧社事件"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從太魯閣族對日戰役看傳統價值面對殖民統治〉太魯閣抗日戰役發生於 1914年6月 1日至8月13日，前後歷時74天，1914年6月1 日，太魯閣族開始進入了臺灣史上一段最陰暗、最悲情的歷史隧道中，由總督佐久間左馬太自任司令官，由當時民政長官內田嘉吉擔任總指揮官，警視總長龜山里平太擔任副指揮官，兵分東西兩路攻打太魯閣族人。所謂「東路討伐軍」分為兩隊，一支為「巴托蘭討伐隊」；另一支為「得其黎討伐隊」，動用兵員加上壯丁、軍伕合計 10,841人，由東向西攻打太魯閣族部落。所謂「西路討伐軍」，也分兩隊，一隊由西向東越過能高山，進入木瓜溪，攻向太魯閣大山一帶；另一隊越過合歡山，進入立霧溪流域，動用兵員，加上壯丁、軍伕，合計 9,908 人。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/249"},{"n":61,"c":"H2","s":"布農族人拉馬達·星星及其族人曾發動突襲式抗日行動，請問上述所指涉的是哪一個事件？","o":["大分事件","大關山事件","太魯閣事件","牡丹社事件"],"a":1,"e":"參考資料：臺灣原住民族事典大關山事件（又稱檜谷事件）發生於 1932年（昭和7年）9月19日，是日本時代中葉（1919-1937）一起台東新武呂溪流域布農族人襲擊日警事件，因為接續震驚國際的霧社事件（1930）後發生，曾引起關注。該案發生時期，關山越警備線甫於 1931年（昭和6年）完工，可藉由本線溝通中央山脈東西兩側，沿線設置高密度的警察駐在所與砲台、教育所等據點，事件可視為對於日本治理系統的反擊，事件發生後針對領袖家族實施祕密處決，包括日本政府長期意欲掌握的指標級領袖 Lamata Sinsin，其原根據地遭毀棄。","u":"https://aborgpedia.alcd.center/detail?id=11822&search=&cat=0&race=0&writer="},{"n":62,"c":"H1","s":"下列有關荷蘭東印度公司統治臺灣期間的敘述，何者有誤？","o":["史上第一個系統統治臺灣的政權","大量引入漢人，是臺灣中國化的開始","用羅馬字拼音書寫各族群的文字系統","重商主義，臺灣出現高經濟文化雛型"],"a":3,"e":"參考資料：專欄文章〈荷蘭人來了！荷蘭東印度公司與熱蘭遮市鎮周邊原住民互動〉1624 年荷蘭東印度公司在大員建立起據點，不僅帶來大量的軍隊，更逐漸在臺灣站穩腳步，急需盟友的新港社及中立的蕭壠社，率先與荷蘭人締結友誼。而目加溜灣社與麻豆社，也陸續對荷蘭東印度公司遞出橄欖枝。","u":"https://storystudio.tw/article/gushi/Mattau-war"},{"n":63,"c":"H1","s":"哪一個原住民族感念馬偕牧師對族人的影響，除了改信基督教外，也以偕字做姓氏?","o":["泰雅族","噶瑪蘭族","太魯閣族","撒奇拉雅族"],"a":1,"e":"參考資料：南島史觀-福爾摩沙專欄文章【平埔族群的罕見姓氏】宜蘭五結的階姓 陳、偕通婚各取一邊 身上流有噶瑪蘭族血統 偕姓感念蘭陽平原傳教的馬偕博士〔2007-11-13〕","u":"https://reurl.cc/vEeL9j"},{"n":64,"c":"G2","s":"高雄市茂林區屬山地原住民區，轄區除了萬山里、茂林里之外，請問尚缺哪一里？","o":["里納里","玉里","新福里","多納里"],"a":3,"e":"參考資料：高雄市茂林區公所網站茂林區歷史沿革介紹-民國99年12 月25日，高雄市、高雄縣合併改制為新直轄市，本地因而改為「高雄市茂林區」，失去原本作為鄉所具有的地方自治權和地方自治團體地位。103年12月25日，配合《地方制度法》修正，賦予直轄市山地原住民區地方自治權，茂林區再次改制為具有公法人地位的地方自治團體，與高雄市桃源區、那瑪夏區並列為高雄市轄域內三個原住民區，成為區民可選舉區長與區民代表的市轄區。茂林區現有茂林里、萬山里及多納里三個里。","u":"https://maolin.kcg.gov.tw/Content_List.aspx?n=6E2CAF0EF73AE77D"},{"n":65,"c":"M","s":"排灣族人認為何種動物的眼睛像琉璃珠，將之埋入土裡，不久就會變成美麗的琉璃珠？","o":["蜻蜓","百步蛇","老鷹","百靈鳥"],"a":0,"e":"參考資料：1.國語日報網站〈排灣族的一抹彩虹琉璃珠 象徵身分與地位〉文／張健芳，圖片提供／卡塔文化工作室、張健芳、達志影像 (2021/9/5)排灣神話中，族人收到神諭，抓了好幾簍筐的蜻蜓埋在木臼裡以木灰覆蓋，數天後，從灰中挖出晶瑩多彩的琉璃珠。臺東舊香蘭遺址出土的琉璃珠作坊，距今約一千八百年，臺灣已有五六百度的高溫燒製技術。2.國家文化記憶庫-排灣族琉璃珠","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=320731"},{"n":66,"c":"E","s":"吉拿富Cinavu是排灣族最具代表性的食物，會因主要作物不同而選用不同米食，其米食種類不包括下列何者？","o":["小米","糯米","芋頭粉","肉桂粉"],"a":3,"e":"參考資料：原住民族委員會網站排灣族人慶典或婚嫁時會製作 qavai（小米糕）、cinavu（意思為用葉子包裹食物）等食物。cinavu 常以中文拼寫母語發音為「祈那福」，是以植物假酸漿葉包裹小米（或糯米、芋頭乾粉），並以肉塊為餡，是代表民族食物的其中之一。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/67E3CC5AE2F10A8BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":67,"c":"H2","s":"日治時期針對南北原住民族採取不同的統治策略：「北—隘勇制度，南—安撫教化」的原因為何？","o":["北部原住民武力較強","南原住民較溫順","資源、人力有限，南部尚未開發完全","人力資源有限下，北部較好控制"],"a":2,"e":"參考資料：《當代教育研究》季刊第十三卷第四期 2005年12月日治時期對於原住民的教化及影響","u":"http://contemporary.cere.ntnu.edu.tw/sites/default/files/public/13%284%29_1_%E6%B5%A6%E5%BF%A0%E6%88%90.pdf"},{"n":68,"c":"H1","s":"請問哪一人採懷柔政策，設酒宴誘騙大港口社部落青壯年，待族人無力之際，便以槍枝射殺？","o":["林東涯","楊友旺","沈葆楨","吳光亮"],"a":3,"e":"參考資料：國家文化記憶庫網站吳光亮為開山撫番北中南三路中路的奠基者，同時也是大港口 Cepo&#x27;戰役中清軍的主要指揮者。民間說法提到清光緒元年（1875），總兵吳光亮(1834-1898)率領飛虎軍左營，以兵工開鑿東西山道，抵達璞石閣(今玉里)，駐紮於今協天宮所在地，當時即有人帶關聖帝君之香火前來；光緒七年，後山大疫，吳光亮向關聖帝君祈禱，請求庇佑，獲得保障，於是在營地立一草頂小廟，塑像供奉，並手書「後山保障」匾額，為協天宮建廟之始；今「後山保障」匾額已成鎮宮之寶。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_People&id=485014"},{"n":69,"c":"H1","s":"下列何者並非加禮宛事件中出現的族群？","o":["噶瑪蘭族","撒奇拉雅族","港口阿美族","清朝人"],"a":2,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從「紀念 1878」紀念碑與族裔的戰役歷史詮釋對話〉光緒初，清帝國覬覦臺灣東土揮軍侵略。一八七八年農曆五月初一，撒奇萊雅族與噶瑪蘭族埋石締盟共禦外侮。九九重陽奇萊平野失守，文獻載為「加禮宛事件」。兩族史觀自主，各以「達固部灣戰役」及「加禮宛戰役」謂之。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/443"},{"n":70,"c":"H1","s":"試問，加禮宛事件的爆發起因於哪一政策？","o":["開山撫番","懷柔政策","撫墾署","隘勇線"],"a":2,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從「紀念 1878」紀念碑與族裔的戰役歷史詮釋對話〉光緒初，清帝國覬覦臺灣東土揮軍侵略。一八七八年農曆五月初一，撒奇萊雅族與噶瑪蘭族埋石締盟共禦外侮。九九重陽奇萊平野失守，文獻載為「加禮宛事件」。兩族史觀自主，各以「達固部灣戰役」及「加禮宛戰役」謂之。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/443"},{"n":71,"c":"H2","s":"下列何者並非南庄事件爆發之因素？","o":["日本實施樟腦專賣制度","政府不承認當地原住民族土地所有權","日人不按時繳交山工銀","南庄人擁有土地使用權及所有權"],"a":3,"e":"參考資料：原住民族電視台&amp;原住民族廣播電台新聞〈賽夏.泰雅聚南庄義塚 感念先人紀念抗日事件〉記者 ArasSawawan(陳鵬飛) / puljaljuyan(李耀維) 苗栗南庄1902 年苗栗南庄發生賽夏族人日阿拐，因不滿日本殖民政府侵犯族人製作樟腦，以及土地使用的權利，而集結各個族群發動抗日的南庄事件，至今已有 100 多年。10月18日賽夏族、泰雅族等各族群代表，來到南庄國中的義塚前，紀念當年犧牲的在地居民，也期盼透過這場儀式，讓更多人知道南庄事件。坐落在苗栗縣南庄國中校園內的義塚古墓，紀念著 100多年前，南庄地區發生的抗日事件，而犧牲的烈士英靈。當地居民指出，當時的日本殖民政府，因為樟腦開發的利益，而侵犯到當地賽夏族人土地跟樟腦製作的權益，引發衝突。以賽夏族人日阿拐為首，聯合閩、客、泰雅族及道卡斯族聯合抗日，稱南庄事件。雖然最終以失敗收尾，但守護土地的精神仍讓後輩感念。","u":"https://www.ipcf.org.tw/zh-/News/Detail?newsId=21110711573810826"},{"n":72,"c":"H1","s":"引爆牡丹社事件的因素是下列哪一選項？","o":["琉球人逢海難，誤闖牡丹社人部落","琉球人逢海難，誤闖高士佛社人部落","清朝政府唆使","因日本人覬覦臺灣經濟交通之樞紐"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈牡丹社事件的地圖史料與空間探索（上）〉1871 年11月，琉球宮古島的船隻途遇暴風，漂流到臺灣恆春半島東海岸的八瑤灣（日本記此地有高士佛港，今滿州鄉港子、九棚一帶），54名船員被當地排灣族高士佛社原住民殺害。由於琉球也向薩摩進貢，為中、日雙屬的藩屬國，後來日本入侵臺灣，就以此事為由。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/99"},{"n":73,"c":"G2","s":"國道三號南投服務站有「LAMUNGAN」的標誌，請問它在布農族語中是代表何種意思？","o":["沼澤低漥之地","祖居地","豐收之","幸福快樂之意"],"a":1,"e":"參考資料：1.族語 E樂園-生活會話 Mulumaq minqamisan 回家過年篇2. 原住民族委員會-原住民族文獻網站期刊〈布農族的神話傳說與「歷史」〉就布農族整體的 Linahaiban裡，各式各樣的神話傳說、原居地 Lamungan、mai-asang、Usaviah（玉山）、Qas（巒大山）、Baungzavan（大分）、遷移及被迫移住、氏族來源與分離、與異族的戰爭、領域的拓展、minLipung（日本時代）、……等，都是布農族長者在 Palihabasan 時講述布農族的 Linahaiban經常口述的內容。","u":"https://web.klokah.tw/extension/con_practice/index.php?d=19&l=20&view=dialoguehttps://ihc.cip.gov.tw/EJournal/EJournalCat/329"},{"n":74,"c":"H2","s":"昭和 9 年，里壠支廳為前一年發生的事件受難警察設立紀念碑，請問這是布農族歷史上哪一起事件？","o":["大關山事件","大分事件","逢坂事件","霧鹿事件"],"a":2,"e":"參考資料：臺灣原住民事典網站第一次逢坂事件發生於 1921年（大正 10年）12月17日，為台東新武呂溪流域布農族人針對日本警備道路開闢工程的襲擊事件，造成日警高級人員傷亡。本事件與深入新武呂溪流域內部的新設警備線有關，也與花蓮拉庫拉庫溪流域的托西佑事件（1921）有所牽連，是著名的布農抗日領袖 Lamata Sinsin（拉馬達星星）與日本的直接衝突，雙方的和戰關係延伸至 1932年（昭和7 年）的大關山事件（又稱檜谷事件）後，Lamata Sinsin 遭牽連被祕密處決後方止。","u":"https://aborgpedia.alcd.center/detail?id=11821&search=&cat=0&race=6&writer="},{"n":75,"c":"F","s":"拉阿魯哇族最重要的聖貝祭（miatungusu），原為幾年舉辦一次，但為文化傳承現改為每年舉行？","o":["2 年","3 年","4 年","5 年"],"a":0,"e":"參考資料：原住民族委員會網站相傳族人原居地在東方 Hlasʉnga，曾與矮人共同生活；矮人視「聖貝（takiarʉ）」為太祖（貝神）居住之所，每年舉行大祭以求境內平安、農獵豐收、族人興盛。族人離開原居地時，矮人贈以一甕聖貝，族人亦如矮人般舉行「聖貝祭（miatungusu）」。祭儀最重要的部分是「聖貝薦酒」儀式：將聖貝浸在酒裡，察其顏色變化，如果變成紅色則表示太祖酩酊之狀，意味祭典圓滿成功。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DE7E75BDD1F53F90D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":76,"c":"H1","s":"試問「保民義舉」是在哪一起歷史事件中出現的名詞？","o":["大港口事件","南庄事件","加禮宛事","牡丹社事件"],"a":3,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈牡丹社事件的地圖史料與空間探索（上）〉1871 年11月，琉球宮古島的船隻途遇暴風，漂流到臺灣恆春半島東海岸的八瑤灣（日本記此地有高士佛港，今滿州鄉港子、九棚一帶），54名船員被當地排灣族高士佛社原住民殺害。由於琉球也向薩摩進貢，為中、日雙屬的藩屬國，後來日本入侵臺灣，就以此事為由。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/99"},{"n":77,"c":"M","s":"在臺灣原住民族的傳說中，那一族的祖先是竹子所生？","o":["阿美族","泰雅族","卑南族","邵族"],"a":2,"e":"參考資料：臺灣原住民事典網站南王系統/竹生系統-卑南族的起源傳說在戰後廣被學者採用，並且以現在耳聞能詳的「石生說」和「竹生說」稱之。例如，宋龍生就認為卑南族的部落可以分為兩個系統：1. 石生系統──以「知本社」為主，從中再分出「射馬干社（建和）」、「呂家社（利嘉）」、「大巴六九社」、「北絲鬮社（初鹿）」、「阿里擺社」；2. 竹生系統──以「卑南社（普悠瑪/南王）」為主，另分出「檳榔樹格社（下賓朗）」。有時，這樣的區分也以「知本社群」和「卑南社群」稱之。宋龍生後來提出另一種解讀方式：「石生」或可被解讀為出生於石板屋、「竹生」則是指出生於竹屋的兩個不同的居住建築文化系統。","u":"https://aborgpedia.alcd.center/detail?id=11826&search=&cat=32&race=0&writer="},{"n":78,"c":"H2","s":"南庄事件之後，日本政府體認到綏撫政策的有限性，於是對原住民展開何種更極端的政策？","o":["教育同化","始政鎮壓","皇民化運","理番政策"],"a":3,"e":"參考資料：原住民族電視台&amp;原住民族廣播電台新聞〈賽夏.泰雅聚南庄義塚 感念先人紀念抗日事件〉記者 ArasSawawan(陳鵬飛) / puljaljuyan(李耀維) 苗栗南庄1902 年苗栗南庄發生賽夏族人日阿拐，因不滿日本殖民政府侵犯族人製作樟腦，以及土地使用的權利，而集結各個族群發動抗日的南庄事件，至今已有 100 多年。10月18日賽夏族、泰雅族等各族群代表，來到南庄國中的義塚前，紀念當年犧牲的在地居民，也期盼透過這場儀式，讓更多人知道南庄事件。坐落在苗栗縣南庄國中校園內的義塚古墓，紀念著 100多年前，南庄地區發生的抗日事件，而犧牲的烈士英靈。當地居民指出，當時的日本殖民政府，因為樟腦開發的利益，而侵犯到當地賽夏族人土地跟樟腦製作的權益，引發衝突。以賽夏族人日阿拐為首，聯合閩、客、泰雅族及道卡斯族聯合抗日，稱南庄事件。雖然最終以失敗收尾，但守護土地的精神仍讓後輩感念。","u":"https://www.ipcf.org.tw/zh-/News/Detail?newsId=21110711573810826"},{"n":79,"c":"M","s":"排灣族對於始祖的傳說很複雜，下列選項何者不屬於排灣族的始祖創生傳說來源的說法？","o":["太陽卵生說","蛇生說","壺生說","竹生說"],"a":3,"e":"參考資料：臺灣原住民事典網站南王系統/竹生系統-卑南族的起源傳說在戰後廣被學者採用，並且以現在耳聞能詳的「石生說」和「竹生說」稱之。例如，宋龍生就認為卑南族的部落可以分為兩個系統：1. 石生系統──以「知本社」為主，從中再分出「射馬干社（建和）」、「呂家社（利嘉）」、「大巴六九社」、「北絲鬮社（初鹿）」、「阿里擺社」；2. 竹生系統──以「卑南社（普悠瑪/南王）」為主，另分出「檳榔樹格社（下賓朗）」。有時，這樣的區分也以「知本社群」和「卑南社群」稱之。宋龍生後來提出另一種解讀方式：「石生」或可被解讀為出生於石板屋、「竹生」則是指出生於竹屋的兩個不同的居住建築文化系統。","u":"https://aborgpedia.alcd.center/detail?id=11826&search=&cat=32&race=0&writer="},{"n":80,"c":"M","s":"有關布農族對於 Dihanin 的解釋，下列選項何者為非？","o":["天神","天氣","天","空氣"],"a":3,"e":"參考資料：全國宗教資訊網布農族世界觀的基本結構可以說是，經由 dihanin呈現天和人、天和自然物之間的垂直關係，hanito 呈現人和人、人和自然物之間的平行關係。","u":"https://religion.moi.gov.tw/Knowledge/Content?ci=2&cid=46"},{"n":81,"c":"M","s":"請問布農族文化信仰的組成，下列選項何者為非？","o":["天／Dihanin","人／Bunun","精靈／Hanitu","禁忌／Samu"],"a":1,"e":"參考資料：全國宗教資訊網布農族世界觀的基本結構可以說是，經由 dihanin呈現天和人、天和自然物之間的垂直關係，hanito 呈現人和人、人和自然物之間的平行關係。","u":"https://religion.moi.gov.tw/Knowledge/Content?ci=2&cid=46"},{"n":82,"c":"M","s":"「起初世界上只有兩個太陽，沒有晝夜之分，後來族人射下一個太陽，才有了陰晴圓缺的月亮。」上述月亮傳說來自哪一原住民族？","o":["布農族","邵族","鄒族","阿美族"],"a":0,"e":"參考資料：布農族的射日神話太古時，天上有兩個太陽，所以晝夜不分，酷熱難耐。有一天，一位母親在田裡工作，將嬰兒放在草堆上，結果被太陽曬死了；母親非常傷心，丈夫知道了很生氣，便吩咐大兒子去射太陽，大兒子準備了一些粟就上路了。到達海邊時，預備要射太陽，可是太陽每次都不在他預測的方向升起，這樣過了好幾天，太陽終於從他預測的方向升起，他一箭就射中太陽的眼睛。這個受傷的太陽，正是今天的月亮。現在我們每個月都祭拜月亮，就是要安慰它，以免它再度發出火熱。那位射日的勇士，剛離家時還是個孩子，回家時，已經是白髮蒼蒼的老翁。故事來源：尹建中《臺灣山胞各族傳統神話故事與傳說文獻編篆研究》，頁 120-121。","u":""},{"n":83,"c":"M","s":"布農族的聖山指的是臺灣哪一座山？","o":["玉山","大霸尖山","南湖大山","秀姑巒山"],"a":0,"e":"參考資料：原住民族電視台&amp;原住民族廣播電台新聞〈登上布農聖山 感受祖先曾經走過的路〉位於南投縣信義鄉，高雄縣桃源鄉及嘉義縣阿里山鄉之交界處的玉山主峰，是台灣第一高峰。玉山鄒族人則稱其為八通關，而我們布農族人稱之為 Taungkulsalvi，是布農族的聖山。","u":"https://www.ipcf.org.tw/-/News/Detail?newsId=22091520472463232"},{"n":84,"c":"M","s":"布農族人認為某植物具有驅邪避凶的功能，會將它塗抹於嬰兒頭上，請問該植物所指為何？","o":["艾草","花環","南百合花","菖蒲"],"a":3,"e":"參考資料：國家文化記憶庫網在布農族的文化中，石菖蒲項鍊可除穢驅魔，特別是出遠門時常配戴以避邪，亦是進行嬰兒祭時的重要物件。其製作方法是將 ngaan 石菖蒲的地下莖部較老的部分挖出後，先洗淨削皮，置於平坦處用手按搓使其光滑，再切成一小節一小節，鑽洞與曬乾，串製成項鍊。幫人治病或是驅除厄運的巫師也會配帶 ngaan，往往在療程進行完之後，將ngaan 以口咬碎並噴在患者身上，藉以驅除不好的 hanitu(靈)。此項鍊由台東縣延平鄉布農族霍松安家族胡榮茂先生於鹿鳴山區採集石菖蒲後製作。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=314849"},{"n":85,"c":"A","s":"「拍手歌」是由兩位原住民王拓南和伍欽光所創作。請問他們是屬於哪一族？","o":["布農族","卑南族","泰雅族","賽夏族"],"a":0,"e":"參考資料：2025-05-29 基督教論壇報 / 新聞時事〈原聲童聲合唱團唱進梵蒂岡 布農詩歌感動教宗良十四世〉〈拍手歌〉為一首布農族的合唱曲目，布農族語為 Kipahpahima，kipahpah 的意思是「拍打」，ima的意思是「數字五」。拍打五指時雙掌互拍。歌曲創作的緣由，是布農族族人王拓南和伍欽光，發現沒有一首布農詩歌可歡迎大家信仰耶穌基督，於是用吉他和弦創作出布農族語的詩歌〈拍手歌〉，歡迎來教堂同享福音的人。","u":"https://ct.org.tw/html/news/3-3.php?cat=10&article=1401575&fontsize="},{"n":86,"c":"C","s":"請問布農族陀螺（huvias）是由下列哪種植物製作而成？","o":["青剛櫟","樟樹","臺灣櫸木","榕樹"],"a":0,"e":"參考資料：國家文化記憶庫網布農人與殼斗科植物之間有著濃厚的情感。殼斗科的果實養活了各種動物，像是黑熊、猴子、松鼠、山豬、鳥類、飛鼠等等，對布農人而言就象徵著富饒的獵物。而青剛櫟的木頭除了相當耐燒，是很好的薪柴之外，早期還會拿來燒炭賣給日本人，也非常適合拿來製作工具，比如說刀柄、鋤把、陷阱支架、槍托等等。青剛櫟的果實則稱為huvia，是陀螺的意思，可做小孩的玩具。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=314891"},{"n":87,"c":"C","s":"電影「海角七號」裡的琉璃珠，是哪一個原住民族改良傳統所發展出的手工藝品?","o":["布農族","泰雅族","排灣族","卑南族"],"a":2,"e":"參考資料：1.國語日報網站〈排灣族的一抹彩虹琉璃珠 象徵身分與地位〉文／張健芳，圖片提供／卡塔文化工作室、張健芳、達志影像 (2021/9/5)排灣神話中，族人收到神諭，抓了好幾簍筐的蜻蜓埋在木臼裡以木灰覆蓋，數天後，從灰中挖出晶瑩多彩的琉璃珠。臺東舊香蘭遺址出土的琉璃珠作坊，距今約一千八百年，臺灣已有五六百度的高溫燒製技術。2.國家文化記憶庫-排灣族琉璃珠","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=320731"},{"n":88,"c":"C","s":"居住在高山地區的原住民族常用竹子、樹木、茅草為主要建築材料搭建家屋，請問會是什麼原因？","o":["就地取材的緣故","原住民族最愛的顏色是綠色","建築材料價格便宜","怕觸犯禁忌"],"a":0,"e":"參考資料：【島嶼說書人】圖解台灣建築史系列——來去部落住一晚（卷一）居住在高山地區的臺灣原住民族（如賽夏族、鄒族、泰雅族等），因適應高山環境、氣候濕冷且盛產相關建材，普遍使用竹子、樹木、茅草搭建傳統家屋。這些家屋結構通常以木材為柱、竹材為牆、茅草覆頂，並設有中心火塘以取暖炊煮。","u":"https://vocus.cc/article/5a1219dceceaed97b4026654"},{"n":89,"c":"S","s":"下列有關布農族報戰功（malastapang）文化的敘述，何者有誤？","o":["大部分只有男性才能報戰功","指男性在親族前大聲呼喊自己的事蹟","總在誇耀描述自己的不實的豐功偉業","舉辦時通常由男性蹲坐在一圈"],"a":2,"e":"參考資料：原住民族委員會網站〈報戰功〉，男子大聲呼喊著自己的英勇事蹟，展現能力 布農族人在一般宴會時，會將打仗回來時的 malastapang（報戰功／頌功宴）用來作為互相認識、交流的工具，亦兼具個人社會地位的象徵。報戰功又稱頌功宴，是布農族男子公開展現自已能力的場合，也給這內斂含蓄的民族一個表現的出口，過去只有參與戰爭或去獵頭者才有資格報戰功，時空變遷，目前改以獵物和社會頭銜取代報戰功。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F39C8394699DD2D6D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":90,"c":"H2","s":"1915 年 5 月 17 日由布農族在花蓮港廳玉里郡大分駐在所發動某事件，指的是哪一個事件？","o":["大分事件","霧社事件","牡丹社事件","南庄事件"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈追查百年前的大分事件〉1915 年5月，台灣東部深邃美麗的拉庫拉庫溪南岸，爆發了嚴重的抗日事件，5月12日，屬於巒社群的喀西帕南社，聯合其他部落，一舉襲殺駐在所 10名日警。受到鼓舞，5天之後，郡社群大分社，在總頭目阿里曼西肯的率領下，趁著清晨日警用餐時，殲滅了 12名日警。隨後，他們繼續攻擊拉庫拉庫溪北岸太魯那斯、阿桑來戛駐在所，令日警倉皇撤出拉庫拉庫溪流域，長達 4年都不敢進入布農人控制的區域。1919 年起，日人開闢「八通關越警備道路」，試圖「像一把利劍一樣深入反抗蕃的心臟」。開路期間，日警持續受到攻擊，沿途死傷累累，而布農人輾轉遷移到玉山南側，荖濃溪上游的河谷，建立了塔馬荷（玉穗）部落群，繼續抗日行動，給日警帶來隨時有殺身之禍，風聲鶴唳、草木皆兵的壓力。直到 1933年，在台灣總督府命令下，日警才放軟身段，委曲求全，於4月 22日雙方達成和解。這一段長達 18年的抗日過程，歷史統稱為「大分事件」","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/252"},{"n":91,"c":"R","s":"太魯閣族人集結起來，表達國家公園對獵人觸法的不滿。請問他們最有可能表達的權利訴求為何？","o":["還我自治權","還我狩獵權","教育自主權","還我身分自主權"],"a":1,"e":"參考資料：公視新聞網新聞〈太魯閣國家公園禁狩獵 原民抗議〉花蓮秀林鄉的太魯閣族，2015 年10月15日要舉行一年一度的傳統祭點活動，因為有幾個部落，就位在太魯閣國家公園內，國家公園法有限制狩(拍)獵，昨天，上百名部落民眾，包圍國家公園管理處表達抗議。 為了表達對太管處不讓部落在國家公園內舉行傳統狩獵祭的不滿，近五百多位的太魯閣族民眾，大家頭綁布條、手持抗議標語，以步行方式，浩浩蕩蕩的前往管理處辦公室外，要處長出來給大家一個交代。","u":"https://news.pts.org.tw/article/307576"},{"n":92,"c":"M","s":"布農族巫師辦理巫師祭時，會透過手上的什麼植物為部落與眾人進行祈福？","o":["芒草","橘子","蘆葦","樹藤"],"a":0,"e":"參考資料：1.原視新聞網-新聞〈布農族巫師特展登場 霧鹿部落巫師現場祈福〉https://news.ipcf.org.tw/1431162. 臺東縣延平鄉公所網站-延平鄉布農文化知識保存庫巫師會進到你的夢境來揀選你，不管多久都跑不掉，巫師不能誇耀，在延平會植入六種法力：白芒草、繩子、木灰、石菖蒲、刀子、八丈芒。習巫要 12年，每年有兩次巫師祭，一次在收小米六月份收穫祭(植入靈力)，第二次在八月份進倉的巫師祭。每一年會將靈力植物植入一次你的右手，植入時會帶給身體一種情緒，所以脾氣變得很暴躁的時候，要主動跟你的師傅，告訴他說我的身體產生這樣的狀況，基本上過程要很清楚而且嚴謹，必須誠實地面對你的身體，因為會讓你的心靈跟靈魂產生改變，如果你第一年就順利植入，一兩個月內有發生這樣的狀況，就可以請師傅把它抽掉。如果你開始習巫，前三年都是要學母語的咒語，咒語有分加注靈力、召喚、治病等等。然後右手在植入 6種法力後，不能打人，會打死人，需要一直守著。巫師祭時就會一起唱靈歌，不同的面向的靈歌都會唱，每個區會都有不同的靈歌，透過靈歌增加巫師能量，所以不管有多遠每個巫師都會過去，他們都會手拉著芒草，所有人的靈力都是交流靈力。","u":"https://www.ttypg.gov.tw/yanping_talent/talent/19.html"},{"n":93,"c":"M","s":"承襲布農族巫師角色的方式，下列描述何者錯誤？","o":["世襲制","師徒制","透過夢中指示，事後去找巫師學習","只要有心，想學就學"],"a":3,"e":"參考資料：1.原視新聞網-新聞〈布農族巫師特展登場 霧鹿部落巫師現場祈福〉https://news.ipcf.org.tw/1431162. 臺東縣延平鄉公所網站-延平鄉布農文化知識保存庫巫師會進到你的夢境來揀選你，不管多久都跑不掉，巫師不能誇耀，在延平會植入六種法力：白芒草、繩子、木灰、石菖蒲、刀子、八丈芒。習巫要 12年，每年有兩次巫師祭，一次在收小米六月份收穫祭(植入靈力)，第二次在八月份進倉的巫師祭。每一年會將靈力植物植入一次你的右手，植入時會帶給身體一種情緒，所以脾氣變得很暴躁的時候，要主動跟你的師傅，告訴他說我的身體產生這樣的狀況，基本上過程要很清楚而且嚴謹，必須誠實地面對你的身體，因為會讓你的心靈跟靈魂產生改變，如果你第一年就順利植入，一兩個月內有發生這樣的狀況，就可以請師傅把它抽掉。如果你開始習巫，前三年都是要學母語的咒語，咒語有分加注靈力、召喚、治病等等。然後右手在植入 6種法力後，不能打人，會打死人，需要一直守著。巫師祭時就會一起唱靈歌，不同的面向的靈歌都會唱，每個區會都有不同的靈歌，透過靈歌增加巫師能量，所以不管有多遠每個巫師都會過去，他們都會手拉著芒草，所有人的靈力都是交流靈力。","u":"https://www.ttypg.gov.tw/yanping_talent/talent/19.html"},{"n":94,"c":"G1","s":"擁有中央山脈統治者與玉山山脈守護者美稱的是哪一個族群？","o":["布農族","泰雅族","魯凱族","排灣族"],"a":0,"e":"參考資料：原住民族電視台&amp;原住民族廣播電台新聞〈登上布農聖山 感受祖先曾經走過的路〉位於南投縣信義鄉，高雄縣桃源鄉及嘉義縣阿里山鄉之交界處的玉山主峰，是台灣第一高峰。玉山鄒族人則稱其為八通關，而我們布農族人稱之為 Taungkulsalvi，是布農族的聖山。","u":"https://www.ipcf.org.tw/-/News/Detail?newsId=22091520472463232"},{"n":95,"c":"A","s":"請問黑澤隆潮收錄哪一地區的祈禱小米豐收歌(PAISBUTBUT)，而使布農族名聲響譽國際？","o":["台東海端","花蓮馬遠","高雄納馬夏","南投雙龍"],"a":0,"e":"參考資料：臺北市原住民族教育資源中心網站傳統上 Pasibutbut（祈禱小米豐收歌）是僅流傳於布農族 Isbukun（郡）群內的一首祭儀歌謠。1930年代以後在日本治台時期的集團移住政策下，絕大多數的布農族部落被移住，在新移住村落開始大量出現不同部族群（尤其郡群與巒群間）混居的現象。在這樣的歷史背景與其族群分佈下，Pasibutbut歌謠開始流傳至 Isbukun群以外的Takbanuaz（巒）群。","u":"https://tpiercenter.tp.edu.tw/pasibutbutliterature"},{"n":96,"c":"H2","s":"下列選項中未出現在大分事件的人物是誰？","o":["拉荷·阿雷","莫那魯道","阿里曼·西肯(","華利斯"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈追查百年前的大分事件〉1915 年5月，台灣東部深邃美麗的拉庫拉庫溪南岸，爆發了嚴重的抗日事件，5月12日，屬於巒社群的喀西帕南社，聯合其他部落，一舉襲殺駐在所 10名日警。受到鼓舞，5天之後，郡社群大分社，在總頭目阿里曼西肯的率領下，趁著清晨日警用餐時，殲滅了 12名日警。隨後，他們繼續攻擊拉庫拉庫溪北岸太魯那斯、阿桑來戛駐在所，令日警倉皇撤出拉庫拉庫溪流域，長達 4年都不敢進入布農人控制的區域。1919 年起，日人開闢「八通關越警備道路」，試圖「像一把利劍一樣深入反抗蕃的心臟」。開路期間，日警持續受到攻擊，沿途死傷累累，而布農人輾轉遷移到玉山南側，荖濃溪上游的河谷，建立了塔馬荷（玉穗）部落群，繼續抗日行動，給日警帶來隨時有殺身之禍，風聲鶴唳、草木皆兵的壓力。直到 1933年，在台灣總督府命令下，日警才放軟身段，委曲求全，於4月 22日雙方達成和解。這一段長達 18年的抗日過程，歷史統稱為「大分事件」","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/252"},{"n":97,"c":"H2","s":"八通關越道路古道黃麻一號吊橋 1KM前，佇立殉職者之碑，見證布農族與日本的哪一次衝突事件？","o":["喀西帕南事件","大分事件","大關山事件","逢坂事件"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈喀西帕南事件〉喀西帕南位於拉庫拉庫溪流域，這裡的部落主要是以巒社 Naqaisulan 氏族為主，族人都已遷居到花蓮縣和臺東縣的現居部落，現今只留下幾處石板屋的殘跡，而位於黃麻一號吊橋前約 1公里處，立著一處高約 2.4公尺的方尖碑，即「喀西帕南事件紀念碑」，見證八通關越道路興建之前，布農族與日本的衝突事件。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/243"},{"n":98,"c":"S","s":"「魯凱族族花」具有表彰聖潔、膽識、勇氣與尊榮的意義，以下哪一種花是「魯凱族族花」？","o":["玫瑰花","牡丹花","百合花","金針花"],"a":2,"e":"參考資料：原住民族委員會網站魯凱族社會的特色為任務分工縝密的階級制度，融入婚姻、政治、宗教、祭祀與藝術各領域。以百合花為「魯凱族族花」，文化核心價值以百合花的配飾權最富特色，具有表彰聖潔、膽識、勇氣與尊榮的意義，經濟生活以小米種植為主體，小米收穫祭為最重要的祭典。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/409F703B4E592A82D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":99,"c":"M","s":"請問臺灣原住民族被稱為是「雲豹的故鄉」的族群是哪一族？","o":["太魯閣族","泰雅族","阿美族","魯凱族"],"a":3,"e":"參考資料：公視紀錄片-我們的島《追尋雲豹的腳蹤》對於魯凱族來說，雲豹更是族群精神的表徵。屏東霧台鄉舊好茶部落（魯凱語稱為「古茶布安」）又被稱為「雲豹的故鄉」。據說在很久很久以前，魯凱族的祖先跟隨著雲豹的腳步，從遙遠的東海岸翻山越嶺，沿著太麻里溪而上，來到大武山的西側定居，這一群人被稱為雲豹的子民。","u":"https://ourisland.pts.org.tw/content/1576"},{"n":100,"c":"F","s":"卡那卡那富族每年會舉辦哪一個祭典，感恩溪流對族人的養育，並祈求來年依然有豐富的漁獲?","o":["射耳祭","河祭","矮靈祭","祖靈祭"],"a":1,"e":"參考資料：原住民族委員會網站傳統祭儀傳統祭儀分三大類，最主要的是與小米種植有關的祭儀，其次是獵祭與敵首祭，另外還有以家或家族為單位的河祭與嬰兒祭。這些祭儀因政府的干涉及改信基督教的因素，幾乎不再舉辦，直至三十年前才恢復米貢祭（mikongu）及河祭（pasiakarai）儀式，現為卡族人每年必辦的祭儀活動。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/91A2A514F76BAEACD0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":101,"c":"S","s":"台灣原住民族中，唯一未曾有獵首習慣的原住民族是哪一族？","o":["鄒族","邵族","雅美族","布農族"],"a":2,"e":"參考資料：原住民族委員會網站雅美族分布於臺東縣的蘭嶼島上，有豐富的神話傳說與歲時祭儀，並具有明顯的海洋特質。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/5839F78F6C869EE4D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":102,"c":"G1","s":"根據原住民族委員會 2022 年原住民人口數統計資料顯示，目前臺灣原住民人口數最少的是哪一族？","o":["卡那卡那富族","阿美族","泰雅族","排灣族"],"a":0,"e":"參考資料：原住民族委員會網站-原住民人口數統計資料(每月一次)","u":"https://www.cip.gov.tw/zh-tw/news/data-list/940F9579765AC6A0/index.html?cumid=940F9579765AC6A0"},{"n":103,"c":"A","s":"原聲童聲合唱團隸屬台灣原聲教育協會，其創辦的重要靈魂推手馬彼得校長為哪一族原住民？","o":["排灣族","布農族","魯凱族","阿美族"],"a":1,"e":"參考資料：社團法人台灣原聲教育協會網","u":"https://voxnativa.org/"},{"n":104,"c":"E","s":"蘭嶼達悟族人會將哪一種食物綁在屋簷底下曬乾，來延其長保存期限？","o":["飛魚","山羌","山豬","蜥蜴"],"a":0,"e":"參考資料：原住民族委員會網站雅美族分布於臺東縣的蘭嶼島上，有豐富的神話傳說與歲時祭儀，並具有明顯的海洋特質。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/5839F78F6C869EE4D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":105,"c":"M","s":"請問大霸尖山是下列哪一個原住民族的聖山？","o":["魯凱族","泰雅族","排灣族","阿美族"],"a":1,"e":"參考資料：國家文化記憶庫網大霸尖山，泰雅族之語譯為 papakwaq’，海拔 3492公尺，橫跨於新竹縣尖石鄉與苗栗縣泰安鄉之間，被譽為「世紀奇峰」。根據泰安鄉的泰雅族傳說，突起的大霸奇岩裂成兩半，而成為現今的大霸尖山與小霸尖山，在兩座山之間，誕生了一男一女，經過長年的日月精華滋潤後，兩人結為夫妻，並繁衍後代，而其子孫即泰雅族人。因此，大霸尖山一直以來都被認為是泰雅祖山，也被稱為泰雅聖山，為泰雅族的信仰象徵，對苗栗泰雅族原住民的意義重大。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Place&id=242583"},{"n":106,"c":"C","s":"居住在高山地區的太魯閣族，較多選擇以竹子及樹木等為建材搭建家屋，主要是出於何種原因?","o":["建材價格便宜","綠色是原住民最喜愛的顏色","因為好看","就地取材、因地制宜"],"a":3,"e":"參考資料：【島嶼說書人】圖解台灣建築史系列——來去部落住一晚（卷一）積木壁建築——戰鬥民族的避寒妙方泰雅族、太魯閣族、賽德克和賽夏族居住在海拔 1000公尺到1500公尺海拔的山區，此區的氣後濕冷，盛產竹木，原住民多用竹子、木頭、茅草三種建材蓋屋，而有些住比較高的泰雅族和賽德克族也會加上石板，但目的是為了防禦外敵。","u":"https://vocus.cc/article/5a1219dceceaed97b4026654"},{"n":107,"c":"E","s":"臺灣原住民族中，有一個族群常自稱是「吃草的民族」。請問指的是上述哪一個臺灣原住民族？","o":["卑南族","阿美族","撒奇萊雅族","達悟族"],"a":1,"e":"參考資料：原住民族委員會網阿美族因為植物採集知識的豐富，而善於將野菜應用於飲食中，因此又被戲稱為吃草的民族，部落中常見的野菜與植物有檳榔（’icep）、毛柿（kamaya/kafohongay）、麵包樹（apalo/facidol）等。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":108,"c":"G1","s":"臺鐵「普悠瑪」列車的命名，是源自於臺灣哪一原住民族族的語言？","o":["布農族","阿美族","卑南族","排灣族"],"a":2,"e":"參考資料：哈瑪星臺灣鐵道館網站因應東部幹線逐步電氣化，台鐵自 2012年起自日本引進的第二代傾斜式電聯車，跟 1000 型一樣是兩組八輛為一列，並收取自強號票價。在命名徵選中由代表台東「普悠瑪號」奪標，也與它現行的行駛區域相呼應。「普悠瑪號」的命名，源自卑南語，原指卑南族部落大首領所在地，亦有集合團結的意思，是臺鐵繼「太魯閣號」再度向民間票選徵求而來。TEMU2000型電聯車款則是台鐵由日本所引進的第二款傾斜式列車，其設計可讓它在彎道上以較快的速度行駛，在多彎的宜蘭線可大幅縮短行駛時間，目前行駛路線遍及縱貫線、台東線、屏東線、北迴線等。2219&amp;EXEC=D&amp;AP=$2301_HISTORY-0","u":"https://hamasen.khm.gov.tw/eng/home03.aspx?ID=$2301&IDK=2&DATA="},{"n":109,"c":"H2","s":"1930 年霧社事件，主要的領袖人物是誰？","o":["卓杞篤","馬亨亨","哈鹿閣納威","莫那魯道"],"a":3,"e":"參考資料：國家文化記憶庫網日治昭和 5年(1930)10 月27日，霧社馬赫坡社頭目莫那魯道率領六部落原住民勇士發起霧社抗日事件，當時的戰場遍布抗日六部落、霧社街區及霧社山區，並分四條路徑挺進，其中的馬赫坡戰線，日軍於同年(1930)11月1日對馬赫坡社進行正面攻略，在安達大隊長的率領下，於 11月5日晨間採取行動，在馬赫坡社東方「西茲西庫」的連綿山脊，海拔約 1,300公尺的高地，構築數處掩堡，並於同日下午佔領可俯視抗日族人的據點馬赫坡岩窟方面的突角點－一文字高地(賽德克語：Butuc)。","u":"https://tcmb.culture.tw/zh-tw/subject/298"},{"n":110,"c":"M","s":"請問負責跟族人傳達天神的旨意希利克鳥是哪一族群的神話傳說？","o":["泰雅族","阿美族","卑南族","魯凱族"],"a":0,"e":"參考資料：原住民族委員會網泰族族、排灣族、布農族之原住民，常會以這種鳥類的叫聲次數及發音位置，作為判定當時吉凶的預兆，稱作「鳥卜」。泰雅族稱這種鳥鳴聲為「希利克」，「希利克」這個名稱源自於一個古老傳說。","u":"https://www.cip.gov.tw/kids/zh-tw/menu/data-list/FF8E0A73EBC8DFA2603CDE95E031DBCF-info.html?cumid=FF8E0A73EBC8DFA2603CDE95E031DBCF"},{"n":111,"c":"F","s":"請問向戰神亞伐霏歐庇佑勇士祈禱的「戰祭」是臺灣原住民族中哪一族的重要祭典？","o":["邵族","鄒族","卑南族","賽德克族"],"a":1,"e":"參考資料：臺灣原住民族文化知識網站凱旋祭（mayasvi，又稱為戰祭、團結祭）凱旋祭是鄒族的部落祭典，特富野社於每年春季的 1∼ 3月間舉行，達邦社則於秋季的 8∼10月間辦理。凱旋祭是祭拜天神跟軍（戰）神、司命神、被獵人頭之靈的祭典，目的在於紀念過去的戰爭，也祈禱未來征戰勝利，並拔除厄運與疾病。戰祭由各家族代表聚集於會所內，完成迎接天神與祭祀各神明後，繞行各家族世系群的禁忌之屋。鄒族人相信舉行戰祭時，天神與戰神會藉會所旁的赤榕樹降臨，因此參與祭典的成員會在樹前圍成一圈，吟唱迎神曲。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=32A1F2ECB75E4A8A&sms=16637BF3724C6215&s=D647F632D4C9FAD4"},{"n":112,"c":"G2","s":"請問以下哪一個縣市，屬於排灣族主要的分布居住地之一？","o":["台北市","宜蘭縣","屏東縣","花蓮縣"],"a":2,"e":"參考資料：原住民族委員會網排灣族（Paiwan）的分布，北以大武山、南到恆春半島、西到枋寮、東到太麻里及臺東市新園里的範圍，屬於中央山脈南段大武山兩側，包含屏東、臺東兩縣為範圍。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/67E3CC5AE2F10A8BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":113,"c":"E","s":"臺灣原住民長者常說一句話：「蛙鳴降雨」。請問「蛙鳴降雨」的意思是指什麼？","o":["颱風天到了","不好的預兆","天氣很晴朗","快要下雨了"],"a":3,"e":"參考資料：「蛙鳴降雨」在臺灣原住民及傳統文化中象徵著自然感應與祈雨信仰。例如屏東加蚋埔馬卡道族祈雨祭會放生青蛙，利用其鳴叫聚集濕氣，感應大地降雨。泰雅族諺語「mqwas qpatung, pqwlax balay」亦明確指出「蛙鳴則雨降」。青蛙常在雨後鳴叫，被視為天氣預報員。","u":"https://news.ltn.com.tw/news/local/paper/943874?fbclid=IwAR0d6nOlXTHjL3_kZqwJBjjhHY5qGkU4pVry1gbZWTi-JNfuwm2QxK3WiZc"},{"n":114,"c":"E","s":"臺灣原住民長者常說一句話：「鷹啼天晴」。這句話是指聽到老鷹啼叫時，天氣會有何變化？","o":["天氣放晴","颱風天到了","氣候變冷","快要下雨了"],"a":0,"e":"參考資料：郡群布農語第 9階教材(P.44)「鷹啼天晴」是臺灣原住民（特別是布農族等山區原住民族）長者流傳的諺語，意指聽到老鷹（通常為猛禽）在天空中高聲啼叫時，預示著陰雨天氣即將結束，天氣即將放晴。這體現了原住民長期觀察自然生態，並將鳥類行為作為判斷天氣變化的狩獵與生活智慧。","u":"https://klokah-file.com/001/nine_9/22_nine_9_book.pdf"},{"n":115,"c":"S","s":"母系社會是指女性在家族中具有比男性較為優勢的地位。下列哪一個族群屬於母系社會？","o":["卡那卡那富族","卑南族","泰雅族","達悟族"],"a":1,"e":"參考資料：臺灣原住民族文化知識網站卑南族的政治領袖、祭司與巫師，在不同領域扮演專業角色，以維繫部落的政治、儀禮與疾病醫療等生活照護需求。卑南族男性社會關係表現在年齡階級與會所制度；婚姻家庭以母系大家族制為原則，重視母系家系傳承的本家、宗家觀念。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=5C6D65F83BD80BCF&sms=1D81A96ECBE66C8E&s=972C09538A8C0B52"},{"n":116,"c":"G1","s":"有一個原住民族群最早先落腳於蘭陽平原，後來又遷居到花蓮臺東海岸，請問是哪個族群？","o":["噶瑪蘭族","凱達格蘭族","拉阿魯哇族","卡那卡那富族"],"a":0,"e":"參考資料：原住民族委員會網傳說噶瑪蘭族人最早由南方島嶼，途經地名為 Sanasai 的地方後遷入臺灣，落腳於蘭陽平原，十九世紀初開始遷居到花蓮臺東海岸。噶瑪蘭族原來在蘭陽平原共有 30 多個部落，十八世紀末漢人開始進入蘭陽平原。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/7088C08FB51F3383D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":117,"c":"S","s":"下列哪一族沒有紋面文化？","o":["阿美族","泰雅族","賽德克","太魯閣族"],"a":0,"e":"參考資料：1.雪霸國家公園管理處保育研究報告〈泰雅族紋面耆老口述歷史及影像紀錄成果報告〉泰雅族獵頭習俗與紋面息息相關，日本在 1895年殖民台灣後，鑑於台灣原住民居住的山地地區林產資源豐富，但因原住民族持續反抗而無法利用，日本殖民者在二十世紀初期，決定進行全面的理蕃計畫，透過武力征討屈服原住民。1913年，日本殖民政府明文禁止泰雅族人紋面，正式滅絕了這項歷史悠久的原住民紋面文化(戚嘉林：1920)。2.專欄文章〈消失中的黥面文化……〉文‧陳淑美/圖‧邱瑞金","u":"https://ws.moi.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvT2xkRmlsZV9TUE5QL1Jlc3VsdFJlcG9ydC85ODIw5rOw6ZuF5peP57SL6Z2i6ICG6ICB5Y%2Bj6L%2Bw5q235Y%2By5Y%2BK5b2x5YOP57SA6YyEX00ucGRm&n=OTgyMOazsOmbheaXj%2Be0i%2BmdouiAhuiAgeWPo%2Bi%2FsOatt%2BWPsuWPiuW9seWDj%2Be0gOmMhF9NLnBkZg%3D%3D&icon=.pdfhttps://www.taiwan-panorama.com/Articles/Details?Guid=34e1de9f-cb1b-44ec-9f6c-21fd5821a9eb&CatId=11&postname=%E6%B6%88%E5%A4%B1%E4%B8%AD%E7%9A%84%E9%BB%A5%E9%9D%A2%E6%96%87%E5%8C%96%E2%80%A6%E2%80%A6&srsltid=AfmBOorxiUGe9H5J6pKpLndHd5GXrudtprQspFmiWjm9OBK0-OVAG7g1"},{"n":118,"c":"C","s":"排灣族會以哪樣東西做為傳家之寶？","o":["竹籃","水晶","琉璃珠","綠祖母"],"a":2,"e":"參考資料：原住民族委員會網排灣族人的物質工藝文化，除了俗稱「排灣族三寶」的古陶壺、琉璃珠與青銅刀，還有男子的雕刻藝術與女子的織布技藝。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/67E3CC5AE2F10A8BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":119,"c":"S","s":"哪一個原住民族分領袖、貴族、巫師與祭司、士族、庶民五個階級，其所享有的權利也不同?","o":["布農族","泰雅族","排灣族","魯凱族"],"a":2,"e":"參考資料：臺灣原住民族文化知識網-排灣族社會制度排灣族（Paiwan）擁有嚴格的世襲階級制度，以長嗣繼承制為基礎，將社會分為頭目（mamazangilan）、貴族、士族（中階貴族）及平民。階級決定了土地擁有權、紋身圖騰（人頭、百步蛇紋）、服飾樣式、裝飾特權（熊鷹羽毛、琉璃珠）及家屋結構，頭目掌握行政與祭祀權，平民納貢。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=5C6D65F83BD80BCF&sms=1D81A96ECBE66C8E&s=2BB425D636CE09AB"},{"n":120,"c":"A","s":"下列哪一項不是原住民傳承及保存歷史的方式？","o":["舞蹈","符咒","傳說","語言"],"a":1,"e":"參考資料：〈原住民文化保存 母語還記得多少？〉世新大學小世界台灣原住民傳承及保存歷史主要依賴「口述傳統」（耆老講述、神話傳說）、「歲時祭儀與歌舞」、「傳統工藝與服飾」以及「地名與土地連結」等方式，透過生活實踐將文化記憶代代相傳。近年結合現代科技，推動數位典藏、族語認證與《原住民族傳統智慧創作保護條例》，以文字與數位化轉譯保存珍貴的歷史文化。","u":""},{"n":121,"c":"E","s":"請問下列哪一項作物，是臺灣原住民的主要糧食，且是祭典中不可或缺的祭品之一？","o":["紅豆","綠豆","小米","花豆"],"a":2,"e":"參考資料：天天里仁文章〈走進原民部落的雜糧世界〉在原住民族經常種植的作物裡，小米可說是最重要的主食，在一塊田地裡，主糧會種在大且平坦的區域，例如小米、旱稻; 周圍或有大石頭等的畸零地塊則會種植其他穀類、豆類或瓜果類等作物，充分配置。","u":"https://www.leezen.com.tw/article/detail/2299?srsltid=AfmBOorC0S3Z3Izff3qmVTomTcGtggTNkgzw6qrMlncW-PWuszCIhxqU"},{"n":122,"c":"A","s":"原住民族許多樂器大多是使用竹子製成的。請問下列哪一項原住民族樂器是以嘴巴來吹奏的？","o":["木琴","口簧琴","趕鳥器","鼻笛"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網期刊〈lubuw na &#x27;Tayal 泰雅族口簧琴〉口簧琴是一種以一手握持就口，使嘴唇銜住琴台，另一手彈撥或拉繩，使琴台中間的彈力簧片於口腔內外擺盪振動，在口腔內產生共鳴的樂器。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/640"},{"n":123,"c":"F","s":"請問下列何者不屬於行政院原住民族委員會主辦的原住民族文化歲時祭儀系列活動之一？","o":["東港的鮪魚季","蘭嶼的飛魚祭","花蓮的豐年祭","苗栗的矮靈祭"],"a":0,"e":"參考資料：原住民族委員會網站歲時祭儀專區","u":"https://www.cip.gov.tw/zh-tw/news/data-list/0991B05985DBFF77/index.html?cumid=0991B05985DBFF77"},{"n":124,"c":"P","s":"Akun 查閱祖先的戶籍資料後發現，他的曾祖父的戶籍上有註記「熟」字，請問他的祖先應該是那個族群？","o":["平埔族","阿美族","女真族","客家人"],"a":0,"e":"參考資料：民政新聞〈高雄市推動日據時期戶籍種族欄「熟」註記措施〉日據時期戶籍簿種族欄「熟」的記載，如熟蕃人或平埔族填「熟」或「平」係指平地原住民。","u":"https://cabu.kcg.gov.tw/Web/ActivitiesDetailC006120.aspx?Cond=f8f9eb0a-2522-4916-8d10-6c57f88c7b41"},{"n":125,"c":"A","s":"哪一個臺灣原住民族群男女舞蹈不同，有「頭髮舞」及「勇士舞」的分別？","o":["阿美族","泰雅族","雅美族","賽德克族"],"a":2,"e":"參考資料：曬飛魚專欄文章〈探索蘭嶼的著名文化：結合力與美的傳統頭髮舞，如浪潮般的秀髮飄揚〉在蘭嶼，跳舞是婦女的專長能力，頭髮舞更是女子專屬的舞蹈，只有在特殊場合時才會演出，除了慶賀捕魚豐收外，每逢達悟族小米收穫祭，也有機會一睹頭髮舞風采。族人們會在這天透過歌舞敬謝天神，除了輪流登場的耕作舞、禮帽舞、頭髮舞及勇士舞，現場也會表演盛大的搗小米舞 (Meyvaci)，伴隨著族人們悠揚歌聲與舞蹈，祈福來年的平安豐收。","u":"https://zazawanzine.com/culture/b038/"},{"n":126,"c":"F","s":"如果你想更清楚記錄飛魚祭，你應該在下列哪個時間前往蘭嶼，較有可能拍攝到相關畫面？","o":["10 月","11 月","1 月","5 月"],"a":3,"e":"參考資料：蘭嶼部落文化基金會分為飛魚招魚祭、飛魚收藏祭、飛魚終食祭。從每年二至三月舉行的飛魚招魚祭到九月的飛魚終食祭為止都可以說是飛魚季，正值春夏時節，適於出海，飛魚與飛魚乾也為這時期的主要食物。","u":"https://www.taofoundation.org.tw/story/ceremony.html"},{"n":127,"c":"G2","s":"新竹尖石鄉司馬庫斯部落位處深山，請問它是臺灣哪一原住民族的部落？","o":["泰雅族","阿美族","賽夏族","排灣族"],"a":0,"e":"參考資料：新竹縣尖石鄉司馬庫斯部落資源循環型社區規劃及細部設計計畫執行設計成果網站尖石鄉的原住民族人口佔全鄉的 83.61%，而泰雅族則佔其中的99.10%，為尖石鄉最大的族群。泰雅族人被認為早期由南投縣仁愛鄉一帶起源向北移動，經過大霸尖山（泰雅族的聖山）一帶，向北分散居住，其中在新竹山區塔克金溪東岸成為 Mrqwang 支族，而司馬庫斯部落即為此支族的一個部落。","u":"http://w3.hcepb.gov.tw/hcepb/02_information/plan_all/water/%E5%8F%B8%E9%A6%AC/1-2-4.htm"},{"n":128,"c":"H1","s":"牡丹社事件爆發後，日本與當地哪一原住民族部落發生戰爭，促使清朝派駐沈葆楨來臺擔任巡撫？","o":["泰雅族","賽夏族","排灣族","阿美族"],"a":2,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈牡丹社事件的地圖史料與空間探索（上）〉1871 年11月，琉球宮古島的船隻途遇暴風，漂流到臺灣恆春半島東海岸的八瑤灣（日本記此地有高士佛港，今滿州鄉港子、九棚一帶），54名船員被當地排灣族高士佛社原住民殺害。由於琉球也向薩摩進貢，為中、日雙屬的藩屬國，後來日本入侵臺灣，就以此事為由。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/99"},{"n":129,"c":"F","s":"請問「大獵祭」是哪一族所舉辦的祭典？","o":["阿美族","布農族","泰雅族","卑南族"],"a":3,"e":"參考資料：國家文化資產網大獵祭 Mangayaw（含猴祭、除喪）是臺東縣內卑南族最重要的祭儀之一，源自於古代的狩獵祭儀，團體合擊訓練，以及部落復仇的戰爭行動。舉辦大獵祭 Mangayaw（含猴祭、除喪）的時間，大約都是每年的12 月。","u":"https://nchdb.boch.gov.tw/assets/overview/folklore/20090220000013"},{"n":130,"c":"F","s":"「豐年祭」是阿美族人最盛大的活動。請問「豐年祭」通常於每年的幾月舉辦？","o":["7、8 月","3、4 月","1、2 月","11、12 月"],"a":0,"e":"參考資料：原住民族委員會網站豐年祭是阿美族人在小米收穫後，族人為感謝神靈而舉行的祭典。豐年祭的名稱，各部落因說法不一，有 malalikid、malikoda、kiluma’an等說法，後來受日本語影響而有 zukimisai（月見祭）與siukakukai（收穫會）等不同說法，現在多稱為豐年祭。豐年祭原是小米收穫後進行，在部落稻米種植面積大量增加後，祭典時間改為稻米收割後舉行。每年 7 月開始，各部落按照稻米收成時間由南往北安排辦理，祭典時間為期 1 ∼ 7 天之間。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":131,"c":"A","s":"原住民族人常擁有好歌喉。臺灣著名歌手張惠妹是哪一族的原住民歌手？","o":["排灣族","卑南族","魯凱族","鄒族"],"a":1,"e":"參考資料：臺東觀光資源網【來源：部落背包客 豐台東 部落旅遊指南書】泰安部落是原卑南族八社裡的大巴六九 Tamalakaw社，位在大巴六九山的山麓。在這裏出了一位遠近馳名的人物，那就是被譽為華人歌壇天后的張惠妹。儘管這裡是張惠妹的故鄉，不過來到部落裡，卻瞧不見任何有關張惠妹的資訊和看板，部落沒有利用張惠妹的知名度來大肆宣揚，而是保留一貫的純樸與寧靜，這在五光十色的現代社會中更顯得難能可貴。","u":"https://tour.taitung.gov.tw/zh-tw/attraction/details/1249"},{"n":132,"c":"A","s":"臺灣歌手黃麗玲(A-Lin)是哪一族的原住民著名歌手？","o":["排灣族","卑南族","阿美族","魯凱族"],"a":2,"e":"參考資料：新聞報導〈A-Lin 返部落學歌謠 見父親感動喊：我血液是阿美族〉歌手 A-Lin（黃麗玲）透過南島實境節目《你的島嶼我的家》，終於有機會認識自己的家鄉「比西里岸部落」，從小在都市長大的她，即使在節目中用著不輪轉的母語，還是積極的向耆老討教古調唱腔，並決定以母語創作歌曲。途中，A-Lin 見到舅舅生前唱歌的影片，難掩傷心情緒忍不住落淚，也加深了她用母語創作歌曲的決心。","u":"https://reurl.cc/K2pGae"},{"n":133,"c":"H2","s":"下列哪一原住民族，在日治時期並未與日本政府對立，亦無抗日事件發生？","o":["鄒族","賽德克族","布農族","太魯閣族"],"a":0,"e":"參考資料：1.賽德克族-霧社事件1914 年（大正3年）1月，以新武呂溪上游布農族重要大社「霧鹿社」（Bulbul）為核心，受邀前來談和、接受饋贈的布農族人遭日警搜查隊屠殺，族人於警方撤退過程於新武呂溪稍下游處進行反擊，此事件官方記錄名稱為「高山蕃ノ制壓」。事件涉及布農族、日本人，以及卑南族、阿美族等平地原住民族，背景則源於東台灣的經濟開發政策以及七腳川事件移民的影響。3.太魯閣族廣義的太魯閣事件，指的是自 1896 年（明治29年）11月至1914年（大正 3年）8月的一連串衝突，前後歷時 18年之久。狹義的太魯閣事件，則指 1914年 6月至8月的那場戰役，該戰役為「隘勇線前進」與五年計劃的終戰。日治初期的原住民行政包括撫墾署及警務局等兩個系統，前者偏重撫育，而後者偏重管理。日後在警務局的主導下，各地警政單位逐步設立，最後更成為部落政務的執行者。","u":"https://tcmb.culture.tw/zh-tw/subject/2982.布農族-霧鹿事件https://aborgpedia.alcd.center/detail?id=11814&search=&cat=0&race=0&writer=https://aborgpedia.alcd.center/detail?id=10141&search=&cat=25&race=0&writer="},{"n":134,"c":"H1","s":"十七世紀，荷蘭人為了對西南平原的原住民族宣揚基督宗教，運用了哪一套文字系統，創造「新港文」？","o":["阿拉伯文系統","羅馬字系統","漢字注音系統","印度字系統"],"a":1,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從新港文書看 16-19世紀的平埔族〉荷蘭人來到臺灣後，將文字系統輸入鄰近荷蘭人的原住民部落，特別是最靠近大員（今臺南安平區）熱蘭遮城行政中心的西拉雅族新港社（今臺南新市區），最早設立教會學校（1636年），最先接觸文字教育，持續性也最久。因此，一些部落年輕人學會使用羅馬字來書寫自己的母語－新港語（Sinkan Language），也曾被派到其他部落教導羅馬字。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/46"},{"n":135,"c":"E","s":"臺灣哪一個原住民族擁有獨特的海洋文化，常被認為是臺灣原住民族中最了解海洋的族群？","o":["阿美族","泰雅族","達悟族","賽夏族"],"a":2,"e":"參考資料：蘭嶼鄉公所網站","u":"https://www.lanyu.gov.tw/iframcontent_edit.php?typeid=1632"},{"n":136,"c":"G2","s":"哪一個原住民族主要居住在阿里山鄉？","o":["魯凱族","排灣族","泰雅族","鄒族"],"a":3,"e":"參考資料：原住民族委員會網站鄒族分布在嘉義縣阿里山山區曾文溪流域、濁水溪流域的上游；有嘉義縣阿里山鄉達邦、特富野，與南投縣信義鄉久美的魯夫都群三大社。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/AE6EE12F5F284D59D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":137,"c":"M","s":"太魯閣族彩虹橋傳說中，男人要善於狩獵；女人必須勤奮工作才能通過彩虹橋，否則將被哪一物吞噬？","o":["大水怪","大白鯊","大螃蟹","大鯨魚"],"a":2,"e":"參考資料：太魯閣族的彩虹橋傳說從前的太魯閣族祖先常對孩子們說，人死後，他靈魂必定會在彩虹橋的橋頭。凡斬獲過敵人首級的男人和會織布與編織的女人，一洗手立刻冒出血來。像這樣的人會讓它們通過彩虹橋，到祖靈那裡享福。可是沒有取敵人首級的男人及不會織布及編織的女人，就不能通過彩虹橋，而把他們丟下河底，在那裡要被螃蟹吃掉。因此為了能經過彩虹橋，男人要去取敵人的首級，女人必須會織布與編織。祖先又說，不可用手指頭去指向彩虹橋，免得手指會斷掉。","u":"https://www.shute.kh.edu.tw/~abo015/web/d.htm"},{"n":138,"c":"G2","s":"請問臺灣原住民族中的太魯閣族，大多分佈於下列哪些鄉鎮？","o":["秀林鄉、萬榮鄉、南澳鄉","大同鄉、魚池鄉、仁愛鄉","秀林鄉、萬榮鄉、卓溪鄉","大同鄉、仁愛鄉、壽豐鄉"],"a":2,"e":"參考資料：原住民族委員會網站太魯閣族人（Truku）在十七、十八世紀往東越過了中央山脈的奇萊山、能高山、合歡山，到達臺灣東部的花蓮地區，在東部建立了新的家園。在十七、十八、十九世紀的荷蘭、日本與中華民國政府，皆因為太魯閣族人在東部的勢力，而以「大魯閣」、「太魯閣」一詞作為地名、族群稱呼使用至今，並受日文漢字「太魯閣」發音影響而讀為「ta-ro-ko」。太魯閣族往東拓展後，在花蓮立霧溪、太魯閣溪兩岸河谷建立部落，十九世紀末太魯閣族人逐漸往立霧溪中、下游移動，往北到達和平溪流域，往南則發展到三棧溪、木瓜溪、清水溪流域。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F0736660B8023670D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":139,"c":"G2","s":"下列哪一條溪流的流域，是太魯閣族目前居住的傳統領域？","o":["濁水溪","南澳溪","大甲溪","木瓜溪"],"a":3,"e":"參考資料：原住民族委員會網站太魯閣族人（Truku）在十七、十八世紀往東越過了中央山脈的奇萊山、能高山、合歡山，到達臺灣東部的花蓮地區，在東部建立了新的家園。在十七、十八、十九世紀的荷蘭、日本與中華民國政府，皆因為太魯閣族人在東部的勢力，而以「大魯閣」、「太魯閣」一詞作為地名、族群稱呼使用至今，並受日文漢字「太魯閣」發音影響而讀為「ta-ro-ko」。太魯閣族往東拓展後，在花蓮立霧溪、太魯閣溪兩岸河谷建立部落，十九世紀末太魯閣族人逐漸往立霧溪中、下游移動，往北到達和平溪流域，往南則發展到三棧溪、木瓜溪、清水溪流域。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F0736660B8023670D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":140,"c":"M","s":"布農族有關大洪水的神話故事中，為族人取得火種的是名叫 haipis 的鳥。請問該鳥又稱作什麼？","o":["五色鳥","紅嘴黑鵯","綠繡眼","啄木鳥"],"a":1,"e":"參考資料：【生物多樣性的美好日常】為人類叼回火種 布農族的神聖之鳥：紅嘴黑鵯相傳遠古時期，有隻大蛇堵住了海水出口，導致海水上升、氾濫成災。為了躲避洪水，布農族人跟其他動物，急忙逃往高山避難，卻因沒有火種可供取暖及煮食而衍生疾病。此時，有位族人發現一處山頂正燃燒著火光，於是眾人開始商議要如何去取火種。首先，青蛙自告奮勇前去取火，牠把火種背在背上，背部因而燙傷、起了水泡，成為蟾蜍的模樣。但青蛙在游回來的途中，不慎讓火種熄滅，因此陸續又有烏鴉、大卷尾、水鹿等其他動物自願前去取火，只是也都無功而返。正當人們萬分焦急之時，族裡公認最美麗的鳥——凱畢斯（haipis）接下了這個艱鉅的任務。由於火種很燙，因此牠時而用雙腳緊緊抓住，時而又改以嘴喙啣著，最後終於成功取回火種。但在過程中，高溫的火種也燒傷了牠的嘴喙及雙腳，變成了鮮豔的紅色，而原本漂亮如彩虹般的羽毛，也因火燻而變為烏漆墨黑，成為了如今紅嘴黑鵯的模樣。","u":"https://e-info.org.tw/node/232922"},{"n":141,"c":"A","s":"下列作家中，何者經常將海洋知識寫進文學創作中？","o":["夏曼．藍波安","奧威尼．卡露斯盎","霍斯陸曼．伐伐","瓦歷斯．諾幹"],"a":0,"e":"參考資料：微笑台灣專欄文章〈
