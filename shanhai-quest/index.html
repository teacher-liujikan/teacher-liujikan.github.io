/* ---------- quiz ---------- */
function exHTML(q){
  return `<h4>解析</h4><p><b>答案：(${L[q.a]}) ${q.o[q.a]}</b></p>${q.e?`<p>${q.e}</p>`:''}${q.u?`<p><a href="${q.u}" target="_blank" rel="noopener">打開參考資料網頁</a></p>`:''}`;
}
function qBody(q,picked,done){
  return `<p class="stem"><span class="qn">${q.n}.</span>${q.s}</p>
  <div class="opts" role="group" aria-label="選項">${q.o.map((o,i)=>{
    let c='';if(done){if(i===q.a)c=' good';else if(i===picked)c=' bad'}
    return `<button type="button" class="opt${c}" data-c="${i}" ${done?'disabled':''}><span class="k">(${L[i]})</span><span>${o}</span></button>`}).join('')}</div>`;
}
function startLevel(lid){
  const l=getL(lid),st=state.stages[lid]||{};
  let order;
  if(l.type==='theme')order=shuffle(poolOf(l)).map(q=>q.id);
  else if(l.type==='drill')order=shuffle(openIds()).slice(0,15);
  else{const pool=poolOf(l),a=shuffle(pool.filter(q=>state.open[q.id])),b=shuffle(pool.filter(q=>!state.open[q.id]));order=shuffle(a.concat(b).slice(0,l.n)).map(q=>q.id)}
  if(!order.length)return;
  state.run={lid,phase:'first',order,total:order.length,idx:0,res:[],pick:null,firstWrong:[],miss:[],tries:0,replay:!!st.cleared,earned:{},newBadges:[],saved:0};
  state.view='quiz';save();render();window.scrollTo(0,0);
}
function answer(c){
  const r=state.run;if(!r||r.pick!=null)return;
  const l=getL(r.lid),q=byId(r.order[r.idx]);const ok=c===q.a;r.pick=c;r.res[r.idx]=ok;r.lastGain=0;r.lastCombo=false;r.lastSaved=false;
  bumpStreak(ok);
  if(ok){
    if(r.phase==='first'){
      if(l.type==='drill'){r.lastGain+=gain(XP.rescue,'救回錯題')}
      else{r.lastGain+=gain(XP.first,'第一輪答對');if(state.streak>=3){r.lastGain+=gain(XP.combo,'連對加碼');r.lastCombo=true}}
      if(l.type!=='theme'&&state.open[q.id]){delete state.open[q.id];r.saved++;r.lastSaved=true;state.rescued=(state.rescued||0)+1;if(state.rescued>=10)award('rescue')}
    }else r.lastGain+=gain(XP.retry,'錯題回收答對');
  }else{
    state.wrong[q.id]=(state.wrong[q.id]||0)+1;state.open[q.id]=1;
    if(r.phase==='first')r.firstWrong.push(q.id);else r.miss.push(q.id);
  }
  save();renderQuiz();
  if(r.lastGain){const f=document.createElement('span');f.className='float';f.textContent='+'+r.lastGain;$('.q').appendChild(f)}
  const nb=$('#nextBtn');if(nb)nb.focus({preventScroll:true});
}
function next(){
  const r=state.run,l=getL(r.lid);r.idx++;r.pick=null;
  if(r.idx<r.order.length){save();renderQuiz();window.scrollTo(0,0);return}
  if(l.type==='drill')r.phase='drillend';
  else if(r.phase==='first')r.phase=r.firstWrong.length?'between':'clear';
  else r.phase=r.miss.length?'fail':'clear';
  if(r.phase==='clear')clearLevel();
  save();renderQuiz();window.scrollTo(0,0);
}
function startRetry(){
  const r=state.run;r.tries++;r.phase='retry';r.order=shuffle(r.firstWrong);r.idx=0;r.res=[];r.pick=null;r.miss=[];
  save();renderQuiz();window.scrollTo(0,0);
}
function clearLevel(){
  const r=state.run,l=getL(r.lid);const first=r.total-r.firstWrong.length;const stars=starsFor(first,r.total);
  const st=state.stages[r.lid]||{};
  gain(XP.clear,'過關獎勵');if(!r.firstWrong.length)gain(XP.perfect,'零失誤獎勵');
  r.stars=stars;r.first=first;r.improved=!!st.cleared&&stars>(st.stars||0);
  const better=!st.cleared||first/r.total>=(st.best||0)/(st.total||r.total);
  state.stages[r.lid]={cleared:true,stars:Math.max(stars,st.stars||0),best:better?first:st.best,total:better?r.total:st.total};
  if(l.fig&&!state.figs[l.fig]){state.figs[l.fig]=Date.now();r.newFig=l.fig}
  if(l.badge)award(l.badge);
  award('first');if(!r.firstWrong.length)award('perfect');
  if(r.firstWrong.length&&r.tries===1)award('oneshot');
  if(r.tries>1)award('grit');
  const nf=Object.keys(state.figs).length;if(nf>=6)award('fig6');if(nf>=Object.keys(FIGS).length)award('figall');
  if(LV.every(x=>(state.stages[x.id]||{}).stars===3))award('allstar');
}
function renderQuiz(){
  const r=state.run;if(!r){state.view='home';return render()}
  const l=getL(r.lid),i=LV.indexOf(l),U=UNITS[l.u];
  $('#wrap').classList.add('narrow');
  const playing=r.phase==='first'||r.phase==='retry';
  const sub=l.type==='theme'?UNITS[l.u].name:l.type==='review'?'從前面兩關抽題':l.type==='final'?'全部題庫抽題':'把錯題救回來';
  const head=`<div class="qhead"><div class="qrow"><button type="button" class="btn" id="homeBtn">← 地圖</button>
    <div class="ttl"><b>${l.name}</b><small>${r.phase==='first'?`<span class="phase">${l.type==='drill'?'特訓':'第一輪'}</span>`:r.phase==='retry'?`<span class="phase re">錯題回收${r.tries>1?` 第 ${r.tries} 次`:''}</span>`:''}${sub}${playing?`・第 ${Math.min(r.idx+1,r.order.length)} / ${r.order.length} 題`:''}${r.replay?'・重玩（不加 XP）':''}</small></div>
    <span class="combo" data-n="${state.streak}">連對 ${state.streak}</span></div>
    ${playing?`<div class="dots" aria-hidden="true">${r.order.map((id,k)=>`<i class="${k<r.idx||(k===r.idx&&r.pick!=null)?(r.res[k]?'r':'w'):k===r.idx?'cur':''}"></i>`).join('')}</div>`:''}</div>`;
  let body='';
  if(playing){
    const q=byId(r.order[r.idx]);const done=r.pick!=null;const ok=done&&r.pick===q.a;
    const last=r.idx+1>=r.order.length;
    body=`<article class="q${done?(ok?' right':' wrong'):''}">${qBody(q,r.pick,done)}
      ${done?(ok?`<div class="fb ok" role="status"><strong>答對了！</strong>${r.lastGain?`<span class="gain">+${r.lastGain} XP</span>`:''}${r.lastCombo?`<p>連對 ${state.streak} 題，加碼中</p>`:''}${r.lastSaved?'<p>這題從錯題本畢業了</p>':''}</div><details class="explain"><summary>看解析</summary>${exHTML(q)}</details>`
        :`<div class="fb no" role="status"><strong>答錯了</strong><p>正確答案是 (${L[q.a]})，這題已經記進錯題本。先把解析看懂再往下。</p></div><div class="explain">${exHTML(q)}</div>`)
        +`<div class="nextrow"><button type="button" class="btn primary big" id="nextBtn">${!last?'下一題 →':l.type==='drill'?'看特訓結果':r.phase==='first'?'看這一輪結果':'看回收結果'}</button></div>`:''}
    </article>`;
  }else if(r.phase==='between'){
    const first=r.total-r.firstWrong.length;
    body=`<section class="panel"><h2>第一輪結束</h2><p class="big">${r.total} 題答對 ${first} 題</p>
      <div class="rowb">${r.firstWrong.map(id=>`<span class="chipq">第 ${byId(id).n} 題</span>`).join('')}</div>
      <p class="muted">這 ${r.firstWrong.length} 題要在「錯題回收」裡全部答對，才能過關。題目順序會打亂。</p>
      <button type="button" class="btn primary big" id="retryBtn">開始錯題回收（${r.firstWrong.length} 題）</button></section>`;
  }else if(r.phase==='fail'){
    body=`<section class="panel"><h2>差一點！</h2><p class="big">${r.order.length} 題裡還有 ${r.miss.length} 題答錯</p>
      <div class="rowb">${r.miss.map(id=>`<span class="chipq">第 ${byId(id).n} 題</span>`).join('')}</div>
      <p class="muted">錯題回收要一次全部答對才過關。回想一下剛剛的解析，再挑戰一次。</p>
      <button type="button" class="btn primary big" id="retryBtn">再挑戰錯題回收（${r.firstWrong.length} 題）</button></section>`;
  }else if(r.phase==='drillend'){
    const left=openIds().length;
    body=`<section class="panel"><h2>特訓結束</h2><p class="big">救回 ${r.saved} 題</p>
      <p class="muted">${left?`錯題本裡還有 ${left} 題，休息一下再來。`:'錯題本清空了！'}</p>
      <div class="rowb">${left?'<button type="button" class="btn primary big" id="drillBtn">再特訓一次</button>':''}<button type="button" class="btn big" id="homeBtn2">回地圖</button></div></section>`;
  }else if(r.phase==='clear'){
    const nx=LV[i+1];const earned=Object.entries(r.earned||{});const total=earned.reduce((a,[,v])=>a+v,0);
    body=`<section class="panel"><h2>${l.name}　過關！</h2><div class="bigstars" aria-label="${r.stars} 顆星">${starsHTML(r.stars)}</div>
      <p class="muted">第一輪答對 ${r.first} / ${r.total} 題${r.improved?'・刷新最佳星數！':''}${r.saved?`・救回 ${r.saved} 題錯題`:''}</p>
      ${r.newFig?`<div class="gotfig"><small>獲得新公仔</small><div class="bigfig">${figSVG(r.newFig)}</div><b>${FIGS[r.newFig].name}</b><span style="font-size:15px;max-width:22em">${FIGS[r.newFig].note}</span></div>`:''}
      ${r.replay?'<p class="muted">重玩模式不加 XP，星星和最佳紀錄會保留比較好的那次。</p>':`<div class="earn">${earned.map(([k,v])=>`<div><span>${k}</span><b>+${v}</b></div>`).join('')}<div><span>這一關合計</span><b>+${total} XP</b></div></div>`}
      ${r.rankUp?`<p class="big">升級成「${r.rankUp}」</p>`:''}
      ${(r.newBadges||[]).length?`<div class="newbadge">${r.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="badge"><span class="medal">${b.m}</span><div><b>${b.name}</b><small>${b.desc}</small></div></div>`}).join('')}</div>`:''}
      <div class="rowb">${nx?`<button type="button" class="btn primary big" data-start="${nx.id}">下一關：${nx.name} →</button>`:'<p class="big">整張地圖走完了！</p>'}<button type="button" class="btn big" id="homeBtn2">回地圖</button></div></section>`;
  }
  $('#main').innerHTML=head+body;
}

      <label class="field" for="tkey"><span>教師密碼</span><input id="tkey" type="password" autocomplete="current-password"></label>
      <div class="rowf"><button class="btn primary big" type="submit">登入</button><button class="btn" type="button" id="backLogin">返回</button></div>
      <span class="err" id="terr" role="alert"></span>
    </form>

  </section>`;
  $('#tkey').focus();
}
async function teacherLogin(c,k){
  await ready();
  try{await API.check(c,k)}catch(e){$('#terr').textContent=e.message==='key'?'密碼不對。':'密碼不對，或連不上後台。';return}
  me.role='teacher';me.cls=c;me.key=k;LOGIN.set({cls:c,role:'teacher',key:k});
  await tLoad();render();startTeacherPoll();
}

/* ---------- teacher back office ---------- */
const T={recs:[],err:null,at:0,detail:null};
let pollT=0;
async function tLoad(){
  try{const j=await API.all(me.cls,me.key);T.recs=(j.recs||[]).filter(r=>r&&r.stage==='state'&&pOf(r.seat));T.err=null;T.at=Date.now()}
  catch(e){T.err='連不上後台，畫面是上一次的資料。'}
}
function startTeacherPoll(){
  clearInterval(pollT);
  pollT=setInterval(async()=>{
    if(me.role!=='teacher'||document.hidden||!$('#tModal').hidden)return;
    await tLoad();if(me.role==='teacher'&&$('#tModal').hidden)renderTeacher(true);
  },10000);
}
const fmtT=t=>t?new Date(t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const recOf=seat=>T.recs.find(r=>String(r.seat)===String(seat));
const clearedN=r=>LV.filter(l=>((r.stages||{})[l.id]||{}).cleared).length;
const openN=r=>Object.keys(r.open||{}).length;
function renderTeacher(soft){
  $('#wrap').classList.remove('narrow');
  const sx=soft?window.scrollX:0,sy=soft?window.scrollY:0;
  const seats=PLAYERS.map(p=>p.seat);
  const act=T.recs.filter(r=>r.xp||r.run||clearedN(r)>0);
  const avg=act.length?(act.reduce((a,r)=>a+clearedN(r),0)/act.length).toFixed(1):'0';
  const fin=act.filter(r=>clearedN(r)===LV.length).length;
  let no=0;const heads=LV.map(l=>({l,t:l.type==='theme'?String(++no):l.type==='review'?'複':'頂'}));
  const rows=seats.map(s=>{
    const r=recOf(s);
    if(!r||(!r.xp&&!r.run&&!clearedN(r)))return `<tr class="none"><td><button type="button" class="seatbtn" data-tseat="${s}" ${r?'':'disabled'}>${esc(pFull(s))}</button></td><td class="l">還沒開始</td><td>—</td>${LV.map(()=>'<td></td>').join('')}<td>—</td><td>—</td><td>${r?fmtT(r.t):'—'}</td></tr>`;
    return `<tr><td><button type="button" class="seatbtn" data-tseat="${s}" aria-label="${esc(pName(s))}的詳細紀錄">${esc(pFull(s))}</button></td>
      <td class="l">${RANKS[rankOf(r.xp||0)].t}・${r.xp||0} XP</td><td><b>${clearedN(r)}</b> / ${LV.length}</td>
      ${LV.map(l=>{const st=(r.stages||{})[l.id]||{};const run=r.run&&r.run.lid===l.id&&r.run.phase!=='clear';
        return `<td title="${esc(l.name)}${st.cleared?`：最佳 ${st.best}/${st.total}`:''}">${st.cleared?`<span class="st3">${'★'.repeat(st.stars||1)}</span>`:run?'<span class="run">作答中</span>':''}</td>`}).join('')}
      <td>${Object.keys(r.figs||{}).length}</td><td>${openN(r)}</td><td>${fmtT(r.t)}</td></tr>`}).join('');
  const agg={};
  T.recs.forEach(r=>Object.entries(r.wrong||{}).forEach(([id,c])=>{if(!byId(id))return;(agg[id]=agg[id]||{seats:[],sum:0});agg[id].seats.push(+r.seat);agg[id].sum+=c}));
  const top=Object.entries(agg).sort((a,b)=>b[1].seats.length-a[1].seats.length||b[1].sum-a[1].sum).slice(0,30);
  $('#main').innerHTML=`
   <div class="rowf" style="justify-content:space-between;margin-top:6px"><p class="muted" style="margin:0;font-size:14px">${T.err?`<span class="err">${T.err}</span>`:`每 10 秒自動更新・上次更新 ${fmtT(T.at)}`}${DEMO?'・沒有連到後台（只看得到這台裝置上的紀錄）':''}</p><button type="button" class="btn" id="tReload">立刻更新</button></div>
   <div class="tiles"><div class="tile"><small>已經開始的選手</small><b>${act.length} / ${PLAYERS.length}</b></div><div class="tile"><small>平均過關數（共 ${LV.length} 關）</small><b>${avg}</b></div><div class="tile"><small>走完整張地圖</small><b>${fin} 人</b></div></div>
   <section class="tsec"><h2>選手進度</h2><p class="muted" style="margin:0 0 8px;font-size:14px">星星是第一輪答對率（九成 ★★★、七成 ★★）。點名字看詳細紀錄。</p>
    <div class="scroll"><table class="tbl"><thead><tr><th class="l">選手</th><th class="l">等級</th><th>過關</th>${heads.map(h=>`<th class="u" style="background:${UNITS[h.l.u].c}" title="${esc(h.l.name)}">${h.t}</th>`).join('')}<th>公仔</th><th>待救回錯題</th><th>最後作答</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="margin:6px 0 0;font-size:13px">欄位 1–12 是主題關，「複」是複習站，「頂」是總複習。滑鼠移到格子上可以看關卡名稱和最佳成績。</p></section>
   <section class="tsec"><h2>最常錯的題目</h2>
    ${top.length?`<div class="scroll"><table class="tbl"><thead><tr><th>題號</th><th class="l">題目</th><th class="l">答案</th><th>錯的人數</th><th class="l">誰錯了</th></tr></thead><tbody>${top.map(([id,a])=>{const q=byId(id);return `<tr><td>${q.n}</td><td class="wrapc">${q.s}</td><td class="l">(${L[q.a]}) ${q.o[q.a]}</td><td>${a.seats.length}</td><td class="l">${a.seats.sort((x,y)=>x-y).map(pName).map(esc).join('、')}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">還沒有人答錯題目。</p>'}
   </section>`;
  if(soft)window.scrollTo(sx,sy);
}
function showSeat(seat){
  const r=recOf(seat);if(!r)return;T.detail=seat;
  const wb=Object.keys(r.open||{}).map(byId).filter(Boolean).sort((a,b)=>a.n-b.n);
  let no=0;
  $('#tModalBody').innerHTML=`<h2>${esc(pFull(seat))}</h2>
    <p>${RANKS[rankOf(r.xp||0)].t}・${r.xp||0} XP・最高連對 ${r.bestStreak||0} 題・最後作答 ${fmtT(r.t)}</p>
    <div class="scroll"><table class="tbl"><thead><tr><th class="l">關卡</th><th>星星</th><th>第一輪最佳</th></tr></thead><tbody>${LV.map(l=>{const st=(r.stages||{})[l.id]||{};const run=r.run&&r.run.lid===l.id&&r.run.phase!=='clear';return `<tr${st.cleared||run?'':' class="none"'}><td class="l">${l.type==='theme'?(++no)+'. ':''}${esc(l.name)}</td><td>${st.cleared?`<span class="st3">${'★'.repeat(st.stars||1)}</span>`:run?`<span class="run">作答中（${r.run.phase==='retry'||r.run.phase==='fail'||r.run.phase==='between'?'錯題回收':`第 ${Math.min((r.run.idx||0)+1,r.run.total)} / ${r.run.total} 題`}）</span>`:'—'}</td><td>${st.cleared?`${st.best} / ${st.total}`:'—'}</td></tr>`}).join('')}</tbody></table></div>
    <p><b>公仔 ${Object.keys(r.figs||{}).length} 隻：</b>${Object.keys(r.figs||{}).filter(f=>FIGS[f]).map(f=>FIGS[f].name).join('、')||'還沒有'}</p>
    <p><b>待救回錯題 ${wb.length} 題：</b>${wb.length?wb.map(q=>`第 ${q.n} 題（錯 ${(r.wrong||{})[q.id]||1} 次）`).join('、'):'沒有'}</p>
    <div class="rowf" id="tResetZone"><button type="button" class="btn primary" id="tClose">關閉</button><button type="button" class="btn" id="tReset">清除這位選手的紀錄</button></div>`;
  $('#tModal').hidden=false;$('#tClose').focus();
}
async function resetSeat(seat){
  const rec=Object.assign(fresh(),{seat:+seat,stage:'state',t:Date.now(),dev:DEV,reset:true});
  try{await API.save(me.cls,seat,'state',rec);LS.set(`${LK}-me-${me.cls}-${seat}`,null);LS.set(`${LK}-pending-${me.cls}-${seat}`,0);$('#tModal').hidden=true;await tLoad();renderTeacher(true);toast(`${esc(pName(seat))}的紀錄清除了`)}
  catch(e){const z=$('#tResetZone');if(z)z.insertAdjacentHTML('beforeend','<span class="err" role="alert">沒有清除成功，請再試一次。</span>')}
}
function goHome(){const r=state.run;if(r&&(r.phase==='clear'||r.phase==='drillend'))state.run=null;state.view='home';save();render(true)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.fig){showFig(t.dataset.fig);return}
  if(t.dataset.seat){enterStudent(DEFAULT_CLASS,+t.dataset.seat);return}
  if(t.id==='toPreview'){$('#pvForm').hidden=false;$('#pvPin').focus();return}
  if(t.id==='toTeacher'){renderTeacherLogin();return}
  if(t.id==='backLogin'){renderLogin();return}
  if(t.id==='logoutBtn'){logout();return}
  if(t.id==='tReload'){tLoad().then(()=>renderTeacher(true));return}
  if(t.dataset.tseat){showSeat(t.dataset.tseat);return}
  if(t.id==='tClose'){$('#tModal').hidden=true;return}
  if(t.id==='tReset'){$('#tResetZone').innerHTML=`<span>${esc(pName(T.detail))}的 XP、星星、公仔和錯題本都會清掉，確定嗎？</span><button type="button" class="btn primary" id="tResetYes">清除</button><button type="button" class="btn" id="tClose">不要</button>`;return}
  if(t.id==='tResetYes'){resetSeat(T.detail);return}
  if(t.dataset.start){const r=state.run;if(r&&r.lid===t.dataset.start&&r.phase!=='clear'){state.view='quiz';save();render();window.scrollTo(0,0)}else startLevel(t.dataset.start);return}
  if(t.id==='drillBtn'){startLevel('wb');return}
  if(t.classList.contains('opt')&&t.dataset.c!=null&&!t.disabled){answer(+t.dataset.c);return}
  if(t.id==='nextBtn'){next();return}
  if(t.id==='retryBtn'){startRetry();return}
  if(t.id==='homeBtn'||t.id==='homeBtn2'){goHome();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='pvForm'){pinOK($('#pvPin').value).then(ok=>{if(ok)enterPreview(DEFAULT_CLASS);else $('#pvErr').textContent='密碼不對。'})}
  if(e.target.id==='tForm')teacherLogin(DEFAULT_CLASS,$('#tkey').value);
});
$('#tModal').addEventListener('click',e=>{if(e.target===$('#tModal'))$('#tModal').hidden=true});
window.addEventListener('pagehide',()=>{if(pending)flush()});
document.addEventListener('toggle',e=>{
  const d=e.target;if(!d.matches||!d.matches('.wb details')||!d.open)return;
  const box=d.querySelector('.wbody');if(box.dataset.done)return;
  const q=byId(d.dataset.q);box.dataset.done=1;box.innerHTML=qBody(q,q.a,true)+`<div class="explain">${exHTML(q)}</div>`;
},true);
function showFig(id){
  const got=!!state.figs[id],f=FIGS[id],l=LV.find(x=>x.fig===id);
  $('#figBig').innerHTML=figSVG(id);$('#figBig').className='bigfig'+(got?'':' figcell locked');
  $('#figBig').style.cssText=got?'':'border:0;background:none;padding:0';
  $('#figName').textContent=got?f.name:'？？？';
  $('#figNote').textContent=got?f.note:'還沒蒐集到這隻公仔。';
  $('#figHow').textContent=(got?'來自：':'怎麼拿：通過')+'「'+l.name+'」'+(got?'':'這一關');
  $('#figModal').hidden=false;$('#figClose').focus();
}
$('#figClose').addEventListener('click',()=>{$('#figModal').hidden=true});
$('#figModal').addEventListener('click',e=>{if(e.target===$('#figModal'))$('#figModal').hidden=true});
/* QR code: only where the page has a public address of its own (for example GitHub Pages) */
(function(){
  const m=$('#qrModal');
  if(window.QRCode&&/github\.io$/.test(location.hostname)){
    const url=location.origin+location.pathname;
    const make=(el,size)=>{try{new QRCode(el,{text:url,width:size,height:size,colorDark:'#15302b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}};
    make($('#qrSmall'),140);make($('#qrBig'),420);$('#qrUrl').textContent=url;
    $('#qrOpen').hidden=false;$('#top').classList.add('hasqr');
    $('#qrOpen').addEventListener('click',()=>{m.hidden=false;$('#qrClose').focus()});
  }
  $('#qrClose').addEventListener('click',()=>{m.hidden=true});
  m.addEventListener('click',e=>{if(e.target===m)m.hidden=true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){m.hidden=true;$('#figModal').hidden=true;$('#tModal').hidden=true}});
})();
(async function boot(){
  const saved=LOGIN.get();
  if(saved)await ready();
  if(saved&&saved.role==='student'&&saved.seat){me.cls=saved.cls||DEFAULT_CLASS;renderWho();$('#main').innerHTML='<p class="empty">讀取紀錄中…</p>';await enterStudent(me.cls,saved.seat)}
  else if(saved&&saved.role==='teacher'&&saved.key){me.role='teacher';me.cls=saved.cls;me.key=saved.key;await tLoad();render();startTeacherPoll()}
  else{render();ready().then(()=>{if(!me.role&&$('.players'))render()})}
})();
})();
</script>
</body>
</html>
