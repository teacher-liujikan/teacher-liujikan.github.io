紀錄片《大海浮夢》夏曼．藍波安父子同心造舟，以身體創作蘭嶼達悟詩篇〉","u":"https://smiletaiwan.cw.com.tw/article/8770"},{"n":142,"c":"A","s":"作家亞榮隆．撒可努的文學作品《山豬．飛鼠．撒可努》中的哪一篇文章曾被收錄於教科書？","o":["〈最後的獵人〉","〈飛鼠大學〉","〈紅嘴巴vuvu〉","〈老人與海〉"],"a":1,"e":"參考資料：公益平臺文化基金會網站勇於做夢，初心不改——訪走風的人 獵人學校創辦者 亞榮隆．撒可努","u":"https://www.thealliance.org.tw/story/1759"},{"n":143,"c":"A","s":"亞榮隆．撒可努著有文學作品《山豬．飛鼠．撒可努》，請問他是哪一個原住民族鄉的排灣族人？","o":["信義鄉","大武鄉","泰武鄉","太麻里鄉"],"a":3,"e":"參考資料：公益平臺文化基金會網站勇於做夢，初心不改——訪走風的人 獵人學校創辦者 亞榮隆．撒可努","u":"https://www.thealliance.org.tw/story/1759"},{"n":144,"c":"M","s":"何種水果在達悟族話音近「抓不到魚」，到蘭嶼不可帶著或提到，否則會被視為觸霉頭？","o":["水梨","橘子","蘋果","楊桃"],"a":1,"e":"參考資料：在達悟族語中，vazacinok （橘子）的發音類似抓不到魚、漁運不佳的pivazavacinoki（詛咒），因此在祭典期間，族人會避免提到橘子、遊客盡量不要帶橘子、學校午餐裡當然最好不要有橘子。","u":"https://www.ilrdf.org.tw/basic/?mode=detail&node=1374"},{"n":145,"c":"A","s":"《Oli 邊境》是關於台灣原住民文化與音樂的VR 作品，其中吟唱的〈太巴塱之歌〉屬於哪一原住民族？","o":["泰雅族","雅美族","阿美族","排灣族"],"a":2,"e":"參考資料：族語E樂園《太巴塱之歌》是花蓮光復鄉阿美族太巴塱部落的傳統歌謠，意指「有很多白色螃蟹的地方」。這首歌謠內容源自二兄弟神話、講述收穫與感恩，充滿對太陽母親的敬意。雖曾被誤用於歡樂情節，但實際上包含神聖的祭儀意涵，在陳建年唱紅後廣為人知。","u":"https://web.klokah.tw/video/watch.php?vid=95"},{"n":146,"c":"R","s":"在認識我們所居住、生活的地方時，下列哪一項敘述正確？","o":["原住民族稱作社區，其他區域稱作部落","原住民族稱作部落，其他區域稱作社區","都會區稱作部落，非都會區稱作社區","都會區又稱鄉鎮，非都會區又稱市中心"],"a":1,"e":"參考資料：三民輔考網(首頁/學習百科/公職特種考試/原住民族特考)1.聚落指的是人群聚居最小的單位，清代以來台灣原住民的聚落通稱為社，漢人聚落則稱為庄。原住民聚落的性質，大體可以分成三類：(1)第一類：與部落組織相一致。(2)第二類：以族人的血緣團體或祭祀團體相一致。(3)第三類：為純地緣型團體，由一部落的若干氏族或小祭祀團結合為一社。2.部落是以地域社會為基礎的最原始政治組織。大致上部落有兩大類型：(1)聚居型部落的成員比鄰而居，以會所為中心，周圍分布著耕地、獵場、漁區。(2)散居型部落的成員分散在附近的山區，形成大分散小集中的格局。","u":"https://reurl.cc/M2bMok"},{"n":147,"c":"C","s":"哪一個原住民族部落，可以看到街道牆面的圖案，有百合花、勇士、山豬等圖案呢？","o":["阿美族","卑南族","鄒族","魯凱族"],"a":3,"e":"參考資料：原住民族委員會網站魯凱族簡介","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/409F703B4E592A82D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":148,"c":"C","s":"請問哪一個原住民族群的傳統家屋，牆面和屋頂以竹子搭建，柱子採用蛇木建材？","o":["阿美族","布農族","達悟族","太魯閣族"],"a":3,"e":"參考資料：【島嶼說書人】圖解台灣建築史系列——來去部落住一晚（卷一）積木壁建築——戰鬥民族的避寒妙方泰雅族、太魯閣族、賽德克和賽夏族居住在海拔 1000公尺到1500公尺海拔的山區，此區的氣後濕冷，盛產竹木，原住民多用竹子、木頭、茅草三種建材蓋屋，而有些住比較高的泰雅族和賽德克族也會加上石板，但目的是為了防禦外敵。","u":"https://vocus.cc/article/5a1219dceceaed97b4026654"},{"n":149,"c":"A","s":"「祈禱小米豐收歌」是屬於哪一族的傳統古謠？","o":["布農族","卑南族","魯凱族","鄒族"],"a":0,"e":"參考資料：國立傳統藝術中心臺灣音樂館布農族行山田燒墾的遊耕生活，因此形成散居的形式，對於農作（尤其是小米）的歲時祭儀非常謹慎而繁複。舉世聞名的祈禱小米豐收歌（Pasibutbut）就是在小米播種祭之後，祈求農作豐收所唱的歌謠。","u":"https://tmi.openmuseum.tw/muse/digi_object/7b4c8229f5b9c87c6dfeb2f2bd193fb5"},{"n":150,"c":"G2","s":"請問主要居住在南投縣日月潭的臺灣原住民族，是下列哪一族？","o":["鄒族","邵族","卑南族","賽德克族"],"a":1,"e":"參考資料：原住民族委員會網站邵族主要居住在南投縣魚池鄉伊達邵部落和水里鄉大坪林聚落，其中伊達邵部落至今仍然嚴謹地遵循傳統祖靈信仰，傳統祖靈信仰以Ulalaluan（祖靈籃）為供奉對象，具體象徵祖靈之存在，並且供奉於各家戶內。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/3343FD21497CA007D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":151,"c":"H1","s":"過去隱身在阿美族中的撒奇萊雅族，是在下列哪一歷史事件中，與清軍發生衝突？","o":["加禮宛事件","太魯閣事件","七腳川事件","大分事件"],"a":0,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈從「紀念 1878」紀念碑與族裔的戰役歷史詮釋對話〉光緒初，清帝國覬覦臺灣東土揮軍侵略。一八七八年農曆五月初一，撒奇萊雅族與噶瑪蘭族埋石締盟共禦外侮。九九重陽奇萊平野失守，文獻載為「加禮宛事件」。兩族史觀自主，各以「達固部灣戰役」及「加禮宛戰役」謂之。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/443"},{"n":152,"c":"H2","s":"七腳川事件為阿美族與清軍衝突的歷史事件，請問該事件主要發生在哪個縣市？","o":["花蓮縣","台東縣","宜蘭縣","屏東縣"],"a":0,"e":"參考資料：愛學網補充教材-原住民族重大歷史事件(講義第 4頁)今日花蓮市、吉安鄉一帶大致上是阿美族人分布的北界。在遼闊的奇萊平原，七腳川社實力雄厚，直到 20 世紀初仍然十分活躍。","u":"https://reurl.cc/3kjbQ8"},{"n":153,"c":"C","s":"在臺灣原住民族中，傳統服飾常以白色為底色，並點綴以菱形圖紋的，是哪一族群？","o":["泰雅族","布農族","西拉雅族","太魯閣族"],"a":3,"e":"參考資料：原住民族事典-太魯閣族服飾太魯閣族的服飾以輕、薄、素、淨著名，服飾多半以白色苧麻為底，局部織以色線形成紋樣。紋樣多以菱紋為主，並以單獨的形式出現。","u":"https://aborgpedia.alcd.center/detail?id=10051&search=&cat=0&race=0&writer="},{"n":154,"c":"C","s":"下列何者的傳統家屋，主要以石板為建材？","o":["賽夏族","布農族","西拉雅族","排灣族"],"a":3,"e":"參考資料：【島嶼說書人】圖解台灣建築史系列——來去部落住一晚（卷一）石板屋的材料——板岩盛產在中央山脈南側和玉山山脈，板岩經風化崩解，在河床或山坡上就可以直接用人工採集。除了大家熟知的排灣族以外，魯凱族和布農族也因為居住地盛產板岩且氣候溫差大，而使用石板作為建材。","u":"https://vocus.cc/article/5a1219dceceaed97b4026654"},{"n":155,"c":"E","s":"阿美族會以石頭烹煮魚湯，暱稱「石頭火鍋」。請問這裡的「鍋」是指什麼呢？","o":["平底鍋","鐵鍋","檳榔葉鞘","湯鍋"],"a":2,"e":"參考資料：原住民族委員會網-阿美族捕魚與狩獵所獲得的魚類與獸肉，為阿美族人食物中的蛋白質來源，其中獨具風味的石頭火鍋烹飪法與醃肉（siraw）非常具有文化特色。石頭火鍋是將高熱的石頭，丟入以檳榔葉做成的鍋子（cifar/kadong）當中，用以烹煮鍋內魚蝦，相當具有民族風情；保存肉類而醃製的山豬肉 siraw，也因氣味獨特而具有代表性。","u":"https://reurl.cc/53GbNz"},{"n":156,"c":"C","s":"太魯閣族的男人除了善於狩獵以外，還有一項技能非常重要且實用，請問是什麼？","o":["藤編","織布","捕魚","砍樹"],"a":0,"e":"參考資料：花蓮縣萬榮鄉原住民文物館介紹藤編，是太魯閣族的生命印記，從大自然取得藤，太魯閣族男子拿著一把刀、一支錐子、一支小木鑽，將一條條的藤分解、拆開，編織成各種生活重要的器具，編織的過程繁瑣，也凸顯太魯閣族男子豪邁強悍的個性，卻擁有溫柔的心，珍惜置放在裡面的食物或物品，即使藤編耗費的時間良久，依然專注、不懈怠。","u":"https://lcm.tacp.gov.tw/index.php?inter=info&category=3&museum=17&menu=photo&did=238"},{"n":157,"c":"A","s":"口簧琴、木琴、獵首笛，這三種傳統樂器，常見於下列哪一族群的生活世界？","o":["太魯閣族","布農族","達悟族","阿美族"],"a":0,"e":"參考資料：1.新聞〈復振太魯閣族傳統樂器 融合信仰承先人智慧〉哈尤牧師蒐集了四種太魯閣族傳統樂器，分別是口簧琴、四弦琴、木琴、獵首笛。除了獵首笛外，早期這三種樂器為的是傳情與娛樂，在保守的年代透過音樂把愛慕的心意表達出來，而獵首笛則是當時宣揚戰功的樂器，牧師卻不受傳統限制，讓這些樂器應用在現代生活中。2. 蹲點日誌 - 花蓮魯巴斯部落 - 【魯巴斯日記第十八章｜太魯閣族三大傳統樂器】在早期，太魯閣族每個部落製作獵首笛的方式有些不同，主要是以山上的竹子為主，不限定竹子的種類，不過一般仍以桂竹為主。","u":"https://www.goodtv.tv/watch?episode=72945https://youth.chtf.org.tw/diary/14907"},{"n":158,"c":"A","s":"口簧琴、獵首笛這兩種傳統樂器，通常以何種材質製成？","o":["藤","桂竹","麻竹","塑膠"],"a":1,"e":"參考資料：蹲點日誌 - 花蓮魯巴斯部落 - 【魯巴斯日記第十八章｜太魯閣族三大傳統樂器】在早期，太魯閣族每個部落製作獵首笛的方式有些不同，主要是以山上的竹子為主，不限定竹子的種類，不過一般仍以桂竹為主。","u":"https://youth.chtf.org.tw/diary/14907"},{"n":159,"c":"C","s":"排灣族人進行傳統編織時，常以何種植物編織草蓆？","o":["藤","桂竹","麻竹","月桃"],"a":3,"e":"參考資料：國家文化藝術基金會網站〈排灣族過往生活月桃編器之款型、使用性族語紀錄與複製〉排灣族傳統月桃編織（cempu ta ngat）是一種深植於生活中的平民工藝，採集葉鞘經曬乾、剝離、理纖後，編織成草蓆、籃子、背籃及箱子，廣泛用於日常收納與祭儀，甚至有「從出生到死亡」陪伴族人一生的重要性，展現了對自然的智慧與對環境的敏銳觀察。","u":"https://archive.ncafroc.org.tw/result?id=3ae9bac845644ee3a2f9d155c032737a"},{"n":160,"c":"E","s":"哪一個原住民族群的習俗是男人上山狩獵之前，妻子會準備「阿里鳳鳳」給男人作為路上的飯包？","o":["布農族","泰雅族","阿美族","雅美族"],"a":2,"e":"參考資料：新聞〈原民粽子意義大不同 「阿里鳳鳳」等於愛心便當〉「阿里鳳鳳」（阿美語 alifongfong）在阿美族的傳統社會中，妻子會準備給外出耕種的丈夫，因此也被稱為「情人粽」，做法是先將採集的葉子去除葉骨跟刺，編織成袋狀，再將糯米、鹹豬肉等內餡放入，經過蒸煮後就成為特別的愛心便當。","u":"https://www.cna.com.tw/news/ahel/202206020350.aspx"},{"n":161,"c":"E","s":"阿美族「阿里鳳鳳」的飯包是以什麼植物編織而成呢？","o":["藤","月桃","箭竹","林投葉"],"a":3,"e":"參考資料：新聞〈林投葉挑選有學問 阿里鳳鳳飄香原民文物館〉族人會先採摘林投葉，並且編織成小籃子的外殼，然後再將糯米原料放進去，置入鍋裡蒸煮後，煮出來的阿里鳳鳳，有林投葉的清香。","u":"https://www.ipcf.org.tw/zhTW/News/Detail?newsId=20200901203852692"},{"n":162,"c":"G2","s":"花蓮新城火車站附近，最可能聽到下列哪一族群的語言？","o":["卑南語","排灣語","鄒語","太魯閣語"],"a":3,"e":"原住民族委員會網站太魯閣族人（Truku）在十七、十八世紀往東越過了中央山脈的奇萊山、能高山、合歡山，到達臺灣東部的花蓮地區，在東部建立了新的家園。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F0736660B8023670D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":163,"c":"C","s":"請問使用香蕉絲製作衣服的臺灣原住民族中的哪一族呢？","o":["噶瑪蘭族","撒奇萊雅族","布農族","泰雅族"],"a":0,"e":"參考資料：1.花蓮縣文化局網噶瑪蘭族香蕉絲編織在原住民族傳統藝術中具特殊性、唯一性，不只有傳承，亦有創新。一方面是目前唯一保留、使用此特殊材料與編織方式的族群2.微笑台灣專欄文章〈一絲一縷織起噶瑪蘭族記憶，花蓮豐濱「新社香蕉絲工坊」傳承失而復得的工藝文化〉香蕉遍布我們的日常生活，除了果實可食，其莖幹更織就了噶瑪蘭族的文化。位於花蓮豐濱的新社香蕉絲工坊，藝師嚴玉英將噶瑪蘭族的過去、現在與未來化作香蕉布上細緻的紋理，就算再艱辛，也要如香蕉絲般既柔且韌，讓傳統技藝永遠流傳下去。","u":"https://www.hccc.gov.tw/zh-tw/CulturalHeritage/Detail/202https://smiletaiwan.cw.com.tw/article/5941"},{"n":164,"c":"G2","s":"請問戰績輝煌的紅葉少棒隊成員，主要居住在哪一縣市及鄉鎮？","o":["台東縣豐濱鄉","花蓮縣萬榮鄉","南投縣仁愛鄉","台東縣延平鄉"],"a":3,"e":"參考資料：期刊〈「紅葉奇蹟」：臺東紅葉少年棒球隊的緣起（1965–1968）〉紅葉國小位於台東縣延平鄉的紅葉村，是蘊育打敗日本關西少棒聯盟和歌山調布隊的紅葉少棒的發源地。在 1960年代，它是個全校人數不及百人的小學校。1963年時，校長林珠鵬興起成立正式棒球隊的想法，並邀請當時的紅葉村幹事古義擔任義務教練，組成了紅葉少棒隊。","u":"https://ws.th.gov.tw/002/TH/tjpdf20241015/var/www/html/new_site/05publish/03publishquery/02journal/tj/401063109.pdf"},{"n":165,"c":"E","s":"太魯閣族人和泰雅族人，在過去沒有水管的年代，主要是使用何種材料來引水呢？","o":["樹皮","桂竹","山棕","山黃麻"],"a":1,"e":"參考資料：國立中央大學新聞網【大城小事】有泰雅族的地方 就有桂竹桃園市復興桂竹產業發展協會專員陳秉宏 Botu Cawmin 是擅長樂器的原鄉青年，以恍若歌謠的語調述說泰雅族人與竹的密不可分。「如果你喜歡一個女生，就把竹子做的口簧琴掛在她家門口。」他說，過去以桂竹建造家屋，取水引水、製作食器，也因著對音樂與儀式的重視，族人都有竹製口簧琴。","u":"https://ncusec.ncu.edu.tw/news/press_content.php?P_ID=34244"},{"n":166,"c":"C","s":"在太魯閣族傳統建築當中，經常用來綑綁樑柱的繩索，是由何種植物做成的？","o":["月桃","黃藤","葛藤","苧麻"],"a":1,"e":"參考資料：臺灣原住民族事典-黃藤黃藤對太魯閣族來說，poli（藤心）為感恩祭的祭品之一，以表達對祖靈的感恩、祈求庇佑、期望隔年豐收。藤心可生食解渴，或加果實煮湯，果肉味酸。果實、藤心煮湯可治頭痛、降高血壓，藤心湯可治拉肚子。藤心可販售。藤皮、藤片可做建材、綁梁柱。","u":"https://aborgpedia.alcd.center/detail?id=9675&search=%E7%8B%A9%E7%8D%B5&cat=0&race=0&writer="},{"n":167,"c":"E","s":"黃藤過去常被泰雅族用來綑綁物品、編織，以及製作陷阱。泰雅族人使用黃藤的主要原因是？","o":["韌度強","彈性高","密度高","很輕巧"],"a":0,"e":"參考資料：臺灣原住民族事典-黃藤藤皮耐用、不易腐爛，可做繩材，綁梁柱、屋簷支架，也可做獵具、刀柄、背籃、衣簍、濾酒器、煙斗、藤包、織布用的裝線籃、抓魚魚簍、帽子、裝飾品。將藤皮搓揉成繩索作為套索，藤條用火燒彎，可做大型動物陷阱。","u":"https://aborgpedia.alcd.center/detail?id=9675&search=%E7%8B%A9%E7%8D%B5&cat=0&race=0&writer="},{"n":168,"c":"E","s":"在太魯閣族傳統家屋中，常在三石灶上方設置架子，其主要的功能是？","o":["煙燻獵物","防蚊","防臭","乾燥"],"a":0,"e":"參考資料：Rqda三石灶—太魯閣族傳統建築元素太魯閣族部落的房屋，過去主要的建材為木頭、竹子及茅草等，竹屋內部一定會設置升火的 Rqda，其石頭選擇標準要硬且不易碎，三石灶除了升火取暖、煮飯及煙燻獸肉，火的熱氣及煙霧同時能去除溼氣，房屋不易腐爛，延長房屋的使用期限。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Place&id=606000"},{"n":169,"c":"G2","s":"太魯閣族有個部落名稱叫做道拉斯，意思是「懸崖」。請問該部落的名稱和何項特質有關？","o":["形狀","高度","地形","長度"],"a":0,"e":"參考資料：花蓮觀光資訊網太魯閣族的「道拉斯」（Toras/Tulas）常指錐麓古道著名的「錐麓大斷崖」（Zhuilu Cliff），這是一條由立霧溪切割大理岩形成、近乎垂直的絕險懸崖步道，垂直落差高達 700-800 公尺，是日治時期合歡越嶺古道最艱險的路段，目前為需申請許可才能進入的熱門景點。","u":"https://tour-hualien.hl.gov.tw/TourContent.aspx?n=79&s=1468"},{"n":170,"c":"E","s":"臺灣原住民族部落的耕地中，常見種植小米的小米田。之所以如此，其原因不包括下列何者？","o":["小米是臺灣原住民族的傳統主食之一","臺灣原住民族的歲時祭儀常和小米有關","臺灣原住民族的神話故事中常出現小米","小米的種植成本很低"],"a":3,"e":"參考資料：原住民族農產業主題館-小米小米適合在乾旱而缺乏灌溉的地區生長，臺灣海拔 2,000公尺以下的山地都可栽培小米，台灣的小米主要栽種於山地部落，以花蓮、台東、高雄及屏東等地區栽培最多。利用：小米是原住民重要的糧食作物，可供作煮飯、煮粥、釀酒、糕餅、點心等，其莖、稈、穀可當餵養家畜的飼料。除此之外，小米被原住民視為最神聖的作物，在宗教上具有獨特的重要性，所有的農耕儀式都與小米有關，尤其小米酒是慶典中不可缺少的祭品。","u":"https://kmweb.moa.gov.tw/subject/subject.php?id=39490"},{"n":171,"c":"E","s":"當小米田常有麻雀飛鳥前來啄食。請問臺灣原住民族常以什麼來驅趕前來啄食的鳥類？","o":["口簧琴","趕鳥器","稻草人","木琴"],"a":1,"e":"參考資料：國家文化記憶庫網趕鳥器，以竹製成，也名為竹響器、驅鳥器等，多為原住民使用，作為驅趕鳥群的農具。趕鳥器由竹管製成，前後端需有節，中間部分挖空成共鳴箱，使用時以木棒敲打竹管，利用敲擊所發出的聲響趕走田裡偷食穀物的鳥。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=MOCCOLLECTIONS&id=11000029614"},{"n":172,"c":"G2","s":"阿森想要了解布農族的文化，因此準備拜訪布農族部落。請問阿森不會到下列哪一個部落訪問？","o":["望鄉部落","太平部落","馬遠部落","大鳥部落"],"a":3,"e":"參考資料：大鳥部落位於臺東縣大武鄉大鳥村，地處中央山脈南段支脈之河谷平原。大鳥的排灣族地名為「pa chava」，意指「有障礙物的地方」，部落約逾 1,200位居民，多屬東排灣族，產業以農業為主，菸草（tjamaku）曾經是主要作物之一。","u":"https://harvestwisdom.openmuseum.tw/hw/community/19ce5e906e608f591db301f15d36a216"},{"n":173,"c":"G2","s":"阿豪採香菇必須要經過南澳古道，才能到達他的工寮。請問他最有可能是臺灣原住民中的哪一族？","o":["布農族","泰雅族","魯凱族","賽德克族"],"a":1,"e":"參考資料：台灣山林悠遊網南澳古道位在南澳鄉金洋村，是通往泰雅族舊部落的路徑之一，為「舊武塔古道」的一部分，也是泰雅族的傳統獵場。自旋檀駐在所遺址起，循南澳南溪上溯至古道終點，至合流溪與南澳南溪匯流口，共3.8 公里。沿途平緩好走，野生動植物生態豐富，沿途有吊橋遺址、警備道路基等遺跡。","u":"https://recreation.forest.gov.tw/Trail/RT?tr_id=002"},{"n":174,"c":"G2","s":"請問錐麓古道是臺灣原住民族中哪一族的傳統居住領域？","o":["太魯閣族","撒奇萊雅族","卡那卡那富族","賽德克族"],"a":0,"e":"參考資料：太魯閣國家公園網錐麓古道是太魯閣國家公園境內唯一的史蹟保存區，早期為太魯閣族各部落間的聯繫要道，承載著族人生活與抗日血淚史。日治時期被拓寬為「合歡越嶺道路」的一部份，以管理原住民，並見證了巴達岡部落等歷史遺址。","u":"https://www.taroko.gov.tw/AttractionTrailContent.aspx?s=48&n=5706&sms=11275"},{"n":175,"c":"S","s":"在太魯閣族傳統文化裡，三石灶代表的是「一家人」。請問下列何者是三石灶所象徵的家庭成員？","o":["叔叔、舅舅、姪子","爸爸、媽媽、孩子","哥哥、姊姊、弟弟","姊姊、妹妹、弟弟"],"a":1,"e":"參考資料：一顆標準的三石灶(Rqda)一定要有大中小三個石頭，分別代表爸爸、媽媽和小孩，象徵一個家庭的組成。Rqda有很多功能，可以用來烤火取暖、烹煮燻烤食物、去除濕氣、杜絕蚊蟲，甚至可以用來儲存食物。","u":"https://akayplaylife.com/2024/07/07/biyi/"},{"n":176,"c":"R","s":"阿明想知道朋友是山地原住民或是平地原住民。請問下列何項資訊，最有助於了解朋友的身份？","o":["新朋友的原鄉部落","新朋友的身高","新朋友的體重","新朋友所屬部落的建築樣式"],"a":0,"e":"參考資料：法規名稱：原住民身分法第 2 條本法所稱原住民，包括山地原住民及平地原住民，其身分之認定，除本法另有規定外，依下列規定：一、山地原住民：臺灣光復前原籍在山地行政區域內，且戶口調查簿登記其本人或直系血親尊親屬屬於原住民者。二、平地原住民：臺灣光復前原籍在平地行政區域內，且戶口調查簿登記其本人或直系血親尊親屬屬於原住民，並申請戶籍所在地鄉（鎮、市、區）公所登記為平地原住民有案者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130001"},{"n":177,"c":"S","s":"請問以下哪一種植物被魯凱族人視為具有崇高地位？","o":["蘭花","紫羅蘭","玫瑰花","百合花"],"a":3,"e":"參考資料：原住民族委員會網站魯凱族社會的特色為任務分工縝密的階級制度，融入婚姻、政治、宗教、祭祀與藝術各領域。以百合花為「魯凱族族花」，文化核心價值以百合花的配飾權最富特色，具有表彰聖潔、膽識、勇氣與尊榮的意義，經濟生活以小米種植為主體，小米收穫祭為最重要的祭典。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/409F703B4E592A82D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":178,"c":"C","s":"在排灣族家中的裝飾物裡，具有儀式神聖性質的圖像為？","o":["百步蛇","青銅刀","石板","木雕"],"a":0,"e":"參考資料：排灣族的起源——百步蛇娶妻排灣族認為自己是「百步蛇的子民」，除了服飾和工藝品上有百步蛇紋飾，相關的故事（例如排灣族的起源）也充滿傳奇色彩。","u":"https://ascdc.digitalarchives.tw/subject_3083.html"},{"n":179,"c":"M","s":"請問以下哪一個魯凱族部落號稱「雲豹的故鄉」？","o":["古茶布安","馬里巴西","米哈拉西","摩莉莎卡"],"a":0,"e":"參考資料：國家文化資產網魯凱族的好茶聚落位於霧台鄉西南隅，南隘寮溪北側。好茶原稱「Kochapongan」，根據移川子之藏的資料，在 1650年荷蘭的古文書上記載了七個社名，及包括舊好茶的舊稱「Kochapongan」（古茶布安），則可證明好茶社於 350年前已經確實存在。","u":"https://nchdb.boch.gov.tw/assets/overview/monument/19910524000003"},{"n":180,"c":"G2","s":"哪一條古道是台灣年代最悠久、越嶺點最低、使用率最高的歷史步道？","o":["八通關古道","浸水營古道","阿朗壹古道","草嶺古道"],"a":1,"e":"參考資料：台灣山林悠遊網浸水營國家步道西起屏東縣枋寮鄉的水底寮，終至東端的台東縣大武鄉的加羅板部落，為台灣所有橫越中央山脈古道中，越嶺點最低、使用頻率最高，且使用時間最長的古道。","u":"https://recreation.forest.gov.tw/trail/RT?tr_id=170"},{"n":181,"c":"E","s":"阿華走在路上，看到一群婦女在一塊草叢間採集野菜。請問這些婦女最可能屬於下列哪一族群？","o":["阿美族","泰雅族","鄒族","道卡斯族"],"a":0,"e":"參考資料：原住民族委員會網阿美族因為植物採集知識的豐富，而善於將野菜應用於飲食中，因此又被戲稱為吃草的民族，部落中常見的野菜與植物有檳榔（’icep）、毛柿（kamaya/kafohongay）、麵包樹（apalo/facidol）等。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":182,"c":"R","s":"阿明在《新北市地圖》上發現一處名為「溪洲部落」的地方。請問這是指下列哪個族群的領域？","o":["布農族","泰雅族","魯凱族","阿美族"],"a":3,"e":"參考資料：原住民族電視台新聞報導〈終於有個家 溪洲部落爭取 14年的居住正義〉位於台北新店溪旁的溪洲部落，住著一群來自部落的阿美族人，40多年來在此落地居住。然而從 2007年開始，政府以部落居住地位於行水區範圍內 lenaf，要拆除族人建造 40 幾年的房屋，並且要部落異地安置，溪洲部落多次跟政府談判 mita^ta，抗爭mico&#x27;a&#x27;ang，抗議miliyang，陳情milongoc，為的是要爭取原住民族在都會區生存的權利，終於 2008年出現轉機，當時的台北縣政府政策轉向，跟族人進行對等協商，2014年，跟新北市政府達成協議以 333政策，參與式的方式建造，溪洲部落終於在抗爭 14年後，離舊部落不到 100公尺的新基地蓋起了房子，多年懸掛的心終於安定了","u":"https://www.ipcf.org.tw/-/News/Detail?newsId=24040820453599187"},{"n":183,"c":"R","s":"下列哪一所學校是八八風災後重建的布農族小學？","o":["巴楠花部落中小學","都達國小","豐濱國小","德拉楠實驗小學"],"a":0,"e":"參考資料：親子天下專欄文章〈巴楠花部落中小學：不只原民文化更是多元文化試驗所〉","u":"https://premium.parenting.com.tw/article/5097923"},{"n":184,"c":"F","s":"以下何為達悟族最具代表性且和造舟很有關係的祭典？","o":["捕鳥祭","祖靈祭","驅魔祭","飛魚祭"],"a":3,"e":"參考資料：蘭嶼部落文化基金會分為飛魚招魚祭、飛魚收藏祭、飛魚終食祭。從每年二至三月舉行的飛魚招魚祭到九月的飛魚終食祭為止都可以說是飛魚季，正值春夏時節，適於出海，飛魚與飛魚乾也為這時期的主要食物。","u":"https://www.taofoundation.org.tw/story/ceremony.html"},{"n":185,"c":"F","s":"對阿美族人來說，除了豐年祭以外，最能發揮陷阱製作功力並展現捕獲量的祭典，是下列何者？","o":["趕鳥祭","捕鳥祭","捕魚祭","小米祭"],"a":1,"e":"參考資料：花蓮縣吉安鄉公所吉安鄉，固定每年冬天會舉辦南勢阿美族獨具特色的 Malahuk tu liliw捕鳥祭歲時祭儀盛典。祭典期間，吉安鄉 19個部落將陸續展開捕鳥祭活動，祈願來年農作豐收。捕鳥祭為北花蓮地區南勢阿美族群獨有的傳統活動，新城、花蓮、吉安、壽豐等地區的南勢阿美族人每年皆會舉行。農忙時期，各部落會組成名為 Paliw 的農耕團體，於秋收之後集體上山狩獵多日，利用陷阱與傳統繩索工具捕捉害鳥，也鼓勵族人前往田間參與。族中耆老告訴孩子們：將害鳥捕光，明年田地耕作就會豐收滿滿，象徵著祖輩對土地的理解與敬天感恩的精神。","u":"https://www.ji-an.gov.tw/news/66IeWVlqC0IF"},{"n":186,"c":"R","s":"原住民族常提出改回原住民古地名的議題，請問針對這個議題討論時，下列何者是較正確的態度？","o":["尊重原住民族意願，透過討論取得共識","不要更改以省去麻煩","採用多數人習慣的名稱即可","不理不睬"],"a":0,"e":"參考資料：原住民族文獻網-期刊〈原住民族歷史轉型正義—空間之歷史記憶的建構〉作者/林素珍-國立東華大學族群關係與文化學系副教授，阿美族人，主要專長臺灣原住民族歷史和文化，擔任原住民族歷史轉型正義之歷史主題工作小組召集人。轉型正義是民主國家對過去獨裁政府實施的違法和不正義行為的彌補，通常具有司法、歷史、行政、憲法、賠償等面向。其根本基礎在還原歷史真相。2016 年8月1日「原住民族日」，蔡英文總統代表政府，首次就 400年來臺灣原住民族承受的苦痛和不公平待遇，提出正式的道歉。當天，蔡總統宣布將設置「總統府原住民族歷史正義與轉型正義委員會」（簡稱原轉會）並親自擔任召集人，與各族代表共同面對歷史課題、對等協商後續政策方向。總統府原住民族歷史正義與轉型正義委員會之宗旨為實踐原住民族轉型正義，主要任務包含：揭露歷來因外來政權或移民導致原住民族權利受侵害、剝奪之歷史真相；對原住民族受侵害之權利，規劃回復或賠償措施；檢視對原住民族造成歧視或違反《原住民族基本法》之法律與政策，並提出修改建議；積極落實《聯合國原住民權利宣言》與各項相關之國際人權公約等。總統府公布原住民族歷史正義與轉型正義委員會，共有土地、文化、語言、歷史、和解等五個主題小組。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/434"},{"n":187,"c":"G2","s":"下列哪一條溪流的流域，是布農族的傳統領域？","o":["濁水溪","拉庫拉庫溪","楠梓仙溪","木瓜溪"],"a":1,"e":"參考資料：原住民族委員會文獻網(首頁/文獻電子期刊/期刊內容)期刊〈古道與命名：以拉庫拉庫溪流域為分析對象〉拉庫拉庫溪（Lakulaku）流域是花蓮縣卓溪鄉布農族（巒社群為主）的傳統領域與發源地，擁有豐富的石板屋舊聚落（如大分、佳心、喀西帕南）。此地曾發生著名的抗日「大分事件」，族人於 1934 年被日人迫遷下山。近年透過政府「再造歷史現場」計畫，致力於復原傳統石板屋技藝、修復舊社，並培訓在地族人文化自主力。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/316"},{"n":188,"c":"G1","s":"請問下列哪一族不屬於泛泰雅族？","o":["泰雅族","太魯閣族","賽德克族","拉阿魯哇族"],"a":3,"e":"參考資料：〈泛泰雅族群文面圖形系統演化研究〉文‧圖-陳叔倬泰雅族下分為賽考列克亞群與澤列亞群，賽德克族/太魯閣族下分為德奇塔雅亞群、道澤亞群與托魯閣亞群。","u":"https://libknowledge.nmns.edu.tw/nmns/upload/lib/000005630/209000c/3.pdf"},{"n":189,"c":"C","s":"卑南族的服飾圖紋，主要以何種方式製作？","o":["鉤織","十字繡","織布機","縫紉機"],"a":1,"e":"參考資料：臺灣原住民族事典-卑南族服飾卑南族的傳統服飾以紅色、黃色、綠色為主色調，常見圖案包括菱形、十字、三角形、其他幾何圖形。所使用的材料多為單色棉布、十字繡底布、花布，透過羊毛線、刺繡線或化學纖維線材，以織或繡的技法製作圖紋裝飾。","u":"https://aborgpedia.alcd.center/detail?id=10047&search=&cat=0&race=0&writer="},{"n":190,"c":"H1","s":"下列哪一項事件的發生，促使清廷在治理臺灣的態度由消極轉為積極，更加速了建設臺灣的腳步？","o":["大嵙崁社事件","加禮宛事件","牡丹社事件","大港口事件"],"a":2,"e":"參考資料：原住民族委員會-原住民族文獻網站期刊〈牡丹社事件的地圖史料與空間探索（上）〉1871 年11月，琉球宮古島的船隻途遇暴風，漂流到臺灣恆春半島東海岸的八瑤灣（日本記此地有高士佛港，今滿州鄉港子、九棚一帶），54名船員被當地排灣族高士佛社原住民殺害。由於琉球也向薩摩進貢，為中、日雙屬的藩屬國，後來日本入侵臺灣，就以此事為由。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/99"},{"n":191,"c":"H1","s":"下列何項衝突事件並非發生在日治時期？","o":["苗栗事件","霧社事件","大港口事件","焦吧哖事件"],"a":2,"e":"參考資料：原住民族文獻網期刊〈阿美族遭逢外來政權的二個歷史事件〉1875 年之後，東部原住民開始頻繁密切的接觸外來勢力，移入者不斷與原住民有所衝突，原住民的強烈反抗，使得開山軍隊不斷增兵，繼而發生了東部原住民捍衛生存空間反抗清廷之事件。以阿美族而言最具代表性的事件即大港口事件（奇密社之役）。根據清廷方面文獻的記載，光緒 3年（1877）7月，因練勇前、左兩營陸續到來，駐兵也分布到水尾以北各地；此時，位於水尾附近的烏漏社首先發難抗清，清兵攻破烏漏社，但因阿棉山、納納等社也加入戰局「突有另股繞後狙擊，以致先勝後挫（註 1）。 」整個事件始末，起於 1877年後山駐軍統領吳光亮，開闢自水尾（今花蓮縣瑞穗鄉）至大港口（今花蓮縣豐濱鄉）道路。附近之奇密社（今瑞穗鄉奇美村）不服，殺總通事林東涯以叛。8月吳光亮以營官林福喜彈壓，抵烏雅立社（今瑞穗鄉岡村），中伏潰敗。奇密社與大港口南岸之納納社（今豐濱鄉靜浦村）南北相應，聲勢龐大。清廷乃急調北路統領孫開華率兵二營，總兵沈茂勝率兵一營，及臺灣知縣周懋琦率砲隊，分海路增援，阿美族人不敵逃散。奇密社事件主戰場都在大港口（Makotaay）一帶的東海岸，參戰的也都是大港口阿美族的祖先，所以有人以「大港口（Cepo’）事件」或「靜浦事件」稱之。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/248"},{"n":192,"c":"H2","s":"日治時期，設立了「蕃童教育所」。這機構的設立，與日本政府何項政策有關？","o":["皇民化政策","專賣制度","理番政策","地方制度改正"],"a":2,"e":"參考資料：臺灣原住民族事典「蕃童教育所」為日本時代台灣總督府所劃定特別行政區域內的初等教育機構。台灣總督府為開發山林資源，有效掌控山地部落，並培養未來的協力者，自 1896年（明治29 年）4月實施民政後，即開始思量如何有效管控蕃地特別行政區，負責單位也由民政局殖產部，經撫墾署、辨務署、警察本署、蕃務本署再到警務局。","u":"https://aborgpedia.alcd.center/detail?id=11641&search=&cat=0&race=0&writer="},{"n":193,"c":"R","s":"阿美族許多族人為了就業方便遷移至大都市，請問目前下列哪一直轄市的阿美族人口最多？","o":["新北市","基隆市","桃園市","台中市"],"a":2,"e":"參考資料：內政部全球資訊網115 年第8週內政統計通報(114年底原住民人口數 62.9萬人，較113 年底增加 2.9％)：各縣市原住民人口數以花蓮縣 9.5萬人（占15.1％）最多，桃園市 9.0萬人（占 14.3％）次之；2縣市原住民人口均以阿美族居多。","u":""},{"n":194,"c":"E","s":"原住民傳統飲食漸漸成為許多人喜愛的美食。下列何者並非臺灣原住民族的傳統美食？","o":["Cinavu（小米粽）","Alifongfong（林投粽）","Kao niaoma~mwung（芒果糯米飯）","Hlama blbul（香蕉飯）"],"a":2,"e":"參考資料：世界美食城-網路文章〈掀起泰國文化認同潮！認識知名甜點「芒果糯米飯」〉芒果糯米飯被定位為泰國甜點，不過要追溯起源的話，會發現比起在地甜點，芒果糯米飯更像是把異國食材在地化的結晶。芒果最初生長在南亞及緬甸一帶。糯米料理則起源自泰國東北依善地區和寮國，因此糯米飯在寮國也十分常見。","u":"https://wgp.circlelinks.net/topic/174"},{"n":195,"c":"F","s":"哪一個原住民族在新船下水時，會舉行盛大的祭典活動，讓參與的各方都會送上祝福?","o":["噶瑪蘭族","撒奇萊雅族","雅美族","卡那卡那富族"],"a":2,"e":"參考資料：國家文化資產網〈雅美(達悟)族大船下水祭〉大船落成禮（mapabosbos）包括前期的採收芋頭，到各部落邀請親友參加盛典。落成禮第一天，在大船內外堆放芋頭，迎賓，終夜祝賀歌會，晚餐。第二天一早，進行分芋頭和分豬肉。然後是震撼的 Manwaway（蠻阿威，蓄積力量）和 Mapatotalaw（拋船儀式）。如此數次直到抵達海邊，開始 Mangavang（試航，測航速）。結束後，把大船拖回岸上。第三天會舉行 1個小型餐會，成員並將新船划出去，划到一個定點，接回盛裝的船長夫人所送的幸運小米，代表給予漁團永久的祝福。","u":"https://nchdb.boch.gov.tw/assets/overview/folklore/20110510000004"},{"n":196,"c":"R","s":"原住民族目前分為「平地原住民」與「山地原住民」。這樣的分類方式，最早是與日本時代的什麼政策有關？","o":["人口政策","教育政策","土地政策","語言政策"],"a":2,"e":"參考資料：1. https://www.cip.gov.tw/zh-tw/news/data-list/C6DFB32460630CF4/0C3331F0EBD318C213147655B37A59D5-info.html行政院 91年4月16 日院臺疆字第 0910017300號函同意核定「原住民地區」包括 55個鄉(鎮、市)94 年2月5日公布施行之「原住民族基本法」所定義之「原住民族地區」，承襲上開行政院函文意旨及所核定之「原住民地區」具體範圍，於原住民族基本法第 2條第3款之立法理由明揭「『原住民地區』之定義依據原住民族工作權保障法第 5條第 4項規定，係指『原住民族傳統居住，具有原住民族歷史淵源及文化特色，經本院原住民族委員會報請本院核定之地區。』，本法從之，另本院業已核定上開地區包括 30個山地鄉及 25個平地原住民鄉（鎮、市），共 55個鄉（鎮、市）。2. https://www.mayawbiho.tw/plain馬曜比吼文章〈什麼是平地原住民？〉1945年以後中華民國政府將原住民分布地區分為「平地鄉」與「山地鄉」，將原住民依照行政區域分為「平地原住民」和「山地原住民」，前者直到 1983年才開始有原住民保留地。許多族群被一分為二，許多選舉例如縣市議員和立法委員選舉都以「平地原住民」/「山地原住民」的分類規定名額，人數較少或是被分割的族群常常很難選出自己族群的代表。對原住民族比較合理的分類是族群分類，對原住民選區比較合理的分區是族群代表制，讓族人選出能夠代表自己族群的民意代表，讓民意代表真的代表族群，而不是代表 70 年前的行政區劃。","u":""},{"n":197,"c":"P","s":"臺灣平埔族包含了西拉雅族、噶瑪蘭等族。下列各平埔族與其傳統領域的配對，何者不正確？","o":["西拉雅族-台南市、嘉義縣","馬卡道族-高雄市、屏東縣","噶瑪蘭族-基隆市","凱達格蘭族-基隆市、台北市、新北市、桃園市"],"a":2,"e":"參考資料：原住民族委員會網傳說噶瑪蘭族人最早由南方島嶼，途經地名為 Sanasai 的地方後遷入臺灣，落腳於蘭陽平原，十九世紀初開始遷居到花蓮臺東海岸。噶瑪蘭族原來在蘭陽平原共有 30 多個部落，十八世紀末漢人開始進入蘭陽平原。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/7088C08FB51F3383D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":198,"c":"S","s":"臺灣原住民族各族的繼承制度相當多樣，下列有關各族群繼承制度的配對，何者有誤？","o":["阿美族-長女繼承","排灣族-長嗣繼承","魯凱族-長嗣繼承","泰雅族-長子繼承"],"a":2,"e":"參考資料：臺灣原住民族文化知識網 社會制度家庭是魯凱族最重要的親族單位，魯凱族家庭採用偏向於長男繼承的雙系繼承法則，由家中長男繼承家屋、家名，其餘子女婚後必須遷出，若是家中無男性則由女性招贅繼承。婚姻方面以一夫一妻制的嫁娶婚姻為主，擇偶對象務求門當戶對，首先考慮階級身分，以雙方階級相同的「同級婚」最為族人所接受。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=5C6D65F83BD80BCF&sms=1D81A96ECBE66C8E&s=402C4B90132A411E"},{"n":199,"c":"G1","s":"世代居住在花蓮縣豐濱鄉阿美族的Kacaw 應該報名哪一個原住民族語言能力認證測驗最為適合呢？","o":["恆春阿美族語","秀姑巒阿美族語","海岸阿美族語","南勢阿美族語"],"a":2,"e":"參考資料：族語E樂園網站公告「臺灣原住民族 16族語42個方言之分布參考表」","u":"https://reurl.cc/9WOlgv"},{"n":200,"c":"G1","s":"世代居住住在新北市烏來區烏來里的Watan 應該報名哪一個方言別最為適合呢？","o":["澤敖利泰雅語","四季泰雅語","賽考利克泰雅語","萬大泰雅語"],"a":2,"e":"參考資料：族語E樂園網站公告「臺灣原住民族 16族語42個方言之分布參考表」","u":"https://reurl.cc/kp76GK"},{"n":201,"c":"G1","s":"世代居住在台東縣達仁鄉土坂村的Saljeljeng 應該報名哪一個原住民族語言能力認證測驗最適合呢？","o":["北排灣語","南排灣語","東排灣語","中排灣語"],"a":2,"e":"參考資料：族語E樂園網站公告「臺灣原住民族 16族語42個方言之分布參考表」","u":"https://reurl.cc/kp76GK"},{"n":202,"c":"G1","s":"世代居住在台東縣海端鄉加拿村的Husung 應該報名哪一原住民族語言能力認證測驗最為適合呢？","o":["卓群布農語","丹群布農語","郡群布農語","巒群布農語"],"a":2,"e":"參考資料：族語E樂園網站公告「臺灣原住民族 16族語42個方言之分布參考表」","u":"https://reurl.cc/kp76GK"},{"n":203,"c":"C","s":"請問下列何者不是卡那卡那富族男性衣飾穿著與配件會有的項目？","o":["獸皮帽","藍腹鷴的長羽毛","情人袋","胸袋"],"a":2,"e":"參考資料：1.卡那卡那富族服飾 典藏者:臺南市札哈木會館 / 臺南市政府原住民族事務委員會2. 原住民族文獻期刊〈阿美族的’alofo〉阿美族為臺灣原住民族中人數最多的族群，因分布地廣，故雖為同一族群但服飾上卻有多種樣式，一般常以花蓮、臺東兩地做分界，但不同部落又有各自的特色。雖然如此，’alofo 卻是他們一致性的標誌，是傳統服飾中不可或缺的配件。收穫祭（豐年祭）是阿美族的重要祭典，每個部落舉辦日期不一，但在最後一天晚上的情人之夜中，’alofo 則具有傳達情意的功能，符合其「情人袋」的稱呼，不同部落做法也不相同，基本上是由女性放置檳榔在屬意的男子’alofo裡頭做為暗示。","u":"https://openmuseum.tw/muse/digi_object/ca8271ffd6c4f684ec39c04a2ca84a39https://ihc.cip.gov.tw/EJournal/EJournalCat/671"},{"n":204,"c":"C","s":"請問下列何者不是卑南族女性衣飾穿著與配件會有的項目？","o":["花環","肚兜圍裙","情人袋","絲帶"],"a":2,"e":"參考資料：1. 卑南族女性傳統服飾 典藏者:花蓮縣臺灣原住民族文化館女子傳統要纏頭巾、穿窄袖，下身穿開下襟的刺繡長裙和綁腿束膝褲。服飾以白、黑色上衣加上刺繡胸兜，和花色長裙。巫師有特別的紅色夾織披肩，後有彩色帶穗。青春期女生有花冠、項飾和長腰帶裝飾。現代材料和顏色有更多選擇，因此更精緻華麗。未婚女子會飾有一種五顏六色的彩帶在右肩後，叫「勒葛勒卡班」，代表美麗。2. 原住民族文獻期刊〈阿美族的’alofo〉阿美族為臺灣原住民族中人數最多的族群，因分布地廣，故雖為同一族群但服飾上卻有多種樣式，一般常以花蓮、臺東兩地做分界，但不同部落又有各自的特色。雖然如此，’alofo 卻是他們一致性的標誌，是傳統服飾中不可或缺的配件。收穫祭（豐年祭）是阿美族的重要祭典，每個部落舉辦日期不一，但在最後一天晚上的情人之夜中，’alofo 則具有傳達情意的功能，符合其「情人袋」的稱呼，不同部落做法也不相同，基本上是由女性放置檳榔在屬意的男子’alofo裡頭做為暗示。","u":"https://lcm.tacp.gov.tw/index.php?inter=info&category=3&museum=22&menu=relic&did=404https://ihc.cip.gov.tw/EJournal/EJournalCat/671"},{"n":205,"c":"F","s":"請問下列何者並非邵族重要之祭典？","o":["狩獵祭","拜鰻祭","五年祭","祖靈祭"],"a":2,"e":"參考資料：國家文化資產網〈臺東縣排灣族 Maljeveq(五年祭)〉Maljeveq 是排灣族最重要的祭儀，五年祭儀傳統上為5年舉行1次，故稱為五年祭。近代族人對於「ljeveq」一詞的探討，認為Maljeveq 原意是「要舉行神靈與祖靈的祭儀」，因此也有人將此稱為「人神盟約祭」。","u":"https://nchdb.boch.gov.tw/assets/overview/folklore/20090220000003"},{"n":206,"c":"G1","s":"下列何者是臺灣原住民族人數當中最多與最少的組合？","o":["阿美族；邵族","阿美族；撒奇萊雅族","阿美族；卡那卡那富族","阿美族；噶瑪蘭族"],"a":2,"e":"參考資料：原住民族委員會-原住民族人口及健康統計年報","u":"https://cip.nhri.edu.tw/annual_report/stat/pop"},{"n":207,"c":"A","s":"公視戲劇《斯卡羅》裡的原住民族，是指臺灣現今哪一族群？","o":["泰雅族","賽德克族","卑南族","排灣族"],"a":2,"e":"參考資料：臺灣原住民族事典斯卡羅（Suqaro）這個人群的名稱，早在日本時代移川子之藏等人所著《臺灣高砂族系統所屬の研究》（1935）中即有記載，但是此名稱出現於多處，多為排灣族指稱台東平原一帶的卑南族之他稱，或者指稱由知本社遷移到恆春的人群。","u":"https://aborgpedia.alcd.center/detail?id=11733&search=&cat=0&race=0&writer="},{"n":208,"c":"C","s":"關於原住民族與其住屋建築特色，下列何者配對不正確？","o":["排灣族-石板屋","達悟族-半穴居","阿美族-干欄式建築","魯凱族-石板屋"],"a":2,"e":"參考資料：臺灣原住民族文化知識網 建築工藝阿美族傳統家屋以茅草興建，為單室前門的長方形住家，每二、三年左右會在秋天把屋頂茅草換新。家屋內部以木板、竹板區隔分出廚房、客廳、寢室等不同空間，屋內的核心位置是三塊石塊堆疊而成的爐灶（paruod）。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=E2774B2FD4A88AD0&sms=D8939B9274D1E899&s=31227A9670C73BED"},{"n":209,"c":"G1","s":"目前主要分布區域在新竹縣五峰鄉、苗栗縣泰安鄉與南庄鄉的，是臺灣原住民族中的哪一族？","o":["泰雅族","賽德克族","賽夏族","太魯閣族"],"a":2,"e":"參考資料：原住民族委員會網賽夏族分布在臺灣西北部，以鵝公髻山為界分屬於新竹縣與苗栗縣兩個行政區。新竹縣境內的賽夏族人，居住在五峰鄉上坪溪流域，部落在五峰鄉大隘村與花園村內；苗栗縣境內的賽夏族人，居住在中港溪上游的南庄鄉東河、南河流域，以及後龍溪上游獅潭溪流域，部落集中在南庄鄉東河村、蓬萊村、南江村，以及獅潭鄉百壽村等村落內。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/8DF9561F4FCC6AF4D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":210,"c":"C","s":"請問太魯閣族的服飾，最常採用下列何種顏色呢？","o":["紅白色","藍色","白色","粉紅色"],"a":2,"e":"參考資料：原住民族事典-太魯閣族服飾太魯閣族的服飾以輕、薄、素、淨著名，服飾多半以白色苧麻為底，局部織以色線形成紋樣。紋樣多以菱紋為主，並以單獨的形式出現。","u":"https://aborgpedia.alcd.center/detail?id=10051&search=&cat=0&race=0&writer="},{"n":211,"c":"A","s":"排灣族鼻笛樂器的聲音，是模仿排灣族守護神的聲音。請問排灣族的守護神是下列何者？","o":["臺灣黑熊","臺灣雲豹","百步蛇","臺灣石虎"],"a":2,"e":"參考資料：排灣族的起源——百步蛇娶妻排灣族認為自己是「百步蛇的子民」，除了服飾和工藝品上有百步蛇紋飾，相關的故事（例如排灣族的起源）也充滿傳奇色彩。","u":"https://ascdc.digitalarchives.tw/subject_3083.html"},{"n":212,"c":"S","s":"請問有關魯凱族的命名制度，下列何者敘述正確？","o":["子父連名制","子母連名制","家屋連名制","氏族名連名制"],"a":2,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉排灣族、魯凱族與卑南族共 3族，皆屬於這類型名制。這三個民族是在個人名後附加家屋名，因此其完整之人名呈現出「個人名 + 家屋名」之形式。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":213,"c":"S","s":"請問有關布農族的命名制度，下列何者敘述正確？","o":["子父連名制","子母連名制","氏族名連名制","家屋連名制"],"a":2,"e":"參考資料：原住民族回復傳統名字資訊網〈臺灣原住民族傳統名字文化慣俗簡介〉布農族其完整名字會在「個人名」之後加上「氏族名」。每個社／支群一般有各自的名譜，常見長男襲祖父名，長女襲祖母名。 在一般社會互動中，族人以稱呼個人名為主，除非剛認識或在議婚場合，為確認婚姻禁忌範圍，才連氏族名一併稱呼，否則頂多加個暱稱或敬稱。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/42DC8BA2DBDFF688C9BE8B414469649F-info.html?cumid=42DC8BA2DBDFF688C9BE8B414469649F"},{"n":214,"c":"S","s":"在魯凱族文化裡，魯凱族男性配戴百合花，象徵意義為下列何者？","o":["善於背負重物","擁有豐厚家產","善於狩獵","獵取無數敵人之首級"],"a":2,"e":"參考資料：原住民族委員會網站在魯凱族，狩獵是屬於男子的工作，男子要狩獵捕獲野生動物才能算是成年人，當男子陸續獵獲六頭（有些部落獵獲五頭）長出獠牙的公山豬（walisane）後，才可享有象徵獵人勇士榮譽的百合花配戴資格。小米在魯凱族人的生活中佔有重要地位，歲時祭儀都以小米為中心，在喜慶宴會中會製作小米糕 abai，象徵分享和慶賀。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/409F703B4E592A82D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":215,"c":"F","s":"在噶瑪蘭族文化裡，哪一種植物開花時，就是部落辦理海祭的時候？","o":["油桐花","麵包樹","莿桐花","檳榔樹"],"a":2,"e":"參考資料：臺灣原住民族事典-刺桐對噶瑪蘭族來說，刺桐花可作為辨識歲時的植物。花開時即為捕飛魚的季節，男子會開始整理竹筏、漁具，準備在海祭之後出海。近年，定居在花東海岸的族人會於每年 3、4月刺桐花最茂盛時，回到原鄉宜蘭縣舉行新年祭典。","u":"https://aborgpedia.alcd.center/detail?id=9563&search=&cat=0&race=0&writer="},{"n":216,"c":"C","s":"臺灣原住民族中的排灣族也有所謂的三寶。請問排灣族的重要三寶，是下列何者？","o":["山豬獠牙、雲豹皮、青銅刀","山豬、水鹿、臺灣黑熊","琉璃珠、青銅刀、陶壺","Cinavu、Qavai、Qinapiljan"],"a":2,"e":"參考資料：原住民族委員會網站排灣族人的物質工藝文化，除了俗稱「排灣族三寶」的古陶壺、琉璃珠與青銅刀，還有男子的雕刻藝術與女子的織布技藝。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/67E3CC5AE2F10A8BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":217,"c":"S","s":"下列那些是具有有紋手文化的臺灣原住民族？","o":["鄒族、卡那卡那富族、拉阿魯哇族","阿美族、撒奇萊雅族、噶瑪蘭族","排灣族、魯凱族","卑南族、達悟族"],"a":2,"e":"參考資料：國家文化資產網1.「排灣族來義鄉傳統手紋（veci’nua lima）文化」可以呈現部落社會的階序與倫理，展現排灣族傳統社會位階與職務脈絡。手紋為排灣族重要的傳統文化表徵，在手紋文化發展之初，需經過部落傳統領袖認可且身分為貴族女性才可以傳承手紋，手紋也會依照各部落及階級地位而有所不同。手紋文化顯現出排灣族深厚文化底蘊。2.微笑臺灣專欄文章〈手紋就是我的身分證！文手的排灣女人─vuvu劉鄭寶秀 ukani tjavung〉","u":"https://nchdb.boch.gov.tw/assets/advanceSearch/folklore/20230509000003https://smiletaiwan.cw.com.tw/article/1861"},{"n":218,"c":"P","s":"下列哪一條水圳為漢人與當地平埔族合作開鑿，以「割地換水」的方式引大甲溪水灌溉臺中盆地？","o":["八堡圳","瑠公圳","猫霧捒圳","曹公圳"],"a":2,"e":"參考資料：臺中市文化資產處網站葫蘆墩圳為早年臺中地區主要的灌溉設施，是由下埤、上埤及下溪洲三圳合併而成。其中以下埤圳為漢人通事張達京於雍正元年（1723）開鑿最早，時稱貓霧捒圳。雍正 10 年（1732）張達京以墾號「張振萬」邀集其他漢人組織「六館業戶」，與岸里社達成「割地換水」協議，於下埤圳上游的樸子離口，築上埤圳引大甲溪水灌溉。","u":"https://www.tchac.taichung.gov.tw/historybuilding?uid=34&pid=71"},{"n":219,"c":"M","s":"阿美族人認為哪一種動物是森林的守護神，會傳遞族人婦女懷孕的佳音，並根據其鳴叫聲判斷嬰兒性別？","o":["蝙輻","烏鴉","喜鵲","貓頭鷹"],"a":3,"e":"參考資料：臺灣原住民族事典阿美族男女成年人都具有鳥占的認知。鳥占的根據有二：（一）鳥鳴聲的長短、強弱及音色，（二）鳥的頭部及尾部上下、左右的動作。可據以占卜的鳥類聲音，例如：（1）百舌鳥，是所有鳥類中預示占象最準確的。（2）烏秋的出現，不論啼叫聲及動作如何，都是「吉祥」的象徵。（3）烏鴉和烏秋正好相反，其出現是不吉利的前兆，聽到的人將會遇到倒楣的事。（4）聽到老鷹的叫聲，將有家人生病、失蹤、受傷等不幸意外的災難。（5）貓頭鷹棲息在家園內檳榔樹及其他樹木上，三更半夜發出「更…更…更…」的聲音，表示你家或附近的孕婦將生出男嬰；若發出「阿久…阿久…阿久…」的啼叫聲，表示將生出女嬰。（6）聽到竹雞發出「地古改…替古利…地古改…替古利…」的聲音，表示「祝你康復、快樂、平安…」，預祝你萬事如意。","u":"https://tcmb.culture.tw/zh-tw/detail?id=563790&indexCode=Culture_Object"},{"n":220,"c":"H2","s":"日治時期所流傳的故事「莎韻之鐘」來自於哪一原住民族？","o":["賽夏族","泰雅族","賽德克族","卑南族"],"a":1,"e":"參考資料：臺灣女人網-主題辭條, 日本時代 （1895~1945）, 風俗文化莎勇之鐘莎韻之鐘的原文為「サヨンの鐘」，為日本殖民統治台灣的期間，於1941 年4月14日，由第十八任台灣總督長谷川清贈予蘇澳郡蕃地利有亨社的一只鐘，用以表彰原住民少女莎韻的「愛國」事蹟。該只鐘的故事背景發生在 1930年代末期，當時日本發起的對外戰爭情勢愈趨高漲，也加快了國內戰爭動員的腳步。1938年9月，於南澳郡擔任山地警察兼蕃童教育所教職的田北正記警手，接獲了政府頒佈的從軍召集令而必須離開當地應召入伍，從部落至大南澳公車站的這段路程，由原住民少女莎韻替其背負行李，但因路途中適逢暴風警報，莎韻於橫越溪流時不慎失足落水而殞命。這位全名為莎韻‧哈勇（Sayon Hayon）的泰雅族少女，就是在這樣的時代背景之下，因為意外殞命而成為舉國皆知的「愛國少女」。","u":"https://women.nmth.gov.tw/?p=20161"},{"n":221,"c":"H1","s":"清治時期，政府將臺灣原住民族分為「生番」與「熟番」，其分類依據為何？","o":["男女性別的比例","與漢人通婚的比例","是否納稅、服勞役","傳說起源的不同"],"a":2,"e":"參考資料：1.專欄文章〈熟番、平埔番與平埔族：帝國對「番人」分類的歷史〉康熙末年，官方對番人的分類稱謂才從「野番」、「土番」轉變至「生番」、「熟番」，後來也因界碑、番界的成立，才出現「界內熟番」與「界外生番」的對應。此一轉變開始排除原本繳納賦稅、卻生活在番界外的番社，例如阿里山社（今鄒族）就從原本的「土番」分類中，被劃歸為界外的「歸化生番」。2.國立故宮博物院特展《什麼是「番」-清帝國文獻裡的臺灣原住民族》康熙年間，臺灣被編入清帝國版圖。清帝國開始以「番」來指稱臺灣的原住民族，再進一步將原住民分為「熟番」、「生番」與介乎兩者間的「化番」，規範其身分認定並進行治理部署。","u":"https://storystudio.tw/article/gushi/taiwanese-plains-aborigineshttps://theme.npm.edu.tw/exh111/TaiwaneseIndigenous/ch/page-2.html"},{"n":222,"c":"G1","s":"在臺灣原住民族當中，泰雅族的分布最為廣泛。請問下列何者並非泰雅族分布的主要鄉鎮？","o":["桃園市復興鄉","宜蘭縣大同鄉","南投縣魚池鄉","臺中市和平區"],"a":2,"e":"參考資料：原住民族委員會網站邵族主要居住在南投縣魚池鄉伊達邵部落和水里鄉大坪林聚落，其中伊達邵部落至今仍然嚴謹地遵循傳統祖靈信仰，傳統祖靈信仰以Ulalaluan（祖靈籃）為供奉對象，具體象徵祖靈之存在，並且供奉於各家戶內。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/3343FD21497CA007D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":223,"c":"E","s":"臺灣原住民族各族皆有著名的美食，請問下列何組合是太魯閣族傳統的美食？","o":["飛魚、芋頭","醃肉、竹筒飯","竹筒飯、香蕉飯","酸肉、Qavai"],"a":2,"e":"參考資料：原住民部落傳統農耕知識與飲食文化典藏網香蕉飯最早是太魯閣族人上山打獵的便當，使用的是野生山蕉或是芭蕉，現在大多使用方便容易取得的香蕉，將香軟成熟外皮已有斑點的香蕉與浸泡過的糯米拌勻，將燙過的香蕉葉纖維軟化，再放入拌勻的糯米香蕉，將其蒸熟，就會聞到融合香蕉葉味道的香蕉飯，冷時熱時都有不同風味，可放幾日不壞，也便於獵人打獵攜帶。香蕉飯也是節慶或是親友來訪時，準備的食物，善於分享的族人，通常一次做好分送親友。香蕉葉也是天然的餐盤與食物鋪墊，可包裹獵物分送親友。","u":"https://harvestwisdom.openmuseum.tw/muse/digi_object/73df72ea7cabfe03dce89fc28423d545"},{"n":224,"c":"F","s":"拉阿魯哇族的主要祭典是聖貝祭，傳說中的聖貝共有幾個？","o":["10 個","11 個","12 個","13 個"],"a":2,"e":"參考資料：傳藝Online文章第137期 2021/08〈正視與復振傳統祭儀拉阿魯哇族聖貝祭及卡那卡那富族河祭〉聖貝總共有十二個，分別代表十二個神：勇猛神、狩獵神、健康神、食物神、驅魔神、狀元神、守護神、聰明神、風雨神，擁有不同的法力。為了感謝小矮人贈送聖貝及貝神保護族人興旺健康，聖貝祭祭期長達六天，每天都有不同的儀式，且每年都會舉行。","u":"https://magazine.ncfta.gov.tw/News_Content2.aspx?n=1934&s=82175"},{"n":225,"c":"G2","s":"新北市烏來區為唯一山地原住民族行政區。請問該區主要族群為？","o":["太魯閣族","阿美族","賽德克族","泰雅族"],"a":3,"e":"參考資料：臺北水源特定區環境教育學習中心網 首頁/水源之旅/水源人文烏來有一群住在河岸旁的民族 - 「泰雅族」，相傳十八世紀時期，原住民是最早來到烏來區的人，當時稱原住民為「馬來番」，二十世紀時期稱原住民為「屈尺番」，他們都居住在烏來區一 帶，屬於泰雅族，「烏來」兩個字就是泰雅族語溫泉「urai」 的音譯。泰雅族的祖先發源於雪山山脈的大霸尖山，後來遷移到八里地區和大蘿蘭溪附近，後來因為人口逐漸增加，才向北遷移到烏來區。他們發現這個地方土壤肥沃、林木茂盛、水源豐沛、魚產豐富，山林跟野獸也很多，非常適合漁獵的生活，所以在此建立了部落。","u":"https://web.wra.gov.tw/elearn/News_Content.aspx?n=7735&s=47819"},{"n":226,"c":"R","s":"請問新北市都會區原住民族群中，人口數最多的族群，為下列何者？","o":["泰雅族","阿美族","卑南族","排灣族"],"a":1,"e":"參考資料：新北市政府資料開放平臺路徑：首頁/資料目錄/資料查詢/新北市各區原住民人數統計表","u":"https://data.ntpc.gov.tw/datasets/0de9326d-22ed-4ac7-8491-65bec2758af9"},{"n":227,"c":"F","s":"請問下列哪一個族群會在每年七、八月舉辦豐年祭？","o":["撒奇萊雅族","噶瑪蘭族","泰雅族","阿美族"],"a":3,"e":"參考資料：原住民族委員會網站豐年祭是阿美族人在小米收穫後，族人為感謝神靈而舉行的祭典。豐年祭的名稱，各部落因說法不一，有 malalikid、malikoda、kiluma’an等說法，後來受日本語影響而有 zukimisai（月見祭）與siukakukai（收穫會）等不同說法，現在多稱為豐年祭。豐年祭原是小米收穫後進行，在部落稻米種植面積大量增加後，祭典時間改為稻米收割後舉行。每年 7 月開始，各部落按照稻米收成時間由南往北安排辦理，祭典時間為期 1 ∼ 7 天之間。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":228,"c":"G1","s":"請問原居住在現今蘭陽平原的原住民族群，為下列哪一個族群？","o":["噶瑪蘭族","撒奇萊雅族","阿美族","泰雅族"],"a":0,"e":"參考資料：原住民族委員會網傳說噶瑪蘭族人最早由南方島嶼，途經地名為 Sanasai 的地方後遷入臺灣，落腳於蘭陽平原，十九世紀初開始遷居到花蓮臺東海岸。噶瑪蘭族原來在蘭陽平原共有 30 多個部落，十八世紀末漢人開始進入蘭陽平原。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/7088C08FB51F3383D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":229,"c":"M","s":"下列哪一個族群沒有「祖靈橋」的傳說故事？","o":["賽夏族","賽德克族","太魯閣族","泰雅族"],"a":0,"e":"參考資料：祖靈橋（泰雅語：Hongu utux；太魯閣語：Hakaw utux）是泰雅族、賽德克族與太魯閣族等原住民族的神話傳說，象徵通往祖靈世界、生死循環的橋樑。臺灣人類學與民族學學會網","u":"https://www.taiwananthro.org.tw/post/2uTBPOJLmCiRLzpQQZsQnfKDnyV"},{"n":230,"c":"R","s":"原住民族日是為了紀念原住民族正名而設立的節日。請問原住民族日的日期為何？","o":["1 月 1 日","10 月 10日","8 月 1 日","12 月 25日"],"a":2,"e":"參考資料：臺北市政府原住民族事務委員會網一、原住民族日的由來是行政院於 94年6月15日召開第2944次院會時，通過「紀念日及節日實施條例」草案，明定每年 8月1日為「原住民族日」，以紀念 83年8月1日憲法增修條文將「山胞」正名成為「原住民」；同年的 7月31日，首度在新莊體育場舉辦原住民族日活動，陳前總統水扁蒞臨致詞時，正式宣布 8月1日為原住民族日。二、原住民族日的意義是紀念原住民原住民族藉由正名運動，回復原住民在臺灣的地位，並喚醒國人對原住民族正確認知。","u":"https://www.ipc.gov.taipei/News_Content.aspx?n=EA2FD0F6539FEB5C&s=17144945EA5A2037"},{"n":231,"c":"G2","s":"玉山為下列哪兩個族群的傳統領域？","o":["布農族；排灣族","鄒族；布農族","賽夏族；泰雅族","泰雅族；賽德克族"],"a":1,"e":"參考資料：國立臺灣圖書館網〈鄒族與布農族的玉山神話〉文/巴蘇亞‧博伊哲努(浦忠成)玉山是布農族與鄒族共同的聖山與文化起源地，深具神話與歷史意義。鄒族視玉山為祖先發祥地，洪水傳說中逃往之處；布農族則視其為大洪水時的避難地，全區佈滿布農族舊社遺跡與獵場。兩族皆尊玉山為神聖之地，在文化與地理關係上皆密不可分。","u":"https://www.ntl.edu.tw/public/Attachment/0618943750.PDF"},{"n":232,"c":"G1","s":"臺灣島上的原住民族語言屬於哪一種語系？","o":["南島語系","漢語系","印歐語系","斯拉夫語系"],"a":0,"e":"參考資料：中央研究院網 「研之有物」專訪文章〈千年文化寶藏就在你身邊！從語言證據找出南島語族發源地〉語言學界為分布在南太平洋與印度洋諸島的族群確立關係，分類命名為南島語族（Austronesian-speaking peoples）。除此之外，還有許多語言證據指出，南島語族可能是從臺灣擴散出去。考古學家在臺灣、呂宋島、大洋洲等地出土相似的陶器碎片，經年代鑑定後發現，最早的繩紋紅陶陶器來自 5、6 千年前的臺灣大坌坑文化。植物學家則對各地的構樹樣本進行分子親緣分析，發現南太平洋島嶼的構樹應源自臺灣，推測先民帶著樹皮衣材料構樹，自臺灣遷徙至南太平洋諸島。除了上述證據，還有一樣活在生活周遭的非物質遺產，能作為南島語族「出臺灣說」的有力證據，那就是臺灣原住民族正在使用的「語言」！","u":"https://research.sinica.edu.tw/formosan-languages/"},{"n":233,"c":"C","s":"下列哪一族早期以香蕉絲編織衣物及生活用品，今則以香蕉絲創意衣帽、飾品等手工藝品著稱？","o":["阿美族","泰雅族","噶瑪蘭族","賽德克族"],"a":2,"e":"參考資料：1.花蓮縣文化局網噶瑪蘭族香蕉絲編織在原住民族傳統藝術中具特殊性、唯一性，不只有傳承，亦有創新。一方面是目前唯一保留、使用此特殊材料與編織方式的族群2.微笑台灣專欄文章〈一絲一縷織起噶瑪蘭族記憶，花蓮豐濱「新社香蕉絲工坊」傳承失而復得的工藝文化〉香蕉遍布我們的日常生活，除了果實可食，其莖幹更織就了噶瑪蘭族的文化。位於花蓮豐濱的新社香蕉絲工坊，藝師嚴玉英將噶瑪蘭族的過去、現在與未來化作香蕉布上細緻的紋理，就算再艱辛，也要如香蕉絲般既柔且韌，讓傳統技藝永遠流傳下去。","u":"https://www.hccc.gov.tw/zh-tw/CulturalHeritage/Detail/202https://smiletaiwan.cw.com.tw/article/5941"},{"n":234,"c":"F","s":"哪一個族群每兩年會舉辦矮靈祭，來慰藉矮黑人的靈魂？","o":["賽夏族","鄒族","布農族","魯凱族"],"a":0,"e":"參考資料：國家文化資產網賽夏族 paSta&#x27;ay 的歷史源自賽夏族一個「愛恨交織」的傳說。相傳距今 300多年前，賽夏族部落對岸山洞裡，住著一群身高不滿 3尺（1公尺）的小矮人，賽夏族人稱之 ta&#x27;ay (音譯: 達隘)或戲稱矮人。達隘身材雖矮小智慧卻很高，而且行動迅捷，他們經常教導賽夏族人農耕漁獵技術、治病方法，賽夏族人對他們心存感激，常請達隘喝酒同樂。在每年收成後，也會準備豐盛酒菜招待達隘。但達隘常在喝酒後調戲賽夏族婦女，甚至曾造成賽夏族婦女懷孕之事，導致賽夏族人心生不滿，亟思報復，但不敢輕舉妄動。在某次慶豐收歡樂之夜，達隘又調戲賽夏婦女，一位賽夏青年決心進行報復行動。乘黑夜暗中將達隘每天必經之橋（以兩枝枇杷樹幹架設而成）砍斷一半，再塗抹泥土遮掩，當達隘酒後成群走上橋時，橋不堪負荷而折斷，達隘紛紛墜落河谷死亡，僅餘兩名年長達隘未上橋而逃過一劫。事後這兩名倖存之達隘決定離開賽夏族部落，離去前忍悲傳授祭歌及祭儀，告誡賽夏族人須每年祭拜達隘靈魂，否則必有災禍，隨後即朝東方離去。","u":"https://nchdb.boch.gov.tw/assets/overview/folklore/20100108000001"},{"n":235,"c":"H2","s":"1930年10 月27日發生霧社事件，請問該事件與哪一個族群最相關？","o":["泰雅族","布農族","太魯閣族","賽德克族"],"a":3,"e":"參考資料：國家文化記憶庫網日治昭和 5年(1930)10 月27日，霧社馬赫坡社頭目莫那魯道率領六部落原住民勇士發起霧社抗日事件，當時的戰場遍布抗日六部落、霧社街區及霧社山區，並分四條路徑挺進，其中的馬赫坡戰線，日軍於同年(1930)11月1日對馬赫坡社進行正面攻略，在安達大隊長的率領下，於 11月5日晨間採取行動，在馬赫坡社東方「西茲西庫」的連綿山脊，海拔約 1,300公尺的高地，構築數處掩堡，並於同日下午佔領可俯視抗日族人的據點馬赫坡岩窟方面的突角點－一文字高地(賽德克語：Butuc)。","u":"https://tcmb.culture.tw/zh-tw/subject/298"},{"n":236,"c":"F","s":"打耳祭是屬於哪一個族群的祭典？","o":["泰雅族","鄒族","布農族","太魯閣族"],"a":2,"e":"參考資料：海端鄉公所網(首頁/人文、工藝/特色介紹/人文、工藝/布農族射耳祭)射耳祭是布農族的傳統祭儀之一，在布農族語中稱為 Malahtangia ，有「射鹿耳」之意，是布農族人一年之中最盛大的祭典活動。約在每年的四、五月間由頭目召集部落裡所有男性族人到祭場舉行祭儀，女性則不能參加。祭儀的過程會經過獵前槍祭、射耳儀式、分肉與祭骨儀式，以及報戰功酒宴等幾個流程。","u":"https://www.haiduau.gov.tw/home/index.php/2019-08-21-13-29-19/77-2019-08-20-07-45-07/2019-08-20-07-49-50/373-2019-08-21-13-25-50"},{"n":237,"c":"G1","s":"哪一個族群為臺灣原住民族群中人口數最多的族群？","o":["阿美族","排灣族","泰雅族","布農族"],"a":0,"e":"參考資料：原住民族委員會網原住民人口數統計資料(每月一次)","u":"https://www.cip.gov.tw/zh-tw/news/data-list/940F9579765AC6A0/index.html?cumid=940F9579765AC6A0"},{"n":238,"c":"M","s":"下列哪一個臺灣原住民族群有著鬼湖傳說-巴冷公主的傳說故事？","o":["卑南族","鄒族","魯凱族","排灣族"],"a":2,"e":"補充資料：《東海中文學報》第 21期 頁415－434東海大學中文系2009年7月〈解讀「巴冷公主」現象－魯凱族「頭目之女與蛇聯姻」傳說再創作觀察〉","u":"https://chinese.thu.edu.tw/upload/newspaper_upload/21/21017.pdf"},{"n":239,"c":"G2","s":"以現行的縣市行政區來說，泰雅族的傳統領域並未分布於下列哪一個縣市？","o":["新北市","臺北市","臺中市","宜蘭縣"],"a":1,"e":"參考資料：原住民族委員會網泰雅族分布在臺灣中北部山區，包含新北市、桃園市、新竹縣、苗栗縣、臺中市、南投縣、宜蘭縣等七縣市的山區各鄉鎮，是臺灣原住民族中分布領域最廣的民族。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/8C87B4AF56B788EED0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":240,"c":"H1","s":"荷蘭統治時期，荷蘭人曾在麻豆社事件中聯合西拉雅族的哪一社攻打麻豆社？","o":["蕭壠社","目加溜灣社","大目降社","新港社"],"a":3,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)〈荷蘭時期涉外事件〉1630年代上半，東印度公司為報復先前小琉球人殺害遇難的海船金獅號（‘t Gouden Leeuw）船員，於1633年聯合蕭壠社與新港社，一同對小琉球人出兵，並開始逐步對小琉球進行人口淨空政策。1635 年底至1636年初，東印度公司為了確立在臺灣西南平原的霸權、報復先前荷蘭人遭殺害，以及協助其盟社新港社對抗其南方的敵人等各種原因，與新港社合組聯軍，先後出兵麻豆社、阿猴（Taccareiangh）社、蕭壠社。此戰役結束後，東印度公司除了確立在臺灣南部平原的霸主地位，要求歸順、結盟的部落移轉其主權給公司外，並造成周邊部落聞訊後接連要求與荷蘭人締和，加入東印度公司盟友的行列；當中即包括恆春一帶的瑯嶠（Longkiau）君主勢力、嘉義一帶的他里霧（Dalivo）、阿里山（Jarissang）、猴悶（Tossavang）、打?（Dovoha）等社；此時，全臺累計共有 57社與東印度公司締和。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/250"},{"n":241,"c":"E","s":"下列何者為早期臺灣原住民族主要的糧食？","o":["小米","糯米","高粱","稻米"],"a":0,"e":"參考資料：天天里仁文章〈走進原民部落的雜糧世界〉在原住民族經常種植的作物裡，小米可說是最重要的主食，在一塊田地裡，主糧會種在大且平坦的區域，例如小米、旱稻; 周圍或有大石頭等的畸零地塊則會種植其他穀類、豆類或瓜果類等作物，充分配置。","u":"https://www.leezen.com.tw/article/detail/2299?srsltid=AfmBOorC0S3Z3Izff3qmVTomTcGtggTNkgzw6qrMlncW-PWuszCIhxqU"},{"n":242,"c":"H1","s":"荷蘭人佔領現今臺南地區期間，曾向哪一個族群宣揚基督教？","o":["巴宰族","凱達格蘭族","西拉雅族","洪雅族"],"a":2,"e":"參考資料：典藏臺灣網(首頁/珍藏特展/領我往美麗之島——荷蘭傳教士行旅)荷蘭殖民臺灣時，對於當時包含西拉雅族在內的原住民，運用了鎮壓、安撫、教化交替的統治方式。在行政方面，採取「地方會議制」，定期召集各社長老頭人至熱蘭遮城開會，樹立權威同時宣導政令。在教化方面，前仆後繼的荷蘭傳教士扮演了重要的角色，他們為了傳遞基督教教義而深入西拉雅社群，留下來的各種文書與筆記更成為現代研究臺灣早期原住民歷史的珍貴史料。","u":"https://digitalarchives.tw/Exhibition/4145/1.html"},{"n":243,"c":"S","s":"下列哪一個臺灣原住民族群稱「男子會所」為kuba(庫巴)？","o":["卑南族","鄒族","布農族","邵族"],"a":1,"e":"參考資料：原住民族傳統智慧創作保護資訊網鄒族舉行 mayasvi 祭儀的會所「kuba」，在祭儀中佔有重要地位，它不僅是鄒族政治、宗教和社會運作的核心，獨特的建築形態和工法，由外而內處處展現出鄒族深厚且豐富的文化風華，更成為肩負起鄒族人維繫傳統部落倫理、社會結構規範和精神戰力的重要棟樑。","u":"https://www.titic.cip.gov.tw/app/caseDetail?num=1080611000005"},{"n":244,"c":"S","s":"下列哪一個臺灣原住民族群沒有氏族名、家族名？","o":["魯凱族","排灣族","布農族","太魯閣族"],"a":3,"e":"參考資料：原住民族回復傳統名字資訊網(首頁/各族常見傳統名字/Truku 太魯閣族)太魯閣族採用「親子連名制」，結構為「個人名＋父親名」，無固定姓氏，展現血緣傳承與親屬關係。傳統由長者從祖先的名字中挑選給嬰兒取名，但並不一定按照祖輩順序，而是著重男子名需擁有果敢、善獵、品行良好的德行、女子名則為擅織布、性格溫順的對象來取用；或者以孩子的個人特徵命名；又或也有以當時的自然環境、常用器物以及動、植物為名者。太魯閣族青年藝術家東冬侯溫（Dondon Houmwm），後面的Houmwm是父親的名字，有「銳利的刀鋒」之意，個人名 Dondon 則為新創，意指可愛的孩童。","u":"https://taiwan-indigenous-name.info/zh-tw/menu/data-nlist/D849585AE57A4465FBD1879B68D69D07-info.html?cumid=D849585AE57A4465FBD1879B68D69D07"},{"n":245,"c":"G1","s":"下列哪一個臺灣原住民族群與泰雅族的語言、文化最為相似？","o":["賽夏族","賽德克族","噶瑪蘭族","布農族"],"a":1,"e":"參考資料：原住民族委員會網賽德克族介紹1.紋面文化目前已經消失，紋面是賽德克族文化中成年的標示，代表傳統文化價值，同時具有美觀、避邪等功能，鄰近的泰雅族、太魯閣族也有相同文化。2.賽德克族 gaya祖訓是賽德克族文化中重要的行為與社會規範準則，若是違反規則，祖先會降禍族人，所以族人小心謹慎的遵守這些規則，以免危及群體安危。賽德克族的 gaya，與太魯閣族的 gaya、泰雅族的 gaga 相同，是指祖先制訂的制度與規則。來源：https://www.cip.gov.tw/zh-tw/tribe/grid-list/F35F3EBC7CE2E1BCD0636733C6861689/info.html?cumid=D0636733C6861689","u":""},{"n":246,"c":"P","s":"以地理位置來推估「艋舺」Banka 會是哪一個族群對獨木舟的稱呼？","o":["泰雅族","凱達格蘭族","噶瑪蘭族","賽夏族"],"a":1,"e":"參考資料：國家圖書館 臺灣記憶早在漢人未移住臺灣北部之前，流域周圍的原住民凱達格蘭族，便開始利用「莽葛」（Banka，又譯「艋舺」，原住民語，意指獨木舟之類的小船）往來於河流之上。來源：https://tm.ncl.edu.tw/","u":""},{"n":247,"c":"S","s":"下列哪一個臺灣原住民族群並非父系社會？","o":["卑南族","泰雅族","賽德克族","太魯閣族"],"a":0,"e":"參考資料：原住民族委員會網卑南族的政治領袖、祭司與巫師，在不同領域扮演專業角色，以維繫部落的政治、儀禮與疾病醫療等生活照護需求。卑南族男性社會關係表現在年齡階級與會所制度；婚姻家庭以母系大家族制為原則，重視母系家系傳承的本家、宗家觀念。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/913F9B9D35D49AC3D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":248,"c":"F","s":"猴祭為下列哪一個臺灣原住民族群的傳統文化？","o":["賽夏族","鄒族","排灣族","卑南族"],"a":3,"e":"參考資料：國家文化記憶庫古時候，一對卑南族父子一起上山打獵，父親發現一隻猴子正要拉弓射猴時，因所在位置石塊滑動，以致掉落在山谷裡，而孩子卻打傷猴子，他一面抓了猴子，一面跑回部落裡求援，才平安地將父親救回，後來族人為了表彰孩子的英勇，演變今天的猴祭。卑南族人在青年時期要分別進入「打骨把骨棒」（少年會所）與「芭拉冠」（青年會所）嚴格訓練，學習勤勞、服從、禮節、膽識等項目，然後實施「瑪卡瑤」—野外求生狩獵，才可晉升「萬沙浪」級，有資格結婚。猴祭是當中重要儀式，少年們到野外狩獵與體能鍛鍊，並抓回猴子，以手持竹製旌旗刺死，藉以鍛鍊膽量，最後再由長老唸歌謠賜福，少年們則由年齡階層較高的持竹棒打屁股，表示晉升一級。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=270484"},{"n":249,"c":"H1","s":"下列何者最先進入蘭陽平原開墾，建立漢人家園？","o":["鄭芝龍","吳沙","沈葆楨","劉銘傳"],"a":1,"e":"參考資料：專欄文章〈【臺灣通史】「開蘭第一人」吳沙是拓墾蘭陽平原的先驅，或侵占原住民土地的侵略者？〉提到宜蘭拓墾的歷史，許多人馬上就會想起擁有「開蘭第一人」稱號的吳沙。在過往的歷史課本中，吳沙的形象總被刻畫成率領著一批漢人，篳路藍縷地進入蘭陽平原開墾，奠立了漢人在蘭陽平原的發展基礎，受到不少人的推崇。","u":"https://storystudio.tw/article/gushi/wu-sha"},{"n":250,"c":"H2","s":"日治時期的臺灣原住民族孩童，通常就讀哪一種義務教育學校？","o":["公學校","小學校","蕃童教育所","師範學校"],"a":2,"e":"參考資料：臺灣原住民事典「蕃童教育所」為日本時代台灣總督府所劃定特別行政區域內的初等教育機構。台灣總督府為開發山林資源，有效掌控山地部落，並培養未來的協力者，自 1896年（明治29 年）4月實施民政後，即開始思量如何有效管控蕃地特別行政區，負責單位也由民政局殖產部，經撫墾署、辨務署、警察本署、蕃務本署再到警務局。","u":"https://aborgpedia.alcd.center/detail?id=11641&search=&cat=0&race=0&writer="},{"n":251,"c":"H1","s":"荷蘭統治時期為有效掌握原住民部落，召開地方會議，授予各社長老管理權力，其中長老的任務不包括哪些？","o":["協助宣達政令","調解部落糾紛","報告轄區內狀況","經濟貿易交流"],"a":3,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)〈荷蘭對臺灣原住民的統治方式與儀式〉荷蘭在臺灣之統治機構，主要設置有大員長官和福爾摩沙議會（由官員、城堡長官和教會傳教士組成）。此外，在荷蘭征服的村社設置地方會議，召集各村社長老（頭目、酋長）參加，其主要目的是宣達政令、委派各村社長老以及協調各村社之間的問題。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/677"},{"n":252,"c":"P","s":"平埔族群大多屬於以下哪一種社會結構？","o":["母系社會","父系社會","平權社會","父、母系社會"],"a":0,"e":"參考資料：臺灣光華雜誌〈尋覓被遺忘的「母親」——西拉雅舊社之旅〉文‧王文娟/圖‧卜華志 1995 9月平埔原屬於母系社會，由於明、清兩代有許多漢人的「羅漢腳」（單身漢）渡海來台，他們娶平埔女子為妻，也帶入父系社會的制度。然而，雖然平埔在姓氏上已經和漢人一樣從父姓，但有些家庭在家產繼承上，仍維持母系社會的傳統。此行在滴水仔碰到買振良夫婦，是最明顯的例子。","u":"https://reurl.cc/ovekLv"},{"n":253,"c":"G1","s":"下列有關太魯閣族的敘述，何者正確？","o":["太魯閣族分布於花蓮、臺東地區","是母系社會","男性擅長藤編，女性擅長織布","能流暢地與泰雅族人用各自的族語談話"],"a":2,"e":"參考資料：原住民族委員會網織布對於女性有重要意義，在學會織布後才能紋面與結婚，也才能通過彩虹橋的考驗，到達祖靈的故鄉。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F0736660B8023670D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":254,"c":"H1","s":"西元 2014 年，政府在今花蓮縣靜浦國小校區內設置紀念碑，是為紀念1877 年的哪一事件？","o":["七腳川事件","大嵙崁事件","加禮宛事件","大港口事件"],"a":3,"e":"參考資料：原住民族文獻網期刊〈阿美族遭逢外來政權的二個歷史事件〉1875 年之後，東部原住民開始頻繁密切的接觸外來勢力，移入者不斷與原住民有所衝突，原住民的強烈反抗，使得開山軍隊不斷增兵，繼而發生了東部原住民捍衛生存空間反抗清廷之事件。以阿美族而言最具代表性的事件即大港口事件（奇密社之役）。根據清廷方面文獻的記載，光緒 3年（1877）7月，因練勇前、左兩營陸續到來，駐兵也分布到水尾以北各地；此時，位於水尾附近的烏漏社首先發難抗清，清兵攻破烏漏社，但因阿棉山、納納等社也加入戰局「突有另股繞後狙擊，以致先勝後挫（註 1）。 」整個事件始末，起於 1877年後山駐軍統領吳光亮，開闢自水尾（今花蓮縣瑞穗鄉）至大港口（今花蓮縣豐濱鄉）道路。附近之奇密社（今瑞穗鄉奇美村）不服，殺總通事林東涯以叛。8月吳光亮以營官林福喜彈壓，抵烏雅立社（今瑞穗鄉岡村），中伏潰敗。奇密社與大港口南岸之納納社（今豐濱鄉靜浦村）南北相應，聲勢龐大。清廷乃急調北路統領孫開華率兵二營，總兵沈茂勝率兵一營，及臺灣知縣周懋琦率砲隊，分海路增援，阿美族人不敵逃散。奇密社事件主戰場都在大港口（Makotaay）一帶的東海岸，參戰的也都是大港口阿美族的祖先，所以有人以「大港口（Cepo’）事件」或「靜浦事件」稱之。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/248"},{"n":255,"c":"E","s":"請問下列何者並非泰雅族的傳統農作物？","o":["檳榔","小米","地瓜","豆類"],"a":0,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)〈變與不變：和平區泰雅族的農作生產與社會生活〉日據時代之前，泰雅族採山田燒墾的方式，一個部落十幾戶，最大的部落五十戶，土地足夠使用，沒有占地的觀念。選擇好土地後放火燒山，灰燼用來當肥料，旱地作物包括：糯米、再來米、小米、地瓜、芋頭，原則上一年二作，兩年後土地貧瘠，再遷移到別的地方。有些新竹、臺中淺山部落，以陸稻為主糧，平時以胡瓜、南瓜、韭菜、薑、野菜、辣椒加鹽，或以豆類加鹽煮食。獸肉、魚、蝦等，則於農閒時漁獵，畜養之豬雞，僅在祭祀、婚喪、慶典、賠罪時宰食。烹調方式主要為烤、煮、蒸，嗜好品為菸、酒，飲酒之前常以手指沾酒向祖靈作祭。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/259"},{"n":256,"c":"E","s":"山胡椒又稱「馬告」。請問「馬告」為哪一個臺灣原住民族群的語言？","o":["賽德克族","太魯閣族","賽夏族","泰雅族"],"a":3,"e":"參考資料：1.原住民族語言研究發展基金會在原住民族料理、餐廳中常常用來提味的「馬告」，是來自泰雅語的maqaw這個字！其實在不同的族群中，這個傳統飲食常見的香料是有不同的說法。2.泰雅族的瑰寶《馬告特展導覽手冊》新北市政府原住民族行政局「馬告」（山胡椒）向來為泰雅族人作為調味品或提神的聖品，彷彿是「山林裡的黑珍珠」般珍貴，族人除了將它作為日常料理的調味外，在生活上，亦屬重要的社交禮品。","u":"https://www.ilrdf.org.tw/basic/?mode=detail&node=1369https://www.atayal.ntpc.gov.tw/uploadfiles/image/brochure.pdf"},{"n":257,"c":"M","s":"下列有關臺灣原住民族群神話傳說的敘述，何者正確？","o":["鄒族為躲避大洪水而遷移至大霸尖山","泰雅族的祖先來自於白石","阿美族的祖先來自於蘭嶼","矮靈祭是賽夏族慰藉矮黑人的祭儀"],"a":3,"e":"參考資料：國家文化資產網賽夏族 paSta&#x27;ay 的歷史源自賽夏族一個「愛恨交織」的傳說。相傳距今 300多年前，賽夏族部落對岸山洞裡，住著一群身高不滿 3尺（1公尺）的小矮人，賽夏族人稱之 ta&#x27;ay (音譯: 達隘)或戲稱矮人。達隘身材雖矮小智慧卻很高，而且行動迅捷，他們經常教導賽夏族人農耕漁獵技術、治病方法，賽夏族人對他們心存感激，常請達隘喝酒同樂。在每年收成後，也會準備豐盛酒菜招待達隘。但達隘常在喝酒後調戲賽夏族婦女，甚至曾造成賽夏族婦女懷孕之事，導致賽夏族人心生不滿，亟思報復，但不敢輕舉妄動。在某次慶豐收歡樂之夜，達隘又調戲賽夏婦女，一位賽夏青年決心進行報復行動。乘黑夜暗中將達隘每天必經之橋（以兩枝枇杷樹幹架設而成）砍斷一半，再塗抹泥土遮掩，當達隘酒後成群走上橋時，橋不堪負荷而折斷，達隘紛紛墜落河谷死亡，僅餘兩名年長達隘未上橋而逃過一劫。事後這兩名倖存之達隘決定離開賽夏族部落，離去前忍悲傳授祭歌及祭儀，告誡賽夏族人須每年祭拜達隘靈魂，否則必有災禍，隨後即朝東方離去。","u":"https://nchdb.boch.gov.tw/assets/overview/folklore/20100108000001"},{"n":258,"c":"M","s":"根據排灣族的傳說，其祖先起源自哪一座山？","o":["太武山","大武山","玉山","大霸尖山"],"a":1,"e":"參考資料：1. 國家圖書館 臺灣記憶大武山的顛峰，傳說是排灣族的祖先發祥地，北大武山為中央山脈主脊的最南端，標高 3092公尺，目前設有大武山自然保護區。2.公視 我們的島紀錄片〈薪火相傳｜排灣族文化的起點─大武山〉採訪/撰稿 林玲遠 攝影/陳添寶","u":"https://tm.ncl.edu.tw/https://ourisland.pts.org.tw/content/1730"},{"n":259,"c":"P","s":"哪一個縣市將西拉雅族認定為「市定原住民族」？","o":["新北市","臺北市","臺南市","高雄市"],"a":2,"e":"參考資料：臺南市政府原住民族事務委員會西拉雅族作為臺南市「市定原住民」，係當今平埔族群中唯一由地方政府肯認的原住民族，臺南市亦是推動平埔族群正名最為積極、成熟的地方；2009年受理日治時期種族「熟」之縣民填寫登記為「平地原住民」意願書，亦多達 12,640人申請，尋求對原住民身分的認同。","u":"https://web.tainan.gov.tw/nation/News_Content.aspx?n=934&s=5752"},{"n":260,"c":"M","s":"泰雅族中賽考列克語系認為其民族的起源地為今天的何地？","o":["新竹縣尖石鄉","南投縣仁愛鄉","臺中市和平區","新北市烏來區"],"a":1,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)期刊〈為瑞岩部落留下歷史記憶──泰雅起源聖地與瑞岩部落的遷移〉相傳泰雅族的 squliq（賽考列克）語系發源地是 Pinsbkan（賓斯博干），s’uli（澤敖列）語系發源地是 Papaqbaka（大霸尖山）。本文主要是綜述 Pinsbkan 和瑞岩部落的口述歷史，以此案例說明臺灣原住民的發源地遺址、舊社及部落遷移史，對於族群的延續與認同，乃至整體臺灣歷史文化溯源之特殊意義。瑞岩部落（Masitoban/Spayan）位於南投縣仁愛鄉發祥村附近，海拔約 1000 公尺","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/129"},{"n":261,"c":"F","s":"火神祭是哪一個原住民族群的祭典？","o":["噶瑪蘭族","撒奇萊雅族","阿美族","卡那卡那富族"],"a":1,"e":"參考資料：臺灣原住民族文化知識網撒奇萊雅族簡介，火神祭典（palamalan a lisin）火神祭以光緒4 年（1878）加禮宛事件為祭典核心概念，屬於跨部落的全族紀念性活動。加禮宛事件發生時，達固部灣部落（Takubuan）是當時最大的部落，部落外圍種有刺竹防禦。清兵因刺竹隔離而無法接近部落，最後引火射箭攻擊，造成部落茅草屋燒毀、族人傷亡。之後，族人因分散各地而無法祭祀事件中傷亡先祖。撒奇萊雅族因遭歷史事件的祝融吞噬，而致民族文化發展受挫。歷經一世紀後，族人以火神祭典弔唁祭祀傳統領袖夫婦以及在加禮宛事件中犧牲的族人。火神祭典除了紀念歷史事件外，更具有凝聚民族認同的意義。火神祭典的儀式有：一、迎神，二、祈福，三、繞境，四、祭神，五、送神。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/588FAD20D4E16D65D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":262,"c":"H2","s":"日治時期發生的事件中，何者與臺灣原住民族最相關？","o":["二二八事件","中壢事件","牡丹社事件","霧社事件"],"a":3,"e":"參考資料：國家文化記憶庫網日治昭和 5年(1930)10 月27日，霧社馬赫坡社頭目莫那魯道率領六部落原住民勇士發起霧社抗日事件，當時的戰場遍布抗日六部落、霧社街區及霧社山區，並分四條路徑挺進，其中的馬赫坡戰線，日軍於同年(1930)11月1日對馬赫坡社進行正面攻略，在安達大隊長的率領下，於 11月5日晨間採取行動，在馬赫坡社東方「西茲西庫」的連綿山脊，海拔約 1,300公尺的高地，構築數處掩堡，並於同日下午佔領可俯視抗日族人的據點馬赫坡岩窟方面的突角點－一文字高地(賽德克語：Butuc)。","u":"https://tcmb.culture.tw/zh-tw/subject/298"},{"n":263,"c":"E","s":"下列哪一種植物，具有能使溪流的魚類暫時暈眩昏迷的作用？","o":["黃藤","魚藤","咬人貓","姑婆芋"],"a":1,"e":"參考資料：國家文化記憶庫padawak，建和卑南語魚藤之意。魚藤是射馬干族人過去用來圍網捕魚的主要工具，利用其根部具備的短暫毒性來迷昏河流裡的魚蝦蟹，讓族人得以輕鬆捕撈漁獲。而除了用來抓魚之外，魚藤的汁液也可以用來殺頭蝨，將稀釋後的魚藤汁液均勻抹在頭髮上，用毛巾包覆一段時間後，再用清水沖洗，能夠有效殺死寄生在頭髮裡的頭蝨。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Event&id=568033"},{"n":264,"c":"R","s":"2016年原住民族日，中華民國哪一位總統以國家元首身分代表政府向臺灣原住民族道歉？","o":["李登輝","陳水扁","馬英九","蔡英文"],"a":3,"e":"參考資料：總統府新聞與活動105 年08月01日新聞〈總統代表政府向原住民族道歉〉蔡英文總統今（1）日上午代表政府向原住民族道歉。上午 9時30分，總統府正大門前開始進行呼喊儀式，象徵參與族人已帶著善意到來，現場並點燃小米梗，引導原住民族祖靈一同前來；總統在大門口迎接參與族人進入總統府。隨後在經國廳舉行道歉儀式，首先以傳統布農族儀式祈福，由耆老胡金娘女士點酒，讓祖靈能夠認識總統，並向祖靈祈求一切順遂；緊接著由不同宗教之神職人員齊聲禱告，祈願神與祖靈共同見證此一歷史時刻。祈福後，總統正式發表道歉文：二十二年前的今天，我們憲法增修條文裡的「山胞」正式正名為「原住民」。這個正名，不僅去除了長期以來帶有歧視的稱呼，更突顯了原住民族是臺灣「原來的主人」的地位。","u":"https://www.president.gov.tw/news/20603"},{"n":265,"c":"R","s":"下列哪一法律明定保障我國各族群的語言，確保原住民族語言得以保存與復興？","o":["中華民國憲法","國家語言發展法","原住民工作權保障法","原住民族基本法"],"a":1,"e":"參考資料：行政院網站《國家語言發展法》—改善語言斷層危機、尊重多元文化發展日期：108-02-22資料來源：文化部為確保我們面臨傳承危機的語言及文化得以永續傳承與發展，《原住民族語言發展法》已於 106年6月公布施行，明定原住民族語言為國家語言；《客家基本法》亦於 107年1 月31日修正客語為國家語言。考量臺灣尚有固有族群使用之自然語言未獲法律保障，為落實「語言權」為基本人權的實質內涵，《國家語言發展法》（以下簡稱本法）已於 108年1月9日由總統公布施行，希望透過立法，真正落實多元、包容、尊重等國家文化價值。","u":"https://www.ey.gov.tw/Page/5A8A0CB5B41DA11E/acb034c7-e184-4a39-be3f-381db50a6abe"},{"n":266,"c":"R","s":"根據原住民工作權保障法，原住民地區各級政府機關、公立學校及公營事業機構之僱用人員中應有多少比例為原住民？","o":["五分之一","四分之一","三分之一","二分之一"],"a":2,"e":"參考資料：法規資料庫《原住民族工作權保障法》第五條 原住民地區之各級政府機關、公立學校及公營事業機構，其僱用下列人員之總額，應有三分之一以上為原住民。","u":"https://law.cip.gov.tw/LawContent.aspx?id=FL002069"},{"n":267,"c":"F","s":"下列何者並非布農族的祭典？","o":["入倉祭","小米收穫祭","豐年祭","封鋤祭"],"a":2,"e":"參考資料：原住民族委員會網站豐年祭是阿美族人在小米收穫後，族人為感謝神靈而舉行的祭典。豐年祭的名稱，各部落因說法不一，有 malalikid、malikoda、kiluma’an等說法，後來受日本語影響而有 zukimisai（月見祭）與siukakukai（收穫會）等不同說法，現在多稱為豐年祭。豐年祭原是小米收穫後進行，在部落稻米種植面積大量增加後，祭典時間改為稻米收割後舉行。每年 7 月開始，各部落按照稻米收成時間由南往北安排辦理，祭典時間為期 1 ∼ 7 天之間。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":268,"c":"H2","s":"臺灣原住民族曾被稱為「高砂族」。請問那是在哪一個時期？","o":["荷蘭","明鄭","清朝","日本"],"a":3,"e":"參考資料：翰林雲端學院(各科目學習關鍵字列表&gt;國中歷史&gt;高砂族)大正 12年（1923年）日人將「生蕃」改為「高砂族」。高砂本是日本人稱呼臺灣的用語，以此取代有輕視意涵的「蕃」一詞。","u":""},{"n":269,"c":"M","s":"下列有關原住民族神話與傳說的敘述，哪項正確？","o":["原住民族的神話傳說都已文字記錄","原住民族的神話傳說鼓勵違反自然法則","原住民族的神話傳說要聽從祖靈的訓誡","原住民族的神話傳說子孫不必相信"],"a":2,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)期刊〈臺灣原住民族神話傳說凸顯的功能與特色〉臺灣原住民族神話傳說豐富多樣，根植於對自然與祖靈的崇敬。核心故事包含創世起源（石生、竹生、樹生、壺生等）、射日傳說、大洪水神話，以及人與矮人（小矮人）互動等，反映各族對地理環境、狩獵祭儀及倫理禁忌的認知。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/332"},{"n":270,"c":"S","s":"請問臺灣原住民族中的哪一族，貴族以上的階級，才能將雄鷹的羽毛配戴在頭飾上？","o":["Paiwan 排灣族","Pangcah /Amis 阿美族","Pinuyumayan 卑南族","Kanakanavu卡那卡那富族"],"a":0,"e":"參考資料：1.國家文化記憶庫頭飾上插著兩根似百步蛇紋的熊鷹羽毛、兩朵百合花以及花草而成的花環與琉璃珠裝飾。百合花中間夾一朵紅色的金鳳花，才被視為完整的「百合花飾」。頭飾搭配上會有羽毛、花環、百合花在排灣族也是常見的，魯凱族女性把百合花戴在左邊、男性戴在右邊，分別象徵貞潔與英勇。傳統領袖階級的貴族，百合花心可以朝向正前方，平民只能朝向左右兩側，須經過結婚或是買花禮儀(未婚且家中經濟許可的女性，選日殺豬、釀酒、製作小米糕，向部落傳統領袖送禮以取得戴花權)才可配戴。傳說熊鷹是百步蛇的化身，因此羽毛上黑白相間的條紋如同百步蛇的紋路，傳統上只有傳統領袖才能在祭典、婚禮上配戴三羽頭飾，貴族為一至二羽，平民則不許插羽。熊鷹羽毛頭飾，作者林盈如/典藏者 中研院民族所博物館 Museum ofthe Institute of Ethnology, Academia Sinica","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Event&id=5608772.開放博物館https://openmuseum.tw/muse/digi_object/391ebfb66a2f2b1c5087e5fbaf79b462"},{"n":271,"c":"F","s":"「在祭祀祖靈時會將祖先衣服放進籃子，希望保佑子孫平安長大。」這是哪一原住民族的祭典？","o":["Cou 鄒族","Thau 邵族","Hla’alua 拉阿魯哇族","Kanakanavu卡那卡那富族"],"a":1,"e":"參考資料：專欄文章〈邵族的祖靈籃傳說 來自黑白雙胞胎的託夢〉祭祀祖靈時將祖先衣物放進籃子是台灣邵族（Thao）極具特色的信仰文化，這種籃子被稱為「祖靈籃」或「公媽籃」（邵語：Ulalaluan），籃內通常裝有祖先遺留的衣物、珠飾，象徵祖靈的居所與家屋的所在，是邵族人與祖靈溝通的實體核心。原文出自《青少年雜誌期刊》No.111 期","u":"https://alive.businessweekly.com.tw/single/Index/ARTL003014663"},{"n":272,"c":"A","s":"有關臺灣原住民族文化特色的敘述，下列哪一項錯誤？","o":["臺灣原住民族利用歌謠傳承歷史","每一個原住民族都有自己的傳統文字","原住民族普遍擁有「萬物有靈」的觀念","樂舞是原住民族藝術的重要一環"],"a":1,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)期刊〈泰雅族有自己的文字嗎？一名西方傳教士的「文明原住民族」打造之旅〉文/李慧慧-桃園市原住民族行政局原民福利科科長臺灣原住民族一向被認為是以口傳方式溝通交流、傳承知識，是無文字傳統的族群。然而，孫大川指出早期臺灣原住民並沒有文字，部落傳播主要以「口傳」形式進行，透過聲音語言傳遞訊息與表達情感。除口傳以外，無聲的編織、服飾、紋身、石板屋等藝術表現，亦承擔著原住民傳統社會的傳播責任，生動的「書寫」了早期原住民的主體世界（孫大川 2000：158）。也就是原住民傳統物質文化與藝術的表現，亦是一種書寫傳播的方式。17 世紀，荷蘭、西班牙佔領臺灣，西方傳教士因傳教需要，以「羅馬拼音」翻譯聖經、聖詩及製作語言教材，以利正音文字推展語言，類此「教會版」書寫，賀安娟稱此為「教會語言學」（賀安娟 1998：81-120；Sing ‘Olam 2013: 18-19），使臺灣原住民語言出現了「文字化」，在新港社以西拉雅語文呈現被發掘的「新港文書」是目前學術界定論為最早文字化的文書，產生不同程度的影響與貢獻（巴瑞齡2009：47；李壬癸 2002：1-68；黃秀仍 2005：51）。從臺灣原住民族語發展歷程來看，1987 年解嚴之後，原住民族語言保存才開始受到政府重視。解嚴前，政府採行同化政策致語言快速流失之際，幸有外來傳教士與在地文化逢遇，基於傳教需要以羅馬拼音記錄與保存族語，一來使得原本無文字傳統的族群，透過局外人的創意，讓文化得以保存與傳承，二來宗教的權威在習得在地語言與文化，使得原來的局外人轉換成為局內人。傳教士為了達成宣教目的，以羅馬拼音翻譯聖經、編印族語教材，創製了族語「文字化」的拼音系統。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/497"},{"n":273,"c":"P","s":"下列有關平埔族群的敘述，哪一項錯誤？","o":["長期與漢人通婚","主要居住在西部沿海平原","保有完整傳統的生活習慣","平埔族不是單指一個族"],"a":2,"e":"參考資料：臺灣原住民族文化知識網首頁/臺灣原住民族文化知識網/平埔族群「平埔族不是單指一個族」。平埔族群主要分布在蘭陽平原、東北角、北海岸、臺北盆地、西部海岸平原一直到臺南、高雄及屏東一帶，使用的語言與現今正名的法定 16族原住民族同樣隸屬世界諸多語系中的南島語系。由於居住地區濱海的因素，平埔族群與亞洲其他地區的南島語族，一直以舟船互有來往；平埔族群因數百年間與漢人頻繁交流及通婚，傳統生活習慣經歷了高度「漢化」，並未完整保留所有傳統。目前生活方式多已漢化，但部分族群仍在進行文化復振，保留了獨特的祭祀（如公廨、牽曲）、檳榔文化及部分生活習慣，正積極尋求自我認同與文化保存。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=22D6C3ED637DD0E0&sms=EA52ACA1EE5C7771&s=052EE67F4C952BFE"},{"n":274,"c":"C","s":"「南方草草節」以傳承、傳遞為主要核心，推廣傳統工藝與手作。請問舉辦該活動的部落位於何處？","o":["屏東老七佳部落","台東金崙部落","高雄多納部落","屏東霧台部落"],"a":1,"e":"參考資料：台東藝文平台網站資料秋天的南迴，到《2025南方草草節》享受一場超有在地味的盛宴南方以南的部落-卡拿崙，一個緊鄰海洋及山脈的部落；草草 CauCau排灣族語”人”的意思，南方草草（kacedasan a caucau）意指太陽升起的那裡人，我們將生活分享，讓喜歡南迴原民文化的旅人，體驗在地生活，成為這塊土地上的草草 CauCau。創辦南方草草節的初衷思考，「傳承」、「傳遞」是辦南方草草節的核心，應該是把活動精神的深度來設計。我們持續以新的嘗試，讓這個地方節慶可以在地方擾動更深、更廣，除了過去我們會有的開幕音樂會、市集活動、南方講座、南方工作坊以外。也曾嘗試南迴響應店家的合作，以南迴四鄉為主，一起推廣南迴活動，2023年場我們更串聯南迴永續聯盟夥伴，推動南迴永續旅行，把旅人體驗部落生活之中，感受以往不同的深度旅行。地點臺東縣達仁鄉台坂拉里吧 niamen a cakal 銀青共創基地指導單位臺東縣政府、交通部觀光署東部海岸國家風景區管理處執行單位打個蛋海旅有限公司協辦單位打個蛋海旅民宿、力卡珈琲、芙瀨實驗廚房、南迴永續旅行聯盟、大竹高溪生態文化保育協會、國立臺東大學人文創新與社會實踐中心、農業部林業及自然保育署臺東分署","u":"https://reurl.cc/yOQdgD"},{"n":275,"c":"F","s":"下列關於臺灣原住民族傳統文化特色的敘述，哪一項正確？","o":["阿美族人為了感謝神和祖靈舉行豐年祭","排灣族的傳統藝術沒有工藝以及鼻笛音樂","鄒族缺乏優異的揉皮技術","布農族的祈禱小米豐收歌為七部合音"],"a":0,"e":"參考資料：原住民族委員會網站豐年祭是阿美族人在小米收穫後，族人為感謝神靈而舉行的祭典。豐年祭的名稱，各部落因說法不一，有 malalikid、malikoda、kiluma’an等說法，後來受日本語影響而有 zukimisai（月見祭）與siukakukai（收穫會）等不同說法，現在多稱為豐年祭。豐年祭原是小米收穫後進行，在部落稻米種植面積大量增加後，祭典時間改為稻米收割後舉行。每年 7 月開始，各部落按照稻米收成時間由南往北安排辦理，祭典時間為期 1 ∼ 7 天之間。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":276,"c":"C","s":"有關臺灣原住民族木雕刻文化的特色，下列何項正確？","o":["原住民族的雕刻，未受到漢人文化的影響","木雕文化和社會階級、宗教信仰等有關","雕塑維繫著族群文化的傳承延續","原住民族雕刻以人為主，不會有百步蛇"],"a":1,"e":"參考資料：屏東縣政府文化處木雕在原住民文化上具有象徵意義，主要和階級社會及宗教信仰有關，維繫著族群文化傳承延續，也是原住民在生活創作上具代表性的表現方式。2024 屏東縣原住民族木雕論壇，邀請專家學者分享相關研究發展成果，探討原住民族木雕的歷史、文化藝術價值及文化傳承等內容；藝師提供木雕技藝體驗營，安排實地木雕創作，指導學員體驗傳統技藝，讓學員親身學習、實踐木雕技術並欣賞木雕文化之美。","u":"https://calendar.pthg.gov.tw/Home/Detail/ed700000-56a0-0050-8496-08dcecc1a2c4"},{"n":277,"c":"S","s":"Palakuwan 巴拉冠是下列哪一個原住民族的男子會所？","o":["Pinuyumayan 卑南族","Cou 鄒族","Pangcah 阿美族","Bunun 布農族"],"a":0,"e":"參考資料：族語E樂園-建和卑南語類別：祭典與社會制度篇〈palakuwan 青年會所〉從前的部落男子在進入青少年級，就必須進駐巴拉冠，接受嚴格訓練，及團體的生活教育（如謀生及狩獵技能）。","u":"https://web.klokah.tw/extension/rd_practice/index.php?d=41&l=20&view=article"},{"n":278,"c":"A","s":"原住民舞團--布拉瑞揚舞團以作品《我．我們》三部曲，描述人在生命不同階段的重心，象徵生命中的三個階段。其中不包含哪一個重心？","o":["pacacapilj","Pulima","Puqulu","Puvarung"],"a":0,"e":"參考資料：文藝新聞-《我・我們》排灣三部曲首作！布拉瑞揚舞團攜手阿爆四月演繹 Pulima 2023/03/04 袁世珮2022 年國家文藝獎得主編舞家—布拉瑞揚，帶著一群年輕舞者以身體講故事，不再只有他是明星。從今年到 2025年，布拉瑞揚將以三年的時間，創作排灣族主題的三部舞作《我・我們》。這是他鼓起勇氣面對自己、歸返族群的嘗試，也正是第一部曲 Pulima的核心精神之一。他提到排灣的三個字 Pulima、Puqulu、Puvarung，描述的是人在生命不同階段的重心，依次是手、腦、心，從年輕的巧手，成長到一切從頭腦和智慧出發，再更年長一點，就是從心所欲。布拉瑞揚就以這三個字作為三部曲的核心。他跟舞者分享自己年輕時帶著夢想到都市打拚，因為自我認同的糾結而迷惘，又很用力地想要呈現自己的好以渴求他人的認可。他鼓勵舞者，呈現「做你們想做的，彰顯的、年輕的樣子，不要害怕失敗」的階段，從自己出發，表現出每個人想像中的 Pulima。其實他的舞者，有人已經 38歲了，還並非都是排灣族，布拉瑞揚說：「那是最好的，舞者不再是演繹，他們從自己出發，成為每個人自己的生命經驗。」而他就負責「整理」，因應著每個人長出來的東西微調、找連結，「這個可能比我這個題目最初作為排灣這件事情更重要吧。」","u":"https://500times.udn.com/wtimes/story/12672/6997094"},{"n":279,"c":"H1","s":"荷西時期，荷蘭人利用新港文向臺灣原住民族傳播下列哪一種信仰宗教？","o":["天主教","基督教","猶太教","東正教"],"a":1,"e":"參考資料：原住民族文獻網站(首頁/文獻電子期刊/期刊內容)期刊〈從新港文書看 16-19世紀的平埔族〉荷蘭人來到臺灣後，將文字系統輸入鄰近荷蘭人的原住民部落，特別是最靠近大員（今臺南安平區）熱蘭遮城行政中心的西拉雅族新港社（今臺南新市區），最早設立教會學校（1636年），最先接觸文字教育，持續性也最久。因此，一些部落年輕人學會使用羅馬字來書寫自己的母語－新港語（SinkanLanguage），也曾被派到其他部落教導羅馬字。這新款的文字語言後來主要應用在契約文書上，被稱為「新港文書」（Sinkan Manuscripts），俗稱「番仔契」、「番仔字」","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/46"},{"n":280,"c":"G1","s":"哪一個原住民族群因遷徙而分布在南投、高雄、花蓮以及臺東等地？","o":["賽德克族","排灣族","布農族","卑南族"],"a":2,"e":"參考資料：原住民族委員會布農族主要原鄉有南投縣仁愛鄉、信義鄉，花蓮縣卓溪鄉、萬榮鄉，臺東縣延平鄉、海端鄉，高雄市桃源區、那瑪夏區等地，近年也有移居都會區的情形。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/F39C8394699DD2D6D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":281,"c":"A","s":"下列何者是太魯閣族人表演口簧琴舞的主要目的？","o":["避免受到邪靈侵擾","尋找合適對象","祈求農作物豐收","吸引動物"],"a":1,"e":"參考資料：達基力部落屋影音介紹太魯閣族的傳統樂器口簧琴。口簧琴是太魯閣族最古老的樂器，小巧玲瓏，攜帶方便，隨處可以吹奏，可分為單簧、二簧及四簧，最多為五簧。口簧琴可以在族人自娛時獨奏，或親朋好友齊聚一堂時合奏，同時具有歌謠伴奏的功能，尤其是唱「歡樂舞曲」時，一定要邊吹邊跳。男子有時也用來彼此較勁，吸引異性的注意，男女之間也常以吹奏口簧琴的方式傳達愛意，或藉著口簧琴思念已故親人及遠離的戀人。","u":"https://dageeli.culture.tw/home/zh-tw/movie1/481523"},{"n":282,"c":"P","s":"居住於屏東平原的平埔族人，是屬「鳳山八社」平埔族中的哪一族？","o":["大武壠族","西拉雅族","噶瑪蘭族","馬卡道族"],"a":3,"e":"參考資料：〈馬卡道族與鳳山八社變遷〉文／簡文敏（高苑科技大學資訊傳播系退休教授）鳳山八社主要分布於現今屏東平原（屏東縣屏東市、潮州鎮、內埔鄉、萬丹鄉、南州鄉、佳冬鄉、林邊鄉等地），是平埔馬卡道族的核心居住區。","u":"https://www.ntl.edu.tw/public/Attachment/551910451551.pdf"},{"n":283,"c":"S","s":"排灣族的領袖及貴族家的女子結婚時會在部落領袖的家屋前架設什麼來表示女子的純潔與高貴？","o":["鞦韆","琉璃拱門","陶壺","百合花圈"],"a":0,"e":"參考資料：屏東縣國家文化記憶庫：南國憶閾在排灣、魯凱兩族，均有結婚儀式與休閒型式的盪鞦韆。只有女子才能使用，如果男性使用，相傳以後就獵不到山豬，因此通常是女子盪男子搖，作為男女短暫接觸卻能相互聯誼的活動。","u":"https://southland.culture.tw/pingtung/zh-tw/YMevent?offset=0&limit=10&query=%7B%7D&sort=startDate&order=desc"},{"n":284,"c":"M","s":"下列哪一項不是原住民族各族神話傳說的主要內容？","o":["起源傳說","洪水傳說","聖誕老人傳說","射日傳說"],"a":2,"e":"參考資料：原住民族文獻網(首頁/文獻電子期刊/期刊內容)期刊〈臺灣原住民族神話傳說凸顯的功能與特色〉臺灣原住民族神話傳說豐富多樣，根植於對自然與祖靈的崇敬。核心故事包含創世起源（石生、竹生、樹生、壺生等）、射日傳說、大洪水神話，以及人與矮人（小矮人）互動等，反映各族對地理環境、狩獵祭儀及倫理禁忌的認知。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/332"},{"n":285,"c":"G2","s":"「親不知子斷崖」是早年穿越斷崖的原住民步道，請問此斷崖位於花蓮縣的哪一鄉鎮？","o":["壽豐鄉","萬榮鄉","豐濱鄉","玉里鎮"],"a":2,"e":"參考資料：發現東海岸網站 (首頁/目的地/景點快搜)「親不知子海上古道」由花蓮縣豐濱鄉公所 2017建設完工後對外開放，以鋼骨結構與強化玻璃，沿著海上懸崖峭壁垂直興建完成約 20公尺長的海上透明步道，近年已成為旅人蔚為風潮的花蓮旅遊打卡聖地。充滿悲傷的傳說故事「親不知子海上古道」位於海岸山脈的懸崖峭壁上，過去新社部落與磯崎部落往來聯絡的古道，其中一段便需沿著這段峭壁前行。相傳過去有一部落婦人，揹著孩子行經這段古道時，因木橋無繩索，只能依靠攀附峭壁生長的藤向前行走，婦人過度緊張，過了古道才發現孩子已經不見了。這則故事也說明過去交通不便，前人生活的艱辛不易。","u":"https://www.eastcoast-nsa.gov.tw/zh-tw/attractions/detail/267/"},{"n":286,"c":"P","s":"平埔各族群的傳統祭儀，「吉貝耍夜祭」和「頭社夜祭」是哪一族的祭典？","o":["道卡斯族","馬卡道族","西拉雅族","巴布薩族"],"a":2,"e":"參考資料：臺南市東山區公所網平埔族群曾是台灣大地的主人，「吉貝耍」(木棉花之意)的夜祭，可以讓我們再度識大地主人的真實生活。 被認為是西拉雅系蕭壠社現存最大族群的「吉貝耍」，位在東山區東河里，迄今每年農曆九月四日夜晚，仍依傳統舉行「阿立母夜祭」，並於初五中午時分舉行「哮海」，儀式神秘、罕見，與大內區頭社夜祭，同列為台南市境兩大坪埔祭典。","u":"https://dongshan.tainan.gov.tw/News_Content.aspx?n=6628&s=72750"},{"n":287,"c":"H1","s":"清領時期，清朝政府為什麼要劃分原住民族與漢人居住的區域？","o":["種族歧視","避免衝突","防止傳染疾病","語言不同"],"a":1,"e":"參考資料：「桃園縣文化景觀土牛溝調查研究暨保存維護計畫」成果報告清朝政府在台灣採取「原漢隔離」政策，透過設立「土牛溝」與「番界」，將台灣劃分為漢人耕墾區、熟番居地與生番（原住民）控制區，以減緩衝突、鞏固統治。此政策規範土地權屬，將原住民限制在淺山及高山，漢人則在界內活動。施添福教授研究指出，清政府在竹塹地區設置土牛溝與原住民地界之措施，將整個北臺灣土地劃分為漢墾區、保留區和隘墾區等三個人文地理區 22，在土牛溝西南側完全為漢人所掌控，原住民地界則已推至「生番」的地方了，「生番」所指者為居住於高山地區之原住民族，保留區則是夾雜在「生番」和漢民之間，以「熟番」居住其中，作為「生番」及漢人之間的緩衝地帶。","u":"https://reurl.cc/Q27dbo"},{"n":288,"c":"P","s":"明鄭時期，平埔族逐漸東遷，進入羅漢門地區。請問羅漢門地區是現今的何處？","o":["關廟區","左鎮區","杉林區","內門區"],"a":3,"e":"參考資料：台灣文學與跨國文化研究所網內門區是高雄旗山區最為古老的鄉鎮，古時稱羅漢門內門，旗山鎮則為羅漢門外門。「羅漢門」原為平埔族語譯而成，羅漢門之『羅漢』是譯自馬卡道族之稱呼，烏山山脈以東至楠梓仙溪一帶之地曾有清朝守軍在此派兵駐守，是為『門』。羅漢門以二仁、楠梓仙溪分水界上之大崎，分以東為羅漢外門里，以西為羅漢內門里，鄉內四周環山，中間是盆地，唯一出口處是二行曾溪流入田寮鄉交界的地方，兩岸青灰岩山地，像是雄偉的羅漢，所以先人就取名為「羅漢門」。直到 1953 年改稱為「內門鄉」，一直沿用至今。","u":"https://taiwan.nchu.edu.tw/DigitalFormosa/2018E/%E7%BE%85%E6%BC%A2%E9%96%80.html"},{"n":289,"c":"P","s":"高雄市的平埔族群多分布於甲仙、六龜、田寮等地，沿著荖濃溪和下列哪一條溪谷地居住？","o":["濁水溪","楠梓仙溪","高屏溪","旗山溪"],"a":1,"e":"參考資料：〈平埔文化復振：以高雄六龜頂荖濃部落的觀察為例〉撰文／國立高雄師範大學臺灣歷史文化及語言研究所碩士生 陳瑤玲國立高雄師範大學臺灣歷史文化及語言研究所碩士生 裴瑤高雄地區的荖濃溪與楠梓仙溪流域為平埔族群大武壠族（Taivoan）的傳統居住地，主要分布於今六龜、甲仙、杉林等地。該族群在此發展出獨特的「太祖」（阿立祖）信仰與祭祀文化，例如頂荖濃的公廨與夜祭。兩溪流域廣泛分布著河階地，是平埔族群長期開墾耕作的重要區域。由於地緣上鄰近楠梓仙溪、荖濃溪中游，大武壠熟番對當地地形應不陌生；除了地. 緣上鄰近界外生番地、調度方便外，由於該族群具備善戰的特質，因此被官方要求協助平亂。","u":"https://khm.org.tw/storage/files/1271/original/25473449295f62fc563f18c.pdf"},{"n":290,"c":"R","s":"原住民族運動曾提出「還我土地」、「還我母語」等訴求。請問：原住民族運動從何時開始發展？","o":["2000 年代","1980 年代","1960 年代","1940 年代"],"a":1,"e":"參考資料：原視界網-原住民族文化事業基金會從 1980年代開始的原住民族運動，在國家體制內取得階段性的成果，並逐漸從泛原住民運動，擴散至扎根於部落基礎的文化復振運動。在現今的後原運時代，原住民青年仍持續關心原住民族土地、生活、文化，乃至臺灣的整體社會問題，他們說：「原運之後，我們還在路上。」1983 年，當時就讀臺灣大學的泰雅族學生伊凡．尤幹與校內的原住民學生共同創辦雜誌《高山青》，提倡民族覺醒的呼聲，正式點燃了原運的狼煙。隔年，海山煤礦災變發生，多數罹難者為阿美族礦工，因而促使臺灣原住民權利促進會（簡稱原權會）成立，為臺灣第一個組織化的原運團體，由胡德夫擔任第一任原權會會長，原權會也成為 1980到 1990年代原運最主要的推手。值得一提的是，臺灣基督長老教會的眾多原住民牧者們，也是在這個時期最為重要的動員力量。","u":"https://insight.ipcf.org.tw/article/68"},{"n":291,"c":"F","s":"每年約4 月到5月布農族都會舉辦哪一個盛大的祭典，來展現其重要的獵人文化？","o":["聖貝祭","戰祭","射耳祭","大獵祭"],"a":2,"e":"參考資料：海端鄉公所網(首頁/人文、工藝/特色介紹/人文、工藝/布農族射耳祭)射耳祭是布農族的傳統祭儀之一，在布農族語中稱為 Malahtangia ，有「射鹿耳」之意，是布農族人一年之中最盛大的祭典活動。約在每年的四、五月間由頭目召集部落裡所有男性族人到祭場舉行祭儀，女性則不能參加。祭儀的過程會經過獵前槍祭、射耳儀式、分肉與祭骨儀式，以及報戰功酒宴等幾個流程。","u":"https://www.haiduau.gov.tw/home/index.php/2019-08-21-13-29-19/77-2019-08-20-07-45-07/2019-08-20-07-49-50/373-2019-08-21-13-25-50"},{"n":292,"c":"A","s":"公視於2003 年播出的電視劇《風中緋櫻》，其故事內容是以哪一原住民抗日事件為背景？","o":["牡丹社事件","大分事件","噍吧哖事件","霧社事件"],"a":3,"e":"參考資料：新聞報導〈「風中緋櫻」還原霧社抗日英雄事件〉【大紀元 2003年6 月1日訊】〔自由時報記者馮議賢╱南投報導〕古墓前、淒樂中、紀念碑下，公視根據霧社事件改編的「風中緋櫻」，昨天在南投霧社開鏡，來自川中島的泰雅賽德克族後裔，以幾乎要失傳的該族語言，向他們七十三年前抗日犧牲的先靈，稟報該劇即將開拍，原住民演員蘇清喜、田麗、馬志翔、高慧君、王志恩、王宏恩等人靜默一旁。","u":"https://www.epochtimes.com/b5/3/6/1/n322062.htm"},{"n":293,"c":"P","s":"臺灣平原在漢人未移入前，請問臺中盆地北部，原是下列哪一個平埔族群的活動地域？","o":["大武壠族","巴宰族","噶瑪蘭族","馬卡道族"],"a":1,"e":"參考資料：客新聞〈何來美專欄／探訪豐原、神岡原漢交融的足跡〉臺中盆地是巴宰族與閩客漢人融合的大本營，「大埔客」張達京與他的巴宰族外甥潘敦仔是靈魂人物，現豐原區豐圳公園還恭塑了兩人塑像；神岡區萬興宮也是兩人覲見雍正皇帝後，回程經福建湄州島迎回媽祖香火所建，已近三百年，見證原漢交融的歷史。巴宰族是台灣平埔族一支，活躍於台中盆地，閩粵漢人未來台前，偏向母系社會，岸里社（現神岡區岸裡里）頭目阿穆（又稱阿莫）於清康熙 55年（1716）歸順，當時台中市稱貓霧捒，阿穆歸順後，廣東客家人與福建漳州人陸續來此墾荒，娶巴宰族女或入贅的相當多。","u":"https://hakkanews.tw/2026/01/23/256106/"},{"n":294,"c":"P","s":"臺灣歷史文獻中出現的「岸裡社」及《岸裡文書》與下列哪一個平埔族群有關？","o":["大武壠族","巴宰族","噶瑪蘭族","馬卡道族"],"a":1,"e":"參考資料：歷史臺灣 國立臺灣歷史博物館館刊 第十五期〈「番、漢」合作？十八世紀岸裡社的「割地換水」與地方社會〉中央研究院臺灣史研究所博士後研究/鄭螢憶《岸裡文書》（岸裡大社文書）是研究清代至日治時期台灣中部平埔族（巴宰族）歷史的第一手珍貴史料，由岸裡社通事潘永安宅第發現。內容涵蓋土地契約、官方文書、社務檔案等，詳實紀錄了巴宰族與漢人土地經營、族群關係及社會變遷，對研究台灣原住民歷史具重要價值。","u":"https://reurl.cc/ep99xM"},{"n":295,"c":"E","s":"達悟族對魚的分類命名，不包括下列何者？","o":["男人魚","女人魚","老人魚","洄游性魚類"],"a":3,"e":"參考資料：臺灣史前文化雲(首頁/博物館/典藏庫/木盤)以漁獲作為食物主要來源的雅美族（達悟族）將魚種分為：老人魚、男人魚、女人魚三大類。老人魚是只有年長者才可食用的魚類，男人魚指皮粗、肉腥的魚種，通常僅供男人食用，女人魚則是味道較鮮美，肉質細膩的魚，女人魚不分性別皆可食用。","u":"https://icloud.nmp.gov.tw/Collection/CollectionContent?a=182&id=19950600009&Type=3&p=541"},{"n":296,"c":"E","s":"近來許多部落發展觀光與推展飲食文化，請問下列哪一個族以「野菜」為大眾所知？","o":["阿美族","排灣族","布農族","邵族"],"a":0,"e":"參考資料：原住民族委員會網阿美族因為植物採集知識的豐富，而善於將野菜應用於飲食中，因此又被戲稱為吃草的民族，部落中常見的野菜與植物有檳榔（’icep）、毛柿（kamaya/kafohongay）、麵包樹（apalo/facidol）等。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DBADF0287998968BD0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":297,"c":"R","s":"聯合國於哪一年設立「聯合國原住民常設論壇」，每年聽取並討論原住民族相關議題，並提出建議與合作？","o":["2000年","2004年","2006年","2010年"],"a":0,"e":"參考資料：原住民族委員會網聯合國原住民議題常設論壇 (UNPFII) 是聯合國經社理事會的高層諮詢機構，成立於 2000 年，旨在處理經濟、社會發展、文化、環境、教育、健康和人權等相關議題，並促進《聯合國原住民族權利宣言》的落實。論壇每年在紐約總部舉行，是台灣原住民族參與國際、發聲並爭取權利的重要平台。","u":"https://www.cip.gov.tw/zh-tw/news/data-list/865E99765D714714/index.html?cumid=865E99765D714714"},{"n":298,"c":"P","s":"請問臺灣第一個爭取正名，並成功獲得承認的平埔族是哪一族？","o":["撒奇萊雅族","馬卡道族","噶瑪蘭族","西拉雅族"],"a":2,"e":"參考資料：宜蘭縣史館網〔我們是噶瑪蘭-噶瑪蘭族復名運動三十年〕在復名運動屆 30年、正名 15年的 2017年，根據原民會的統計，戶籍登記為噶瑪蘭族者計 1,449人，其中花蓮有 646人、臺東111人；新北市 295人、桃園175 人，多屬都市移民。至於原鄉宜蘭則只有 10人，且多為花東遷回之族人。對許多族人而言，不具備噶瑪蘭族身分，猶如沒有身分，期盼綁住他們身分的「原住民身分法」能及早修法，讓噶瑪蘭族復名的最後一里路得以順利完成。","u":"https://oses.yihistory.e-land.gov.tw/kavalan30/legal.html"},{"n":299,"c":"R","s":"根據政府計畫，下列那座國家風景區欲建構成原住民文化、冒險旅遊之旅遊勝地？","o":["石梯坪遊憩風景區","鯉魚潭風景遊憩","大尖山風景區","茂林國家風景區"],"a":3,"e":"參考資料：茂林兒童網站茂林國家風景區境內擁有豐富的原住民文化，如分布於三地門鄉及瑪家鄉的排灣族、霧台鄉的西魯凱族、茂林區的下三社魯凱族、桃源區的布農族及拉阿魯哇族等。每個族群各有自己特殊的歷史發展與文化意涵，如石板屋、傳統服飾、各式圖騰、活動祭典、歌舞表演等，是原住民最具代表的文化特色，尤其精湛工藝更是現代社會難以比擬的珍貴傳承，純手工製作，獨一無二。","u":"https://reurl.cc/6GabXZ"},{"n":300,"c":"H1","s":"清治前期為避免漢人與原住民衝突，禁止人民進入東部開墾，直到哪位官員來臺實施開山撫番，漢人才可自由進入東部開發？","o":["沈葆楨","丁日昌","劉銘傳","邵友濂"],"a":0,"e":"參考資料：史耘第 9期2003年9月〈晚清「開山撫番」與臺灣後山太魯閣族群勢力之變遷〉作者: 潘繼道沈葆楨的「開山撫番」是 1874 年牡丹社事件後，清廷為強化對臺灣的統治與國防所採取的激進開發政策。防海目的，沈葆楨認為「開山」是為了「撫番」，「撫番」是為了「防海」（防止外國入侵）。行政調整：增設「恆春縣」、「臺北府」、「卑南廳」等，加強對後山（東部）管理。兩極化評價：在漢人視角下促進了東部開發，但在原住民視角下是一場毀滅性的文化入侵與生存權爭奪。開山撫番使得清帝國的統治權實質深入臺灣深山與後山地區，但也造成與原住民族間不可逆的衝突與傷痛。","u":"https://www.his.ntnu.edu.tw/publish03/downloadfile.php?issue_id=37&paper_id=234"},{"n":301,"c":"H1","s":"要攀登臺灣第一高峰玉山，會經過清領時期開發的八通關古道，請問當時開發這條道路是為了配合什麼政策？","o":["開山撫番","渡臺禁令","畫界封山","開港通商"],"a":0,"e":"參考資料：國家文化資產網(首頁 &gt; 古蹟 &gt; 八通關古道)八通關古道位於南投縣竹山鎮至花蓮縣玉里鎮之間，為清光緒元年（1875年）所開闢的古道，於民國七十六年（1987年）四月十七日，經內政部公告指定為臺閩地區第一級古蹟。清同治十年（1871年），有琉球宮古島民因風漂流到臺灣南部的八瑤灣，因誤入牡丹社，為社民所殺。日本一向覬覦臺灣並以琉球宗主國自居，故於同治十三年（1874年），以懲兇為由發兵臺灣。清廷見事態嚴重，派總理福建船政大臣沈葆楨以欽差身份來臺，督辦臺灣防務事宜。沈葆楨抵臺後，除一方面從事戰備與對日交涉外，亦同時對原住民展開撫綏工作，防其為日人所利用。","u":"https://nchdb.boch.gov.tw/assets/overview/monument/19870417000001"},{"n":302,"c":"A","s":"邵族人將杵音與人聲演唱結合變成杵歌，進而使「湖上杵聲」成為下列哪個地方的八景之一？","o":["七星潭","鯉魚潭","杵音潭","日月潭"],"a":3,"e":"參考資料：1.國家文化記憶庫(日月潭邵族杵歌)日月潭邵族聞名的杵音是以長短不同的杵棒敲擊地面的石板，奏出鏗鏘的旋律，後來這項優美的音樂演奏，被推廣宣傳為邵族重要的觀光表演活動，日本時代出版許多以「蕃家杵聲」、「湖上杵歌」等標題之海報和明信片，讓邵族與日月潭聞名遐邇。1922 年《臺灣日日新報》也曾報導過日月潭八景之一「蕃社杵聲」，即為日月潭邵族的音樂表演。2.邵族杵音與歌唱(典藏者/國立傳統藝術中心臺灣音樂館)邵族的「杵音」（以木杵擊搗在石板或石臼上成音）非常有名，代表邵族文化、象徵豐收。舂石音是邵族文化之最主要特色之一，每年農曆七月底在頭人袁家祖宅舂起石音，即是豐年祭的前奏。","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=MOCCOLLECTIONS&id=11000060012https://openmuseum.tw/muse/digi_object/02fe5a7f5a7feab82117edcc779a7cf2"},{"n":303,"c":"F","s":"「小米播種祭」是臺灣中部地區哪一個原住民族傳統的祭典活動？","o":["布農族","邵族","賽德克族","賽夏族"],"a":0,"e":"參考資料：臺灣原住民族文化知識網(首頁/臺灣原住民族文化知識網/樂舞文化)每年 11 ∼ 12月之間，布農人舉行小米播種祭，為了祈求小米能夠豐收，在祭儀結束前會在家屋前選擇資格符合的家中男子圍成一圈，一起合唱「祈禱小米豐收歌」。族人相信，祈禱時所唱出的合音越美、越和諧，天神喜悅，該年的小米就會結實累累，因此每一個人都抱著虔敬的心歌唱。歌曲一開始，其實只有四部合音，但當音域高到某個層次時，音軌會出現八個不同的音階，因此被世人稱之為八部合音，這也是目前世界上獨一無二的和音方式。","u":"https://knowlegde.gov.taipei/News_Content.aspx?n=14C98776E8FB3BC7&sms=515B12A7D2BA3A4B&s=66046507810A03B5"},{"n":304,"c":"C","s":"原住民族的傳統服飾大多以什麼材質為主？","o":["絲綢","麻布","樹葉","竹子"],"a":1,"e":"參考資料：開放博物館網-原住民服飾阿美族的衣服叫 Riko 或Fodoy，原料有四種，以麻、皮革為主，樹皮布、草和藤次之。賽夏族的服飾給人的第一個印象就是與泰雅族極為相似，可能是因地域相鄰的關係所造成。但賽夏族的服飾大多有卍字形的花紋，這是泰雅族所沒有的，傳統的日常服飾以麻布為主，棉布次之。","u":"https://plaza.openmuseum.tw/muse/exhibition/986a58a237c269beef2777f1ee358568"},{"n":305,"c":"R","s":"政府為了保存原住民文化，在屏東哪裡設立「行政院原住民文化園區」？","o":["瑪家鄉","泰武鄉","春日鄉","來義鄉"],"a":0,"e":"參考資料：原住民族委員會原住民族文化發展中心網站(關於我們／組織沿革)民國 86年7月1日改隸台灣省政府原住民事務委員會，更名為「台灣原住民文化園區管理局」，民國 88年 7月1日省虛級化（精省），改隸行政院原住民委員會，機關名稱改為「行政院原住民委員會文化園區管理局」，民國 91 年3月25日奉行政院令更名為「行政院原住民族委員會文化園區管理局」，民國 105年 1月15日，改組更名為「原住民族委員會原住民族文化發展中心」，仍隸屬原住民族委員會。冀期藉由公部門文化園區主題性的存在，不斷累積其文化詮釋能量；也讓國內外人士藉由文化知性之旅的過程，瞭解並尊重台灣原住民族文化。","u":"https://www.tacp.gov.tw/about/about-center?lang=zh-TW"},{"n":306,"c":"P","s":"大內區境內仍保有西拉雅族人祭祀祖靈的建物，我們稱為什麼？","o":["祖靈屋","會所","望樓","公廨"],"a":3,"e":"參考資料：台南旅遊網頭社太上龍頭忠義廟「西拉雅公廨」太上龍頭忠義廟位於大內頭社，雖名為「廟」，但實際上是平埔族西拉雅族的「公廨」，指的是族人祭祀「太祖」（又稱阿立母、阿立祖、老君）的地方（以廟為名，則是受到早期內政部寺廟登記的規定所限）。日本時代的頭社公廨為草寮搭建，戰後才改建為黑瓦磚造房舍，但維持著三面壁、無廟門的傳統公廨造型。","u":"https://www.twtainan.net/zh-tw/attractions/detail/1004/"},{"n":307,"c":"E","s":"早期原住民族耕種時，會先砍伐一塊林地並以火焚燒，利用灰燼作為肥料，耕種數年後再另找新耕地，請問這是哪一種耕作方式？","o":["採集","水耕","精耕","游耕"],"a":3,"e":"參考資料：翰林雲端學院游耕特色「火耕」取得地力：在乾季末期燒毀森林，藉由灰燼增加土壤肥力。不施肥、不除草、不灌溉：屬於粗放農業，依賴自然的肥力與雨水。耕地遷移（輪耕）：土壤肥力耗盡後（約 2-3年）就會放棄並另闢新地，部落常因此遷徙。低人口密度地區：由於環境負荷力低，需要極大的空間面積。環境影響：若休耕期過短或人口壓力增加，會導致土壤貧瘠、森林毀損，甚至導致土地沙漠化。","u":"https://www.ehanlin.com.tw/app/keyword/%E9%AB%98%E4%B8%AD/%E5%9C%B0%E7%90%86/%E6%B8%B8%E8%80%95.html"},{"n":308,"c":"H1","s":"鄭氏政權在統治臺灣原住民時雙方常發生衝突，其中以中部地區何者與鄭氏政權的衝突最為激烈？","o":["西拉雅族","大肚王國","泰雅族","賽德克族"],"a":1,"e":"參考資料：專欄文章-【臺灣通史】中臺灣最強咒術師的殞落：抵禦荷、鄭、清政權的大肚王國興衰史鄭氏王朝的拓墾讓漢人的足跡在臺灣散布，與此相對的，便是原住民部落面臨漢人欺壓、威脅，許多部落不得不因此遠離漢人侵墾的區域。但被侵犯生活領域的原住民也不坐以待斃，1668 年發生水沙連社的原住民合力擊殺鄭氏參軍林圯的事件，此次反擊還造成不少鄭軍兵士陣亡。接獲消息的鄭軍隨即加派重軍出陣，鎮壓當地原住民。1670年發生了幾乎讓水沙連社滅社的殘忍屠殺，而這當然也不是唯一一起鄭氏王朝對原住民的報復鎮壓。1670 年，原本隸屬於大肚番王的沙轆社（Salach）與大肚社、斗尾龍岸社再也忍受不了漢人的侵擾，聯合舉兵反抗鄭軍。鄭軍將領劉國軒率軍前往半線（今彰化市一帶）征討這些反抗的部落。兵強馬壯、武器精良的鄭軍在人數優勢之下，很快地焚毀了沙轆社，甚至屠殺沙轆社一百餘人，最後僅有 6 人倖存，這場大屠殺被稱為「沙轆社之役」。沙轆社之役後，大肚社的原住民攜家帶眷遷往埔里社，到北港溪一帶等待鄭軍撤退後才敢返回部落。","u":"https://storystudio.tw/article/gushi/the-history-of-Kingdom-of-Middag"},{"n":309,"c":"P","s":"牽曲是哪一族的音樂？","o":["魯凱族","泰雅族","阿美族","西拉雅族"],"a":3,"e":"參考資料：西拉雅國家風景區管理處網站-參與部落儀式「牽曲」通常由女性擔任，赤腳、雙手交叉牽圍成圈，配合簡單的二進一退舞步，並以古語吟唱，悠悠的歌聲可能是描述 7 年饑荒的祈雨，或是懷念祖先庇佑的「望母調」，是西拉雅族「夜祭」祭典中敬神娛神不可或缺的一項儀式。","u":"https://www.siraya-nsa.gov.tw/zh-tw/about-siraya/sacrificial-ceremonies"},{"n":310,"c":"A","s":"哪一族的八部合音曾經在2008年奧運會上表演，享譽國際?","o":["布農族","泰雅族","魯凱族","阿美族"],"a":0,"e":"參考資料：中華藝術網-藝術精華〈布農八音等 國寶級原民文化〉2008/07/06 04:33 高有智台灣原住民團體前往參加北京奧運開幕式，表演節目融合布農族的八部合音、卑南族的舞蹈與達悟族的頭髮舞，這些都是國寶級的原住民文化資產，也讓全世界有機會可以見證台灣原住民多元之美。布農族舉凡狩獵、農耕、祭典及日常生活，都與合唱音樂密不可分。根據學者研究，布農族的八部音合唱宛如一首泛音祈禱歌，尤以《祈禱小米豐收歌》最為知名，這也是民族音樂學上的一大發現。","u":"https://www.artworld.tw/content/meet/act.aspx?id=58"},{"n":311,"c":"H1","s":"清治前期的臺灣，泰雅族最有可能會以何項商品與山下的漢人進行交易？","o":["茶葉","稻米","鹿皮","棉花"],"a":2,"e":"參考資料：點集臺灣史(首頁/常設展品/鹿皮)臺灣的氣候環境處於熱帶與亞熱帶地區，天然環境上擁有豐富的森林與水草，形構臺灣早期動植物的豐富多樣。鹿主要棲息於臺灣的山林中，在 1603 年陳第的《東番記》中曾記載：「山最宜鹿，儦儦俟俟，千百為群」，並提及狩獵方法，及漳州、泉州一帶居民以瑪瑙、磁器、布、鹽、銅、簪環等交易鹿脯、鹿皮、鹿角的情景。","u":"https://the.nmth.gov.tw/nmth/zh-tw/Item/Detail/93770edc-1cd8-4f01-b6f1-55a5ba9e87ef"},{"n":312,"c":"P","s":"高雄舊名「打狗」源自於平埔族「馬卡道族」族語「takau」。「takau」意思為何？","o":["山地","楓樹","竹林","樟樹"],"a":2,"e":"參考資料：大紀元時報〈什麼，「高雄」這兩個字竟源自這植物？！〉「takau」是什麼呢？就是刺竹林，刺竹這種竹子會長出尖尖的刺，被這原住民當圍牆抵禦來犯的日本倭寇、中國海盜，他們也把自己所處地名稱作 takau，高雄就是從這個詞演變來的。","u":"https://www.epochtimes.com/b5/18/4/2/n10269676.htm"},{"n":313,"c":"M","s":"彩虹橋的傳說是哪一個原住民族?","o":["鄒族","泰雅族","阿美族","卑南族"],"a":1,"e":"參考資料：專欄文章〈淺說台灣原住民的彩虹神話與彩虹橋傳奇〉泰雅族人也認為，善於織布的女性死後，如果在橋頭讓織布機發出聲音，那麼擅於織布的神靈將會前來迎接她，幫助她平安過橋而不會滑落橋底；而不擅於織布的女性，則不讓她過橋。此外，彩虹是獵得人頭者通行的橋，沒有獵頭經驗的人，是絕對過不去的，而自殺的人或被人砍了頭的亡魂，也不能通過神靈之橋，他們相信每當彩虹出現時，必有人死。而獵頭者死了之後，「神靈的頭目」會在彩虹橋頭等他，要他洗手給自己看，如果有血湧出，則讓他過橋，沒有血湧出的人，則讓他走其他的崎嶇道路。","u":"https://atayalthesis.wordpress.com/2016/08/28/rainbow-bridge/"},{"n":314,"c":"G2","s":"位於花蓮砂卡礑溪上游的大同部落，以清水斷崖美景聞名。請問該部落屬於哪一原住民族群？","o":["阿美族","泰雅族","太魯閣族","賽德克族"],"a":2,"e":"參考資料：1.原住民族電視台〈砂卡礑尋根 閱覽太魯閣族歷史軌跡〉記者-咪敏 拿拓 花蓮砂卡礑採訪報導花蓮砂卡礑溪上游的核心部落為大同部落（又稱砂卡礑部落、Skadang），位於太魯閣國家公園內，舊名意為「臼齒」。該地過去為太魯閣族聚落，位於砂卡礑步道尾端上方，是從事歷史探訪、生態體驗及連結大禮部落的關鍵高山聚落，通常需透過健行前往。","u":"https://www.ipcf.org.tw/%3B/News/Detail?newsId=220519144833364522.太魯閣國家公園-砂卡礑步道介紹https://www.taroko.gov.tw/ch/trailsAttractions/trail-list/41"},{"n":315,"c":"C","s":"屏東春日鄉有台灣保留最完善、數量最多、格局最完整的傳統建築聚落，請問該部落為何？","o":["老七佳部落","禮納里部落","神山部落","舊達來部落"],"a":0,"e":"參考資料：原住民族文獻(首頁/文獻電子期刊/期刊內容)期刊〈埋藏在綠色叢林中的寶藏：tjuvecekadan 七佳部落〉Tjuvecekadan（七佳）部落歷史存在已超過四百年以上，根據部落長老描述，七佳部落原來是從 padain 發源，然後再遷徙到 kaljevuan（舊歸崇），當時 kaljevuan（舊歸崇）部落是眾多族群聚居之地，而七佳部落族人所聚居的位置，正好位於其他部落的「中央」，〔1〕「tjuvecekadan」因此得名。之後，當時老七佳地區正是族人所掌管的傳統狩獵場域，每到農閒時期，族人前往七佳地區進行狩獵，數量豐沛的野生動物如野豬、山羊、山羌、水鹿、黑熊等，讓每次狩獵都能夠滿載而歸，獵人因而受到部落的族人景仰與愛戴。但 kaljevuan（舊歸崇）因聚居人口擴展至極限，無法負荷更多的人，而且受到靈犬招引，大家都認為七佳地區獵物豐富，林木繁盛，水源豐沛，土壤肥沃，是一個遷徙建立新部落的好天地，於是又再次舉族遷徙，建立了tjuvecekadan（七佳）石板屋部落。","u":"https://ihc.cip.gov.tw/EJournal/EJournalCat/295"},{"n":316,"c":"G2","s":"排灣族以哪一山脈為中心成輻射狀散居在高雄、屏東及台東縣境內？","o":["玉山山脈","大武山山脈","阿里山脈","合歡山脈"],"a":1,"e":"參考資料：原語論壇文章〈排灣語的玉山〉文︱Valjieluk Mavaliu 華阿財（旮伏龍安文史工作室負責人）玉山係台灣中部原住民各族的聖山，排灣語的傳統稱謂為 kadjumuan，意為「突出之地」；有一些族人亦稱之為 nanasian，意為「生命之山」，nanasi 是「呼吸」之意。從中部的玉山延伸到南部，便屬大武山最高。大武山位於中央山脈的南端，海拔 3,092公尺，分為北大武山和南大武山。排灣語稱「北大武山」為 tjagaraws，「南大武山」為 kavulungan。而南大武山和北大武山，亦合稱為 kavulungan。","u":"https://d17u3w3ts5ihmp.cloudfront.net/storage/app/public/files/1488.pdf"},{"n":317,"c":"C","s":"月桃的編織品，像月桃蓆、籃等，是哪一族獨特的手工藝品？","o":["鄒族","泰雅族","魯凱族","卑南族"],"a":2,"e":"參考資料：微笑臺灣專欄文章〈屏東霧台神山部落的編織文化，從日常、飲食到現代文創，以月桃記憶魯凱族人的一生〉魯凱族社會裡，分工明確，編織、刺繡屬於女性專司，部落甚至還有專為全體女性而蓋的織布屋，為男性的禁地。在過去，月桃編織是部落婦女的必備技能，各種編法都難不倒她們，「魯凱族的家屋幾乎都是石板構成，又住在海拔高的地方，席地而坐太冰冷，一定要有月桃蓆墊在石板上，隔絕低溫。」","u":"https://smiletaiwan.cw.com.tw/article/6575"},{"n":318,"c":"P","s":"位在新北市八里區的十三行文化與哪兩個原住民族有關？","o":["凱達格蘭族和邵族","凱達格蘭族和泰雅族","凱達格蘭族和噶瑪蘭族","凱達格蘭族和卑南族"],"a":2,"e":"參考資料：開放博物館十三行遺址，作者 劉茂源、李匡悌｜典藏者 中央研究院歷史語言研究所1959 年時，時任國立臺灣大學考古人類學系的石璋如教授，帶領同學來遺址進行考古發掘。從出土的石器、陶器、鐵器、玻璃珠和墓葬遺留，推測可能是北部平埔族凱達格蘭及噶瑪蘭部落的史前文化堆積。","u":"https://openmuseum.tw/muse/digi_object/64ddad27aab61009c914cbd716f359ef"},{"n":319,"c":"G2","s":"知本溫泉是出名的溫泉區其附近區域，是哪一族群的領域?","o":["鄒族","泰雅族","魯凱族","卑南族"],"a":3,"e":"參考資料：公視紀錄片 我們的島〈溫泉的記憶〉2002-03-11 00:00採訪-于立平 達卡爾，攝影-達卡爾沿著知本溪卑南族的祖先，在這塊土地上耕種打獵發展歷史，現在部落的族人靠著知本溫泉養家活口，走過千百年歷史的知本溪，依舊在祖先的土地上，蜿蜒而過，雖然溪水不再清澈，溫泉治病的傳統早已變了樣。知本溫泉的發展演進，和台灣大多數的溫泉區幾乎一模一樣，在日據時代，日本人興建公共浴池與賓館泡溫泉，就漸漸由溪邊往岸上移動；光復之後，溫泉區第一家知本大飯店設立，部落族人的生活也開始離知本溪愈來愈遠。","u":""},{"n":320,"c":"A","s":"由郭英男、郭秀珠等人演唱的《老人飲酒歌》被擷取收錄於1996年亞特蘭大奧運宣傳曲中，請問這是哪一族的傳統古調？","o":["阿美族","卑南族","雅美族","賽夏族"],"a":0,"e":"參考資料：臺灣光華雜誌-專欄文章〈1996「原」本的聲音，「原」本的名〉文‧陳建瑋2015 年12月1996 年亞特蘭大奧運的宣傳短片裡，滄桑中混著海水、泥土味道的歌聲與電子樂結合，驚艷全世界。這歌聲來自台灣，阿美族的里望（漢名郭英男）和妻子以蓋，這首歌收錄在歐洲樂團《謎》的專輯裡，熱賣 500萬張。這首奧運主題曲，讓世界聽見台灣原住民的聲音，也看見原住民的困境。《光華》在 1996 年8月號的封面故事中，剖析了這首〈返璞歸真〉引發的著作權、人權爭議，點出部落傳統文化，面對現代社會時，遇上的種種難題；報導中並進一步介紹阿美族的歌謠文化，不需要固定的歌詞、歌名，就能自然合唱成歌，對外人來說難以理解，在阿美族而言卻是自然而然的事。","u":"https://reurl.cc/EmpVMv"},{"n":321,"c":"H2","s":"日治時期所開闢「八通關越嶺道路」與「關山越嶺道」，是為了圍剿哪一族勇士?","o":["布農族","泰雅族","魯凱族","卑南族"],"a":0,"e":"參考資料：尋路:‧循路-臺灣原住民族古道空間資訊網橫跨高雄市六龜區和臺東縣關山鎮的關山越嶺古道，始於 1921年闢建，西起六龜、東抵關山，全長約 171公里，過去南部橫貫公路修建時，大致是沿著關山越嶺古道修築而成。日治初期，由於臺灣總督府推行理蕃計畫，沒收槍枝，引起布農族聯合抗日，因而開始在南部開鑿多條越嶺道路，沿路設置駐在所，甚至配置砲臺壓制原住民。時至今日，關山越嶺古道已被南部橫貫公路取代，先後歷經集集大地震和莫拉克風災，古道路段柔腸寸斷，僅殘留部分遺跡。","u":"https://trail.tacp.gov.tw/zh-hant/ExploringHistoricTrails/GuanshanHistoricTrail"},{"n":322,"c":"H1","s":"清朝時，沈葆楨開山撫番，在「加禮宛事件」中，哪一個原住民族群遭清軍屠殺?","o":["卡那卡那富足族","撒奇拉雅族","拉阿魯哇族","太魯閣族"],"a":1,"e":"參考資料：臺灣原住民族文化知識網撒奇萊雅族簡介，火神祭典（palamalan a lisin）火神祭以光緒4 年（1878）加禮宛事件為祭典核心概念，屬於跨部落的全族紀念性活動。加禮宛事件發生時，達固部灣部落（Takubuan）是當時最大的部落，部落外圍種有刺竹防禦。清兵因刺竹隔離而無法接近部落，最後引火射箭攻擊，造成部落茅草屋燒毀、族人傷亡。之後，族人因分散各地而無法祭祀事件中傷亡先祖。撒奇萊雅族因遭歷史事件的祝融吞噬，而致民族文化發展受挫。歷經一世紀後，族人以火神祭典弔唁祭祀傳統領袖夫婦以及在加禮宛事件中犧牲的族人。火神祭典除了紀念歷史事件外，更具有凝聚民族認同的意義。火神祭典的儀式有：一、迎神，二、祈福，三、繞境，四、祭神，五、送神。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/588FAD20D4E16D65D0636733C6861689/info.html?cumid=D0636733C6861689"},{"n":323,"c":"P","s":"萬華舊稱艋舺，是原住民語「Manka」的譯音，「Manka」意義為何？","o":["郵輪","拼板舟","帆船","獨木舟"],"a":3,"e":"參考資料：吳三連臺灣史料基金會網站〈從地名考察台北市歷史 Using place names to look at Taipei’s history〉戴寶村／Tai Pao-Tsun（中央大學歷史系教授）“Manka” is a word meaning “canoe” in one of the Pingpu languages.This picture shows a covered arcade in a street in Manka in the 1931.台北盆地原先是一般通稱凱達格蘭平埔族原住民居住、生活之地，平埔族和漢人長期接觸後已喪失其族群與文化特質，但仍留下一些常見的地名，如「大屯山」源自平埔族的社名，荷蘭時代寫作 Touckenan，「北投」原來拼音字為 Kipatauw是「女巫」的意思，士林地區舊名「八芝蘭」意思是溫泉，松山舊名錫口，內湖地區的「塔悠」荷語拼音為 Cattajo，是指婦女的頭飾，「大龍峒」原名「大浪泵」和「秀朗」都是平埔族的社名，「艋舺」是指獨木舟，「社子」是漢人指稱平埔族的部落所在。","u":"https://www.twcenter.org.tw/thematic_series/history_class/tw_window/e02_20010917"},{"n":324,"c":"F","s":"拉阿魯哇族有一項較不同於他族的祭儀，每隔兩三年舉行一次的是什麼祭典?","o":["矮靈祭","聖貝祭","火神祭","祖靈祭"],"a":1,"e":"參考資料：原住民族委員會網站相傳族人原居地在東方 Hlasʉnga，曾與矮人共同生活；矮人視「聖貝（takiarʉ）」為太祖（貝神）居住之所，每年舉行大祭以求境內平安、農獵豐收、族人興盛。族人離開原居地時，矮人贈以一甕聖貝，族人亦如矮人般舉行「聖貝祭（miatungusu）」。祭儀最重要的部分是「聖貝薦酒」儀式：將聖貝浸在酒裡，察其顏色變化，如果變成紅色則表示太祖酩酊之狀，意味祭典圓滿成功。","u":"https://www.cip.gov.tw/zh-tw/tribe/grid-list/DE7E75BDD1F53F90D0636733C6861689/info.html?cumid=8F19BF08AE220D65"},{"n":325,"c":"C","s":"太魯閣族服飾幾何圖案以哪種形狀為主?","o":["菱形","圓形","長方形","三角形"],"a":0,"e":"參考資料：原住民族事典-太魯閣族服飾太魯閣族的服飾以輕、薄、素、淨著名，服飾多半以白色苧麻為底，局部織以色線形成紋樣。紋樣多以菱形紋為主，並以單獨的形式出現。","u":"https://aborgpedia.alcd.center/detail?id=10051&search=&cat=0&race=0&writer="},{"n":326,"c":"M","s":"泰雅族與太魯閣族都有「彩虹橋」的嚮往之地，「彩虹橋」象徵甚麼?","o":["家族旅遊地","情人約會地","榮耀祖先的安息之地","宣揚武力之力"],"a":2,"e":"參考資料：專欄文章〈淺說台灣原住民的彩虹神話與彩虹橋傳奇〉泰雅族人也認為，善於織布的女性死後，如果在橋頭讓織布機發出聲音，那麼擅於織布的神靈將會前來迎接她，幫助她平安過橋而不會滑落橋底；而不擅於織布的女性，則不讓她過橋。此外，彩虹是獵得人頭者通行的橋，沒有獵頭經驗的人，是絕對過不去的，而自殺的人或被人砍了頭的亡魂，也不能通過神靈之橋，他們相信每當彩虹出現時，必有人死。而獵頭者死了之後，「神靈的頭目」會在彩虹橋頭等他，要他洗手給自己看，如果有血湧出，則讓他過橋，沒有血湧出的人，則讓他走其他的崎嶇道路。","u":"https://atayalthesis.wordpress.com/2016/08/28/rainbow-bridge/"},{"n":327,"c":"G2","s":"八通關古道橫貫南投縣與花蓮縣，沿途大都是哪一族群的傳統居住領域?","o":["布農族","泰雅族","魯凱族","卑南族"],"a":0,"e":"參考資料：國家文化資產網(首頁 &gt; 古蹟 &gt; 八通關古道)八通關古道位於南投縣竹山鎮至花蓮縣玉里鎮之間，為清光緒元年（1875年）所開闢的古道，於民國七十六年（1987年）四月十七日，經內政部公告指定為臺閩地區第一級古蹟。清同治十年（1871年），有琉球宮古島民因風漂流到臺灣南部的八瑤灣，因誤入牡丹社，為社民所殺。日本一向覬覦臺灣並以琉球宗主國自居，故於同治十三年（1874年），以懲兇為由發兵臺灣。清廷見事態嚴重，派總理福建船政大臣沈葆楨以欽差身份來臺，督辦臺灣防務事宜。沈葆楨抵臺後，除一方面從事戰備與對日交涉外，亦同時對原住民展開撫綏工作，防其為日人所利用。","u":"https://nchdb.boch.gov.tw/assets/overview/monument/19870417000001"},{"n":328,"c":"H1","s":"荷蘭時期曾利用平埔族人弭平的漢人反抗的是哪一事件？","o":["林爽文事件","朱一貴事件","郭懷一事件","余清芳事件"],"a":2,"e":"參考資料：專欄文章〈郭懷一事件及其研究〉文/鄭維中(中研院臺史所博士培育計畫)1651 年爆發於今臺南的漢人大規模反抗荷蘭事件。事件首領郭懷一，荷蘭文獻記為 Gouqua Faet/Faijet（五官懷一），中國福建同安人。同時被捕之事件頭領，還有黑嘴鬚（荷蘭文獻記為 Sinco Swartbaart）、Laueko、Tsiecko等，都是從事農業開墾活動的漢人農場主、頭人。郭懷一在荷蘭據臺初期，移居今臺南縣(註 1)永康市(註 2)車行一帶，漢人在此種植麻、米等經濟作物，因此發展成交易市集，即油車行村，荷蘭文獻記為 Smeerdorp。","u":"https://www.ntl.edu.tw/public/Attachment/22917121939.PDF"},{"n":329,"c":"G2","s":"宜蘭縣南澳鄉的東岳社區，是下列哪一個原住民族青年結合專長及長輩的智慧建立社區產業?","o":["布農族","泰雅族","魯凱族","卑南族"],"a":1,"e":"參考資料：宜蘭縣南澳鄉公所東岳村簡介宜蘭縣南澳鄉的東岳社區（東岳村）是一個以泰雅族（馬巴阿拉亞群）為主的聚落，位於蘇花公路旁。該社區致力於傳統文化復振、小米復耕與社區營造，擁有獨特的泰雅樂舞文化、段木香菇與文旦等農產，並積極推動黑熊生態保育，是充滿自然與原民風情的部落。","u":"https://reurl.cc/Q2jaD9"},{"n":330,"c":"H2","s":"卑南族人於日本統治時期，哪種作物的種植受到政策鼓勵與支持，耕作面積大量增加?","o":["小米","地瓜","玉米","稻米"],"a":3,"e":"參考資料：原住民族委員會網卑南族生活圖像-產業介紹卑南人最早的農作物為小米，後來才有禾、麻、菽、麥等作物的出現。水稻耕作技術與器物，在十八世紀由卑南王 Pinadray 引進，讓農業生產與技術興盛一時。日本殖民統治時期，水稻受到政策鼓勵與支持，耕作面積大量增加。民國 50年代（1960 年代）之後，部分作物則轉為釋迦與荖葉等經濟性作物。","u":"https://reurl.cc/gr0Yo4"}];

let pending=false,saveT=0,syncS='ok';
function setSync(s){syncS=s;const el=$('#sync');if(!el)return;el.dataset.s=s;el.textContent=me.preview?'老師預覽，不記錄':s==='ro'?'這台裝置沒有登入老師的帳號，紀錄只存在這台裝置':s==='ok'?(DEMO?'紀錄只存在這台裝置':'已存到後台'):s==='saving'?'儲存中…':'紀錄先存在這台裝置，連上後台會自動補送'}
function save(){
  if(me.role!=='student')return;
  state.t=Date.now();state.dev=DEV;
  if(me.preview)return;
  LS.set(SKEY(),state);pending=true;LS.set(PKEY(),1);
  clearTimeout(saveT);saveT=setTimeout(flush,900);setSync('saving');
}
let flushing=false;
async function flush(){
  if(!pending||me.role!=='student'||me.preview||flushing)return;
  flushing=true;try{await flush1()}finally{flushing=false}
}
async function flush1(){
  const v=state.t,c=me.cls,s=me.seat,rec=Object.assign({},state,{seat:s,stage:'state'});
  try{await API.save(c,s,'state',rec);
    if(me.role==='student'&&me.cls===c&&me.seat===s){if(state.t===v){pending=false;LS.set(PKEY(),0);setSync('ok')}else{clearTimeout(saveT);saveT=setTimeout(flush,900)}}
    else LS.set(`${LK}-pending-${c}-${s}`,0);
  }catch(e){if(MODE==='cloud'&&e&&e.code==='invalid_argument'){setSync('ro');return}setSync('err');clearTimeout(saveT);saveT=setTimeout(flush,5000)}
}
async function enterStudent(cls,seat){
  await ready();
  me.role='student';me.cls=cls;me.seat=seat;me.preview=false;me.key=null;
  LOGIN.set({cls,seat,role:'student'});
  state=Object.assign(fresh(),LS.get(SKEY(),{}));
  pending=!!LS.get(PKEY(),0);
  let clash=false,ok=true;
  try{const j=await API.mine(cls,seat);const r=(j.recs||[]).find(x=>x.stage==='state');
    if(r&&(r.t||0)>(state.t||0)&&!pending){
      if(r.dev&&r.dev!==DEV&&Date.now()-(r.t||0)<600000)clash=true;
      state=Object.assign(fresh(),r);delete state.seat;delete state.stage;LS.set(SKEY(),state)}
  }catch(e){ok=false}
  if(me.role!=='student'||me.seat!==seat)return;
  render(true);setSync(ok?(pending?'saving':'ok'):'err');
  if(pending)flush();
  if(clash)seatClash();
}
function enterPreview(cls){me.role='student';me.cls=cls;me.seat='T';me.preview=true;state=fresh();Object.keys(FIGS).forEach(id=>{state.figs[id]=1});render(true)}
function logout(){
  if(pending)flush();
  clearInterval(pollT);LOGIN.set(null);me.role=null;me.seat=null;me.key=null;me.preview=false;state=fresh();
  const b=$('#clashBar');if(b)b.remove();render();window.scrollTo(0,0);
}
function seatClash(){
  if($('#clashBar'))return;
  const d=document.createElement('div');d.id='clashBar';d.className='bar';
  d.innerHTML=`<span>另一台平板也用 <b>${esc(pName(me.seat))}</b> 的名字在作答。請確認這是你；不是的話按「登出」重新選，或找老師。</span><button type="button" class="btn">我知道了</button>`;
  document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove();
}

const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5 V8 a4 4 0 0 1 8 0 v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';

/* ---------- rewards ---------- */
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
function award(id){if(state.badges[id])return;state.badges[id]=Date.now();const b=BADGES.find(x=>x.id===id);if(state.run)state.run.newBadges=(state.run.newBadges||[]).concat(id);toast(`解鎖徽章 <b>${b.name}</b>`)}
function gain(n,label){
  const r=state.run;if(r&&r.replay)return 0;
  const before=rankOf(state.xp);state.xp+=n;if(r){r.earned=r.earned||{};r.earned[label]=(r.earned[label]||0)+n}
  const after=rankOf(state.xp);
  if(after>before){toast(`升級！你現在是 <b>${RANKS[after].t}</b>`);if(r)r.rankUp=RANKS[after].t;if(after===RANKS.length-1)award('top')}
  return n;
}
function bumpStreak(ok){
  state.streak=ok?state.streak+1:0;
  state.bestStreak=Math.max(state.bestStreak,state.streak);
  [5,10,20,30].forEach(n=>{if(state.streak>=n)award('combo'+n)});
}

/* ---------- home ---------- */
function rankCard(){
  const i=rankOf(state.xp),cur=RANKS[i],nx=RANKS[i+1];
  const pct=nx?Math.round((state.xp-cur.xp)/(nx.xp-cur.xp)*100):100;
  return `<div class="rank"><div class="lv"><div><small>LV</small><b>${i+1}</b></div></div>
    <div class="rank-t"><h2>${cur.t}</h2><span>${state.xp} XP${nx?`・再 ${nx.xp-state.xp} XP 升「${nx.t}」`:'・已經是最高等級'}</span></div>
    <div class="xpbar" role="progressbar" aria-label="經驗值" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>`;
}
function mapHTML(){

    }

    const x=Math.round(Math.sin(i*0.95)*72);
    const label=l.type==='theme'?String(++no):l.type==='review'?'複':'頂';
    const status=!open?'未解鎖':inRun?'繼續挑戰':st.cleared?`已過關，最佳 ${st.best}/${st.total||sizeOf(l)}`:'開始挑戰';
    const side=x>0?'l':'r';
    let pal='';
    if(l.fig){const got=!!state.figs[l.fig];pal=`<button type="button" class="pal ${side}${got?'':' locked'}" data-fig="${l.fig}" aria-label="公仔：${got?FIGS[l.fig].name:'還沒蒐集到'}">${figSVG(l.fig)}<small>${got?FIGS[l.fig].name:'？？？'}</small></button>`}
    else{const b=BADGES.find(z=>z.id===l.badge),got=!!state.badges[b.id];pal=`<div class="pal ${side}${got?'':' locked'}"><span class="medal">${b.m}</span><small>${b.name}</small></div>`}
    h+=`<div class="row" style="--x:${x}px">${pal}<div class="spot" style="--c:${U.c}">
      ${i===cur?`<span class="bubble">${inRun?'繼續':'開始'}</span>`:''}
      <button type="button" class="node ${l.type}${i===cur?' cur':''}" id="node-${l.id}" style="--c:${U.c}" data-start="${l.id}" ${open?'':'disabled'} aria-label="${l.name}，${sizeOf(l)} 題，${status}">${open?label:LOCK}</button>
      <div class="stars" aria-label="${st.stars||0} 顆星">${starsHTML(st.stars||0)}</div>
      <div class="nl"><b>${l.name}</b><small>${sizeOf(l)} 題${inRun?'・進行中':st.cleared?`・最佳 ${st.best}/${st.total||sizeOf(l)}`:''}</small></div>
    </div></div>`;
  });
  return h;
}

      <ul><li>每學完兩個主題，會遇到一個<b>複習站</b>，從前面兩關抽 20 題，錯過的題目優先出。</li><li>主題關過關送一隻<b>公仔</b>，複習站過關送一枚<b>徽章</b>。</li><li>第一輪答對 +${XP.first} XP，連對 3 題以上每題再 +${XP.combo}；過關 +${XP.clear}，第一輪全對再 +${XP.perfect}。</li><li>星星看第一輪：答對九成 ★★★、七成 ★★、其他 ★。過關後可以重玩刷星星，但不再加 XP。</li></ul></div>

    <section><div class="block-h"><h2>徽章</h2><small>${Object.keys(state.badges).length} / ${BADGES.length}・最高連對 ${state.bestStreak} 題</small></div>
     <div class="badges">${BADGES.map(b=>`<div class="badge${state.badges[b.id]?'':' locked'}"><span class="medal">${b.m}</span><div><b>${b.name}</b><small>${b.desc}</small></div></div>`).join('')}</div></section>
    <section><div class="block-h"><h2>錯題本</h2><small>${wb.length} 題待救回</small></div>
     ${wb.length?`<p class="muted" style="margin:0 0 8px;font-size:15px">在複習站或錯題特訓答對，題目就會從這裡畢業。</p><p style="margin:0 0 10px"><button type="button" class="btn primary" id="drillBtn">錯題特訓（${Math.min(15,wb.length)} 題）</button></p>
      <div class="wb">${wb.map(q=>`<details data-q="${q.id}"><summary><span class="n">第 ${q.n} 題</span><span class="s">${q.s}</span><span class="c">錯 ${state.wrong[q.id]||1} 次</span></summary><div class="wbody"></div></details>`).join('')}</div>`
